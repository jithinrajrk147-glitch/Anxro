<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ANXRO - All in One Business & Productivity App with offline support">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ANXRO">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ANXRO - Pro Fit</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Apple Touch Icons - Old B Logo -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="apple-touch-icon" sizes="192x192" href="logo.png">
    <link rel="apple-touch-icon" sizes="512x512" href="logo.png">

    <!-- Favicon - Old B Logo -->
    <link rel="icon" href="logo.png">

    <!-- Preload critical resources -->
    <link rel="preload" href="logo.png" as="image">
    <link rel="preload" href="Bungee-Regular.ttf" as="font" type="font/ttf" crossorigin>

    <style>
        /* Inline critical CSS for instant render */
        @font-face{font-family:'Bungee';src:url('Bungee-Regular.ttf') format('truetype');font-display:swap}
        *{margin:0;padding:0;box-sizing:border-box}
        body,html{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Roboto Slab',serif}
        .canvas{display:flex;align-items:center;justify-content:center;min-width:300px;transition:opacity .8s ease-in-out}
        .logo-img{height:27vh;width:auto;flex-shrink:0;z-index:10;transform:translateY(2vh);animation:logoFocus 4s cubic-bezier(.85,0,.15,1) forwards;will-change:transform}
        .brand-text-container{display:flex;align-items:center;overflow:hidden;max-width:500px;animation:typingRetract 4s cubic-bezier(.85,0,.15,1) forwards;will-change:max-width,opacity}
        .brand-text{font-family:'Bungee',sans-serif;color:#fff;font-size:8vw;letter-spacing:1.5px;white-space:nowrap;margin-left:7px;padding-right:10px}
        @keyframes logoFocus{0%,30%{transform:translateY(2vh) scale(1)}100%{transform:translateY(0) scale(1.6)}}
        @keyframes typingRetract{0%,40%{max-width:500px;opacity:1}100%{max-width:0;opacity:0}}
        .bg-glow{position:absolute;width:100%;height:100%;background:radial-gradient(circle at center,#1a1a1a 0%,#000 85%);z-index:-1}

        /* Install prompt styles */
        .install-prompt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:15px 25px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);display:none;align-items:center;gap:15px;z-index:1000;font-family:Arial,sans-serif;max-width:90%;animation:slideUp 0.3s ease-out}
        .install-prompt.show{display:flex}
        .install-btn{background:#fff;color:#1a1a1a;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}
        .install-btn:hover{background:#f0f0f0}
        .close-prompt{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 5px}
        @keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

        /* ── BOTTOM LOADER (first load only) ── */
        #bottom-loader {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 999;
            display: none;
            flex-direction: column;
            gap: 0;
        }

        #loader-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 14px 5px;
            background: rgba(0,0,0,0.7);
        }

        #loader-label {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #loader-counter {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

        #loader-counter span {
            color: #f5a623;
        }

        #loader-track {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.06);
        }

        #loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #f5a623, #00e5ff);
            background-size: 200% 100%;
            transition: width 0.2s ease;
            animation: loaderShimmer 1.8s linear infinite;
            box-shadow: 0 0 6px rgba(0,229,255,0.4);
        }

        @keyframes loaderShimmer {
            0%   { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="canvas" id="intro-canvas">
        <img src="logo.png" alt="ANXRO Logo" class="logo-img" width="200" height="200">
        <div class="brand-text-container">
            <div class="brand-text">LACK STRINGS</div>
        </div>
    </div>

    <!-- Install Prompt -->
    <div class="install-prompt" id="installPrompt">
        <span>📱 Install ANXRO app for offline access!</span>
        <button class="install-btn" id="installBtn">Install</button>
        <button class="close-prompt" id="closePrompt">×</button>
    </div>

    <!-- Bottom Loader (first load only) -->
    <div id="bottom-loader">
        <div id="loader-info">
            <span id="loader-label">Caching files…</span>
            <span id="loader-counter"><span id="done-num">0</span> / <span id="total-num">0</span></span>
        </div>
        <div id="loader-track">
            <div id="loader-fill"></div>
        </div>
    </div>

    <script>
        // ── All assets from sw.js ──
        const CORE_ASSETS = [
            '/Anxro/',
            '/Anxro/index.html',
            '/Anxro/ANXRO.html',
            '/Anxro/offline.html',
            '/Anxro/manifest.json',
            '/Anxro/anxro-logo.png',
            '/Anxro/load.png',
            '/Anxro/Bungee-Regular.ttf'
        ];
        const EXTENDED_ASSETS = [
            '/Anxro/mainprof.html',
            '/Anxro/ai.html',
            '/Anxro/calculator.html',
            '/Anxro/calandar.html',
            '/Anxro/barcode.html',
            '/Anxro/code.html',
            '/Anxro/crpconvert.html',
            '/Anxro/dotoday.html',
            '/Anxro/habit.html',
            '/Anxro/note.html',
            '/Anxro/libary.html',
            '/Anxro/apps.json',
            '/Anxro/blog.json',
            '/Anxro/courses.json',
            '/Anxro/audio.json',
            '/Anxro/papers.json'
        ];
        const IMAGE_ASSETS = [
            '/Anxro/ai.png',
            '/Anxro/calculator.png',
            '/Anxro/calendar.png',
            '/Anxro/blockchain.png',
            '/Anxro/code.png',
            '/Anxro/note.png',
            '/Anxro/library.png',
            '/Anxro/home.png'
        ];
        const ALL_ASSETS     = [...CORE_ASSETS, ...EXTENDED_ASSETS, ...IMAGE_ASSETS];
        const FIRST_LOAD_KEY = 'anxro_preloaded_v1.3.0';

        // ── Loader UI refs ──
        const bottomLoader = document.getElementById('bottom-loader');
        const loaderFill   = document.getElementById('loader-fill');
        const doneNum      = document.getElementById('done-num');
        const totalNum     = document.getElementById('total-num');
        const loaderLabel  = document.getElementById('loader-label');

        const TOTAL = ALL_ASSETS.length;
        let done = 0;

        totalNum.textContent = TOTAL;

        function updateLoader() {
            done++;
            const pct = (done / TOTAL) * 100;
            loaderFill.style.width = pct + '%';
            doneNum.textContent = done;
            if (done === TOTAL) loaderLabel.textContent = 'Ready ✓';
        }

        async function preloadAll() {
            bottomLoader.style.display = 'flex';
            const fetches = ALL_ASSETS.map(url =>
                fetch(url, { cache: 'force-cache' })
                    .then(() => updateLoader())
                    .catch(() => updateLoader())
            );
            await Promise.allSettled(fetches);
            localStorage.setItem(FIRST_LOAD_KEY, '1');
            // hide loader after short pause
            setTimeout(() => { bottomLoader.style.display = 'none'; }, 600);
        }

        // ── Service Worker Registration ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered successfully:', registration.scope);
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 New version available! Refresh to update.');
                                }
                            });
                        });

                        // Only preload on first open
                        if (!localStorage.getItem(FIRST_LOAD_KEY)) {
                            preloadAll();
                        }
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // ── Install Prompt Handler ──
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn    = document.getElementById('installBtn');
        const closePrompt   = document.getElementById('closePrompt');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => { installPrompt.classList.add('show'); }, 3000);
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            deferredPrompt = null;
            installPrompt.classList.remove('show');
        });

        closePrompt.addEventListener('click', () => {
            installPrompt.classList.remove('show');
        });

        window.addEventListener('appinstalled', () => {
            console.log('✅ ANXRO PWA installed successfully!');
            deferredPrompt = null;
        });

        // ── Redirect after intro animation ──
        const canvas = document.getElementById('intro-canvas');
        setTimeout(() => {
            canvas.style.opacity = '0';
            setTimeout(() => window.location.href = "mainprof.html", 800);
        }, 4000);
    </script>
</body>
</html>
