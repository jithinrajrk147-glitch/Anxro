<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black String - Pro Fit</title>
    <style>

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Roboto Slab', serif;
        }

        .canvas {
            display: flex;
            align-items: center; 
            justify-content: center;
            /* Fixed width ensures the logo doesn't jump when text vanishes */
            min-width: 300px; 
            transition: opacity 0.8s ease-in-out;
        }

        .logo-img {
            height: 27vh;
            width: auto;
            flex-shrink: 0;
            z-index: 10;
            transform: translateY(2vh);
            /* Combined animations for a single smooth flow */
            animation: logoFocus 4s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        .brand-text-container {
            display: flex;
            align-items: center;
            overflow: hidden;
            /* Starts visible, animates to 0 width */
            max-width: 500px;
            animation: typingRetract 4s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

       @font-face {
  font-family: 'Bungee';
  src: url('Bungee-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

.brand-text {
  font-family: 'Bungee', sans-serif; /* ← this is the key line */
  color: #ffffff;
  font-size: 8vw;
  letter-spacing: 1.5px;
  white-space: nowrap;
  margin-left: 7px;
  padding-right: 10px;
}
            

        /* LOGO: Slides up and scales up as text disappears */
        @keyframes logoFocus {
            0%, 30% { transform: translateY(2vh) scale(1); }
            100% { transform: translateY(0) scale(1.6); }
        }

        /* TEXT: Shrinks width and fades out simultaneously to prevent "snapping" */
        @keyframes typingRetract {
            0%, 40% { max-width: 500px; opacity: 1; }
            100% { max-width: 0; opacity: 0; }
        }

        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 85%);
            z-index: -1;
        }
    </style>
</head>
<body id="body-trigger">

    <div class="bg-glow"></div>

    <div class="canvas" id="intro-canvas">
        <img src="logo.png" alt="B" class="logo-img">
        <div class="brand-text-container">
            <div class="brand-text">LACK STRING</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('intro-canvas');

        // Wait for animation to finish (4s) then fade and redirect
        setTimeout(() => {
            canvas.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = "mainprof.html";
            }, 800); // Wait for the fade-out to complete
        }, 4000);
    </script>

</body>
</html>
