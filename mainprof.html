<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anxro | Authentication</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <script>if(localStorage.getItem('userProfile'))window.location.replace('third.html');</script>

    <style>
        :root {
            --bg: #010d08;
            --card: #062d1f;
            --accent: #10b981;
            --input-bg: #041a12;
            --text: #fff;
            --text-muted: #a7f3d0;
            --border: rgba(16,185,129,.15);
            --glow: rgba(16,185,129,.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background effects */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(16,185,129,.07) 0%, transparent 65%);
            pointer-events: none;
            animation: drift 8s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(6,45,31,.6) 0%, transparent 70%);
            pointer-events: none;
            animation: drift 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(4%,3%) scale(1.05); }
        }

        /* Grid texture */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(16,185,129,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Card */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 400px;
            background: linear-gradient(145deg, rgba(6,45,31,.95), rgba(4,26,18,.98));
            border-radius: 32px;
            padding: 0;
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(16,185,129,.05),
                0 30px 80px rgba(0,0,0,.6),
                0 0 60px rgba(16,185,129,.04);
            overflow: hidden;
            animation: slideUp .5s cubic-bezier(.22,1,.36,1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header strip */
        .card-header {
            padding: 28px 28px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-mark {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: var(--bg);
            letter-spacing: -1px;
            flex-shrink: 0;
        }
        .app-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: .5px;
            color: #fff;
        }
        .app-name span { color: var(--accent); }

        /* Tabs */
        .tabs-wrap {
            padding: 20px 28px 0;
        }
        .tabs {
            display: flex;
            background: var(--input-bg);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--border);
            gap: 4px;
        }
        .tabs button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            background: none;
            color: rgba(167,243,208,.5);
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: .4px;
            cursor: pointer;
            transition: all .25s ease;
        }
        .tabs button.active {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 4px 16px rgba(16,185,129,.35);
        }

        /* Form body */
        .form-body {
            padding: 24px 28px 28px;
        }

        /* Avatar */
        .avatar-section {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 26px;
            cursor: pointer;
        }
        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--accent), transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar-section img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(16,185,129,.3);
            display: block;
        }
        .edit-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent);
            color: var(--bg);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            border: 2px solid #010d08;
            transition: transform .2s;
        }
        .avatar-section:hover .edit-icon { transform: scale(1.15); }

        /* Input fields */
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(167,243,208,.4);
            font-size: 14px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 40px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: #fff;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-group input::placeholder { color: rgba(167,243,208,.35); }
        .input-group input:focus {
            border-color: rgba(16,185,129,.45);
            box-shadow: 0 0 0 3px rgba(16,185,129,.08);
        }
        /* Date input fix */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(.3);
            cursor: pointer;
        }

        /* Terms */
        .terms-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 20px;
            padding: 12px 14px;
            background: rgba(16,185,129,.04);
            border-radius: 12px;
            border: 1px solid rgba(16,185,129,.08);
        }
        .terms-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }
        .terms-text {
            font-size: 12.5px;
            color: rgba(167,243,208,.6);
            line-height: 1.4;
        }
        .terms-text a { color: var(--accent); text-decoration: none; }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: var(--bg);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .4px;
            cursor: pointer;
            transition: transform .18s, box-shadow .18s;
            box-shadow: 0 8px 28px rgba(16,185,129,.3);
            position: relative;
            overflow: hidden;
        }
        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
            border-radius: inherit;
        }
        .submit-btn:hover {
            box-shadow: 0 12px 36px rgba(16,185,129,.45);
            transform: translateY(-1px);
        }
        .submit-btn:active { transform: scale(.97); }

        /* Login panel */
        .login-icon-wrap {
            text-align: center;
            padding: 6px 0 22px;
        }
        .fp-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(16,185,129,.2), rgba(4,26,18,.8));
            border: 1px solid rgba(16,185,129,.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--accent);
            box-shadow: 0 0 30px rgba(16,185,129,.15);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 20px rgba(16,185,129,.12); }
            50%      { box-shadow: 0 0 40px rgba(16,185,129,.28); }
        }
        .login-icon-wrap h3 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .login-icon-wrap p {
            font-size: 12.5px;
            color: rgba(167,243,208,.5);
        }

        /* Modal */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: linear-gradient(145deg, #062d1f, #041a12);
            width: 88%;
            max-width: 310px;
            padding: 32px 24px 24px;
            border-radius: 28px;
            border: 1px solid rgba(16,185,129,.25);
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 40px rgba(16,185,129,.08);
            animation: popIn .35s cubic-bezier(.175,.885,.32,1.275);
        }
        @keyframes popIn {
            from { transform: scale(.8) translateY(10px); opacity: 0; }
            to   { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-icon-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: rgba(16,185,129,.1);
            border: 1px solid rgba(16,185,129,.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box i { font-size: 26px; color: var(--accent); }
        .modal-box h3 {
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal-box p {
            color: rgba(167,243,208,.6);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .modal-close {
            background: linear-gradient(135deg, #10b981, #059669);
            color: var(--bg);
            border: none;
            padding: 13px 32px;
            border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16,185,129,.3);
            transition: transform .15s;
        }
        .modal-close:active { transform: scale(.96); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="auth-container">
        <!-- Header -->
        <div class="card-header">
            <div class="logo-mark">Ax</div>
            <div class="app-name">Anx<span>ro</span></div>
        </div>

        <!-- Tabs -->
        <div class="tabs-wrap">
            <div class="tabs">
                <button id="tabNew" class="active" onclick="switchMode('new')">Register</button>
                <button id="tabLogin" onclick="switchMode('login')">Sync</button>
            </div>
        </div>

        <!-- Register Form -->
        <div class="form-body" id="formNew">
            <div class="avatar-section" onclick="document.getElementById('fileIn').click()">
                <div class="avatar-ring"></div>
                <img src="https://via.placeholder.com/100?text=+" id="avatarImg" alt="Avatar" width="88" height="88">
                <div class="edit-icon"><i class="fa fa-camera"></i></div>
                <input type="file" id="fileIn" class="hidden" accept="image/*" onchange="preview(event)">
            </div>

            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="name" placeholder="Full Name" autocomplete="name">
            </div>
            <div class="input-group">
                <i class="fa fa-calendar"></i>
                <input type="date" id="dob" autocomplete="bday">
            </div>
            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="number" id="code" placeholder="Create 5-Digit Code" oninput="limit(this)" inputmode="numeric">
            </div>

            <div class="terms-wrapper">
                <input type="checkbox" id="agreeCheck">
                <div class="terms-text">I agree to the <a href="#">Terms &amp; Privacy Policy</a></div>
            </div>

            <button class="submit-btn" onclick="onRegister()">
                <i class="fa fa-arrow-right" style="margin-right:8px"></i>Create Profile
            </button>
        </div>

        <!-- Login Form -->
        <div class="form-body hidden" id="formLogin">
            <div class="login-icon-wrap">
                <div class="fp-circle">
                    <i class="fa fa-fingerprint"></i>
                </div>
                <h3>Security Sync</h3>
                <p>Enter your code to access your profile</p>
            </div>

            <div class="input-group">
                <i class="fa fa-key"></i>
                <input type="number" id="loginCode" placeholder="Enter 5-Digit Code" oninput="limit(this)" inputmode="numeric">
            </div>

            <button class="submit-btn" onclick="onLogin()" style="margin-top:8px">
                <i class="fa fa-shield-halved" style="margin-right:8px"></i>Verify &amp; Open
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div class="custom-modal" id="alertModal">
        <div class="modal-box">
            <div class="modal-icon-wrap">
                <i id="modalIcon" class="fa fa-circle-exclamation"></i>
            </div>
            <h3 id="modalTitle">Notice</h3>
            <p id="modalMsg">Please fill in all details.</p>
            <button class="modal-close" onclick="closeModal()">Got it</button>
        </div>
    </div>

    <script>
        const showAlert=(t,m,i="fa-circle-exclamation")=>{
            document.getElementById('modalTitle').innerText=t;
            document.getElementById('modalMsg').innerText=m;
            document.getElementById('modalIcon').className="fa "+i;
            document.getElementById('alertModal').style.display="flex";
        };
        const closeModal=()=>document.getElementById('alertModal').style.display="none";
        const switchMode=m=>{
            document.getElementById('formNew').classList.toggle('hidden',m!=='new');
            document.getElementById('formLogin').classList.toggle('hidden',m!=='login');
            document.getElementById('tabNew').classList.toggle('active',m==='new');
            document.getElementById('tabLogin').classList.toggle('active',m==='login');
        };
        const limit=e=>{if(e.value.length>5)e.value=e.value.slice(0,5)};
        const preview=e=>{
            const reader=new FileReader();
            reader.onload=()=>document.getElementById('avatarImg').src=reader.result;
            reader.readAsDataURL(e.target.files[0]);
        };
        const onRegister=()=>{
            const n=document.getElementById('name').value;
            const d=document.getElementById('dob').value;
            const c=document.getElementById('code').value;
            const img=document.getElementById('avatarImg').src;
            const agree=document.getElementById('agreeCheck').checked;
            if(!n||!d||c.length!==5||img.includes('placeholder')){
                showAlert("Missing Info","Please complete all fields and upload a photo.");return;
            }
            if(!agree){
                showAlert("Terms Required","You must agree to the terms to continue.");return;
            }
            localStorage.setItem('userProfile',JSON.stringify({name:n,dob:d,userId:c,avatar:img}));
            showAlert("Success 🎉","Profile Created! Redirecting...","fa-circle-check");
            setTimeout(()=>window.location.href="third.html",1500);
        };
        const onLogin=()=>{
            const c=document.getElementById('loginCode').value;
            const saved=JSON.parse(localStorage.getItem('userProfile'));
            if(saved&&c===saved.userId){
                showAlert("Verified","Welcome back!","fa-circle-check");
                setTimeout(()=>window.location.href="third.html",1000);
            }else{
                showAlert("Sync Failed","Incorrect code or no local profile found.");
            }
        };
    </script>
</body>
</html>
