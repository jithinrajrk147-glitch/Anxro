<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Master Mobile Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --surface-light: #1e1e1e;
            --primary: #00ff9d;
            --primary-dim: rgba(0, 255, 157, 0.1);
            --text-main: #ffffff;
            --text-sec: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(18, 18, 18, 0.85);
            --blur: 20px;
            --radius: 16px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --mini-gap: 80px; /* gap between mini player and full-screen player; adjust to taste */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text-main);
            margin: 0; overflow: hidden; height: 100vh;
        }

        /* --- FIXED HEADER --- */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--glass);
            backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
            z-index: 100; border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-container { padding: 15px 15px 10px; }
        .search-input-wrapper { position: relative; width: 100%; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sec); width: 18px; }

        #searchInput {
            width: 100%; background: var(--surface-light);
            border: 1px solid transparent; border-radius: 12px;
            padding: 12px 12px 12px 40px; color: white;
            font-size: 15px; outline: none; transition: all 0.2s;
        }
        #searchInput:focus { background: #252525; border-color: var(--primary); }

        /* --- FIXED NAV BAR (Fits Screen) --- */
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 15px 15px; width: 100%;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; cursor: pointer; opacity: 0.5; transition: 0.2s;
        }
        .nav-item.active { opacity: 1; color: var(--primary); }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; }

        /* --- CONTENT --- */
        .main-content {
            height: 100vh; overflow-y: auto;
            padding: 160px 15px 120px; /* Top pad clears header */
            -webkit-overflow-scrolling: touch;
        }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .media-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            transition: transform 0.2s;
            position: relative;
        }
        .media-card:active { transform: scale(0.98); }
        .card-img-wrap { width: 100%; aspect-ratio: 1; overflow: hidden; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-title { font-size: 13px; font-weight: 500; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* Capsule for papers/blog/courses (loaded from JSON as `imf`) */
        .item-capsule {
            display: inline-block;
            font-size: 10px;
            padding: 6px 8px;
            border-radius: 999px;
            background: var(--primary-dim);
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Blog */
        .blog-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .blog-tag { font-size: 9px; background: var(--primary-dim); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 6px; }

        /* --- MINI PLAYER --- */
        #miniPlayer {
            position: fixed;
            bottom: calc(var(--mini-gap) + var(--safe-bottom)); /* moved up by the gap */
            left: 15px; right: 15px; height: 64px;
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
            display: none; align-items: center; padding: 0 8px; z-index: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .mini-art { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; margin-right: 12px; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- FULL PLAYER MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column; padding: var(--safe-top) 20px var(--safe-bottom);
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        /* Ensure the full-audio player reserves extra bottom space so it doesn't butt up against the mini player */
        #fullAudioPlayer.modal-overlay {
            padding: var(--safe-top) 20px calc(var(--safe-bottom) + var(--mini-gap));
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .fa-art-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        #fa-img { width: 100%; aspect-ratio: 1; max-height: 350px; object-fit: cover; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 255, 157, 0.15); }
        
        .progress-area { width: 100%; height: 30px; display: flex; align-items: center; margin-top: 20px; }
        .progress-bar-bg { width: 100%; height: 4px; background: #333; border-radius: 2px; position: relative; width: 100%; }
        #progFill { height: 100%; background: var(--primary); width: 0%; border-radius: 2px; position: relative; }
        #progFill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .play-circle-lg {
            width: 70px; height: 70px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000;
            box-shadow: 0 10px 40px rgba(0, 255, 157, 0.4);
        }

        /* Offline modal specific */
        #offlineModal { display: none; z-index: 1500; align-items: center; justify-content: center; }
        #offlineModal .offline-card {
            background: var(--surface); padding: 18px; border-radius: 12px; width: 90%; max-width: 360px; text-align:center;
            border: 1px solid var(--border);
        }
        #offlineModal .offline-card h3 { margin: 0 0 8px; }
        #offlineModal .offline-actions { display:flex; gap:8px; margin-top:12px; }

        /* --- TOASTS (Custom, No System Popups) --- */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000; pointer-events: none; width: 90%; max-width: 350px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(20, 20, 20, 0.95); border: 1px solid var(--border); border-left: 3px solid var(--primary);
            color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            animation: slideDownFade 0.4s ease forwards; display: flex; align-items: center; gap: 10px;
        }
        @keyframes slideDownFade { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* Viewer */
        #docViewer { background: #f5f5f7; }
        .doc-header { display: flex; align-items: center; padding: 10px 0 15px; border-bottom: 1px solid #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>
    <iframe src="loader.html" id="app-loader" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    z-index: 999999;
    background: white; /* Start solid white */
    transition: opacity 0.8s ease;
"></iframe>

<script>
    // Detect when the background page is fully loaded
    window.addEventListener('load', function() {
        const loader = document.getElementById('app-loader');
        
        // Wait for the logo merge animation to finish (approx 3 seconds)
        setTimeout(() => {
            loader.style.opacity = "0"; // Fade out
            setTimeout(() => {
                loader.remove(); // Delete from page
            }, 800);
        }, 3000); 
    });
</script>


    <header class="app-header">
        <div class="search-container">
            <div class="search-input-wrapper">
                <i data-feather="search" class="search-icon"></i>
                <input type="search" id="searchInput" placeholder="Search library..." onkeyup="globalSearch()">
            </div>
        </div>
        <nav class="nav-bar">
            <div class="nav-item active" onclick="switchTab('audio', this)"><i data-feather="headphones"></i><span>Audio</span></div>
            <div class="nav-item" onclick="switchTab('textbook', this)"><i data-feather="book"></i><span>Books</span></div>
            <div class="nav-item" onclick="switchTab('papers', this)"><i data-feather="file-text"></i><span>Papers</span></div>
            <div class="nav-item" onclick="switchTab('blog', this)"><i data-feather="rss"></i><span>Blog</span></div>
            <div class="nav-item" onclick="switchTab('courses', this)"><i data-feather="monitor"></i><span>Course</span></div>
        </nav>
    </header>

    <main class="main-content">
        <div id="audio" class="section active"><div class="grid-layout" id="audio-grid"></div></div>
        <div id="textbook" class="section"><div class="grid-layout" id="textbook-grid"></div></div>
        <div id="papers" class="section"><div class="grid-layout" id="papers-grid"></div></div>
        <div id="blog" class="section"><div id="blog-list"></div></div>
        <div id="courses" class="section"><div class="grid-layout" id="courses-grid"></div></div>
    </main>

    <div id="miniPlayer" onclick="openFullAudio()">
        <img id="m-img" class="mini-art" src="">
        <div class="mini-info"><div id="m-title" class="mini-title">Title</div></div>
        <!-- play/pause icon as image src (will be updated by JS) -->
        <div style="width:36px; display:flex; align-items:center; justify-content:center;">
            <img id="p-mini-icon" src="" style="width:20px; height:20px; display:block;" alt="play/pause">
        </div>
    </div>

    <div id="fullAudioPlayer" class="modal-overlay">
        <div style="display:flex; justify-content:space-between; align-items:center; height:60px;">
            <i data-feather="chevron-down" onclick="closeFullAudio()" style="color:#888; cursor:pointer"></i>
            <span style="font-size:11px; font-weight:700; letter-spacing:1px; color:#666;">PLAYING</span>
            <div style="width:24px"></div>
        </div>
        <div class="fa-art-container"><img id="fa-img" src=""></div>
        <div style="padding-bottom:20px;">
            <h2 id="fa-title" style="margin:0 0 5px; font-size:20px; text-align:center;">Title</h2>
            <div class="progress-area" id="seekHandler"><div class="progress-bar-bg"><div id="progFill"></div></div></div>
            <div style="display:flex; justify-content:space-between; font-size:11px; color:#666; margin-top:8px;">
                <span id="currTime">0:00</span><span id="durTime">0:00</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 10px 0;">
                <i data-feather="skip-back" onclick="skip(-15)"></i>
                <div class="play-circle-lg" onclick="togglePlay()">
                    <!-- full player play/pause icon as image -->
                    <img id="p-full-icon" src="" style="width:28px; height:28px;" alt="play/pause">
                </div>
                <i data-feather="skip-forward" onclick="skip(15)"></i>
            </div>
        </div>
    </div>

    <div id="docViewer" class="modal-overlay">
        <div class="doc-header">
            <i data-feather="x" onclick="closeDoc()" style="color:#333; cursor:pointer; margin-right:15px"></i>
            <span id="doc-title" style="font-weight:600; color:#000;">Document</span>
        </div>
        <iframe id="docFrame" style="width:100%; height:100%; border:none;" src=""></iframe>
    </div>

    <!-- Offline modal -->
    <div id="offlineModal" class="modal-overlay" style="display:none; align-items:center;">
        <div class="offline-card">
            <h3>No internet connection</h3>
            <p style="color:var(--text-sec); margin:8px 0 0;">You're offline. Some content may not load. Retry when you're online.</p>
            <div class="offline-actions">
                <button onclick="retryOnline()" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--primary); color:#000; font-weight:700">Retry</button>
                <button onclick="dismissOffline()" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-main)">Dismiss</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <audio id="mainAudio"></audio>

    <script>
        let APP_DATA = { audio: [], textbook: [], papers: [], blog: [], courses: [] };
        const audio = document.getElementById('mainAudio');
        let isDragging = false;

        // Inline SVG data URIs for play / pause icons (white icons)
        const PLAY_SVG_RAW = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><polygon points="5 3 19 12 5 21 5 3" fill="%23ffffff"/></svg>';
        const PAUSE_SVG_RAW = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><rect x="6" y="4" width="4" height="16" fill="%23ffffff"/><rect x="14" y="4" width="4" height="16" fill="%23ffffff"/></svg>';
        // Default src values. To use local PNGs, replace these with your local paths (see instructions below).
        let PLAY_SRC = 'data:image/svg+xml;utf8,' + PLAY_SVG_RAW;
        let PAUSE_SRC = 'data:image/svg+xml;utf8,' + PAUSE_SVG_RAW;

        async function init() {
            feather.replace();
            updateOnlineStatus(); // check online state first
            const sections = ['audio', 'textbook', 'papers', 'blog', 'courses'];
            
            for (const s of sections) {
                try {
                    const res = await fetch(`${s}.json`);
                    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                    APP_DATA[s] = await res.json();
                } catch (e) {
                    // Custom Toast - No System Alert
                    showToast(`Failed to load ${s}`, true);
                }
            }
            render();
            setupSeek();
            setupAudioListeners();

            // set initial icon srcs according to current state
            updateIcons(!audio.paused && !audio.ended);
        }

        function render(filter = "") {
            const term = filter.toLowerCase();
            
            ['audio', 'textbook', 'papers', 'courses'].forEach(key => {
                const grid = document.getElementById(`${key}-grid`);
                grid.innerHTML = (APP_DATA[key] || []).filter(i => (i.title || '').toLowerCase().includes(term)).map(item => {
                    // For papers, courses and blog show the capsule from item.imf (if present)
                    const hasImf = (key === 'papers' || key === 'courses');
                    const capsule = hasImf && item.imf ? `<div class="item-capsule">${escapeHtml(item.imf)}</div>` : '';
                    const cover = item.cover || '';
                    const file = item.file || '';
                    const title = item.title || '';
                    return `
                    <div class="media-card" onclick="openItem('${key}', '${file}', '${escapeJs(title)}', '${cover}')">
                        <div class="card-img-wrap"><img src="${cover}" loading="lazy" alt="${escapeHtml(title)}"></div>
                        <div class="card-info">
                            <div class="card-title">${escapeHtml(title)}</div>
                            ${capsule}
                        </div>
                    </div>
                    `;
                }).join('');
            });

            document.getElementById('blog-list').innerHTML = (APP_DATA.blog || []).filter(i => (i.title || '').toLowerCase().includes(term)).map(item => {
                const imf = item.imf ? `<div class="item-capsule">${escapeHtml(item.imf)}</div>` : '';
                const file = item.file || '';
                const title = item.title || '';
                return `
                <div class="blog-item" onclick="openItem('blog', '${file}', '${escapeJs(title)}', null)">
                    <div>
                        <span class="blog-tag">Read</span>
                        <div style="font-weight:600;">${escapeHtml(title)}</div>
                        ${imf}
                    </div>
                    <i data-feather="arrow-right" style="color:#666; width:16px;"></i>
                </div>
                `;
            }).join('');
            feather.replace();
        }

        // Sanitize helpers for inline attributes / HTML (minimal)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        // Escape single quotes for inline JS string usage
        function escapeJs(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'");
        }

        function openItem(type, file, title, cover) {
            if (type === 'audio') {
                document.getElementById('m-img').src = document.getElementById('fa-img').src = cover || '';
                document.getElementById('m-title').innerText = document.getElementById('fa-title').innerText = title || '';
                document.getElementById('miniPlayer').style.display = 'flex';
                audio.src = file || '';
                // play (catch autoplay block)
                audio.play().catch(() => {
                    // autoplay blocked — update icons to 'play' and show message
                    updateIcons(false);
                    showToast('Tap play to start audio');
                });
                showToast(`Playing: ${title}`);
            } 
            // Courses open in doc viewer (n.html)
            else if (type === 'courses') {
                showToast(`Opening Course: ${title}`);
                const courseUrl = `n.html?video=${encodeURIComponent(file)}&title=${encodeURIComponent(title)}`;
                document.getElementById('doc-title').innerText = title;
                document.getElementById('docFrame').src = courseUrl;
                document.getElementById('docViewer').style.display = 'flex';
            } 
            // Blog / Books / Papers logic
            else {
                // If this is a blog item handle links differently:
                if (type === 'blog') {
                    if (!file) {
                        showToast('No link available for this item', true);
                        return;
                    }
                    // treat common document extensions as "document"
                    const docRe = /\.(pdf|docx?|pptx?|xlsx?|xls|odt|rtf)(\?|#|$)/i;
                    const isDocument = docRe.test(file);
                    if (isDocument) {
                        // Open documents inside the doc viewer using Google Docs viewer
                        const url = `https://docs.google.com/gview?url=${encodeURIComponent(file)}&embedded=true`;
                        document.getElementById('doc-title').innerText = title;
                        document.getElementById('docFrame').src = url;
                        document.getElementById('docViewer').style.display = 'flex';
                    } else {
                        // Non-document links: open in a new tab (redirect to that link)
                        // If you prefer to redirect the current tab, replace window.open(...) with location.href = file;
                        window.open(file, '_blank');
                    }
                } else {
                    // Books and Papers: open via Google Docs viewer by default
                    const url = `https://docs.google.com/gview?url=${encodeURIComponent(file)}&embedded=true`;
                    document.getElementById('doc-title').innerText = title;
                    document.getElementById('docFrame').src = url;
                    document.getElementById('docViewer').style.display = 'flex';
                }
            }
        }


        function setupAudioListeners() {
            audio.addEventListener('timeupdate', () => {
                if(!isDragging && audio.duration) {
                    const pct = (audio.currentTime/audio.duration)*100;
                    document.getElementById('progFill').style.width = pct + '%';
                    document.getElementById('currTime').innerText = fmt(audio.currentTime);
                    document.getElementById('durTime').innerText = fmt(audio.duration);
                }
            });
            audio.addEventListener('play', () => {
                updateIcons(true);
                // ensure mini player visible when audio starts
                document.getElementById('miniPlayer').style.display = 'flex';
            });
            audio.addEventListener('pause', () => {
                updateIcons(false);
            });
            audio.addEventListener('ended', () => {
                updateIcons(false);
            });
            // Ensure if source changes without playing we set icons appropriately
            audio.addEventListener('stalled', () => updateIcons(!audio.paused && !audio.ended));
            audio.addEventListener('abort', () => updateIcons(false));
        }

        function setupSeek() {
            const h = document.getElementById('seekHandler');
            const handle = (e) => {
                const r = h.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const pct = Math.max(0, Math.min(1, (x - r.left)/r.width));
                document.getElementById('progFill').style.width = (pct*100)+'%';
                if(audio.duration) document.getElementById('currTime').innerText = fmt(pct*audio.duration);
                return pct;
            }
            h.addEventListener('mousedown', e => { isDragging=true; handle(e); });
            window.addEventListener('mousemove', e => { if(isDragging) handle(e); });
            window.addEventListener('mouseup', e => { if(isDragging) { audio.currentTime = handle(e)*audio.duration; isDragging=false; }});
            h.addEventListener('touchstart', e => { isDragging=true; handle(e); });
            h.addEventListener('touchmove', e => { if(isDragging) handle(e); });
            h.addEventListener('touchend', e => { if(isDragging) { audio.currentTime = handle(e)*audio.duration; isDragging=false; }});
        }

        function togglePlay() { 
            if (audio.paused) {
                audio.play().catch(()=>{ showToast('Tap to start playback'); });
            } else {
                audio.pause();
            }
        }

        // updateIcons sets image src for both mini and full player images
        function updateIcons(isPlaying) {
            try {
                const miniImg = document.getElementById('p-mini-icon');
                const fullImg = document.getElementById('p-full-icon');
                if (miniImg) miniImg.src = isPlaying ? PAUSE_SRC : PLAY_SRC;
                if (fullImg) fullImg.src = isPlaying ? PAUSE_SRC : PLAY_SRC;
            } catch (e) {
                console.warn('updateIcons error', e);
            }
        }

        function fmt(s) { return Math.floor(s/60) + ":" + ("0"+Math.floor(s%60)).slice(-2); }
        function skip(s) { audio.currentTime += s; }
        
        // Navigation & Modals
        function switchTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
        }
        function openFullAudio() { document.getElementById('fullAudioPlayer').style.display = 'flex'; }
        function closeFullAudio() { document.getElementById('fullAudioPlayer').style.display = 'none'; }
        function closeDoc() { document.getElementById('docViewer').style.display = 'none'; document.getElementById('docFrame').src = ""; }
        function globalSearch() { render(document.getElementById('searchInput').value); }

        // OFFLINE handling: show a single popup when offline
        function updateOnlineStatus() {
            const modal = document.getElementById('offlineModal');
            if (!navigator.onLine) {
                modal.style.display = 'flex';
                showToast('You are offline — some content may not load', true);
            } else {
                modal.style.display = 'none';
            }
        }
        window.addEventListener('online', () => {
            updateOnlineStatus();
            // try to re-fetch new content automatically
            fetchAllData();
            showToast('Back online');
        });
        window.addEventListener('offline', () => updateOnlineStatus());

        // Retry button in offline modal
        function retryOnline() {
            if (navigator.onLine) {
                document.getElementById('offlineModal').style.display = 'none';
                fetchAllData();
                showToast('Retrying to load content...');
            } else {
                showToast('Still offline', true);
            }
        }
        function dismissOffline() {
            document.getElementById('offlineModal').style.display = 'none';
        }

        // fetch only the JSON data (used on retry/online)
        async function fetchAllData() {
            const sections = ['audio', 'textbook', 'papers', 'blog', 'courses'];
            for (const s of sections) {
                try {
                    const res = await fetch(`${s}.json`);
                    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                    APP_DATA[s] = await res.json();
                } catch (e) {
                    showToast(`Failed to load ${s}`, true);
                }
            }
            render();
        }

        // Custom Toast System
        function showToast(msg, isErr=false) {
            const c = document.getElementById('toast-container');
            const d = document.createElement('div'); d.className = 'toast';
            if(isErr) d.style.borderLeftColor = '#ff4444';
            d.innerHTML = `<span>${msg}</span>`;
            c.appendChild(d);
            setTimeout(() => { d.style.opacity='0'; setTimeout(()=>d.remove(),300); }, 3000);
        }

        init();
    </script>
</body>
</html>
