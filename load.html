<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Search | Pro</title>
    <style>
    /* IMAGE GRID FIX - 2 PER ROW */

        :root {
            --bg: #050505;
            --accent: #00ff88;
            --text-main: #e8eaed;
            --text-dim: #9aa0a6;
            --link: #8ab4f8;
            --border: rgba(255, 255, 255, 0.1);
            --ai-gradient: linear-gradient(90deg, #00ff88, #00bdff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 1. TOP NAVIGATION */
        .header-fixed {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            padding: 50px 20px 0;
            width: 100%;
        }

         .search-wrapper {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 20;
        }

        .search-bar {
            width: 98%;
            background: #dce5dd;
            border: none;
            border-radius: 40px;
            padding: 13px 60px;
            color: #1a1a1a;
            font-size: 16px;
            outline: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            object-fit: contain;
            z-index: 21;
            cursor: pointer;
        }

        .icon-left { left: 15px; }
        .icon-right { right: 20px; } 

        /* DROPDOWN SUGGESTIONS */
        #search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 20px;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #search-suggestions.visible {
            display: block;
        }

        .suggestion-item {
            padding: 14px 25px;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            font-weight: 500;
        }

        .suggestion-item:hover, .suggestion-item.selected {
            background: #f0f0f0;
        }


        .icon-btn {
            position: absolute;
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 5;
        }

        .icon-btn:hover {
            filter: brightness(1.2);
        }
                /* GOOGLE PHOTOS STYLE IMAGE VIEWER */
        .viewer-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            inset: 0;
            background: rgba(5, 5, 5, 0.98);
            overflow-y: auto;
            padding: 30px 20px;
            backdrop-filter: blur(15px);
            animation: fadeIn 0.2s ease;
        }
        .viewer-modal.active { 
            display: block; 
        }
        .viewer-close {
            position: fixed;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 35px;
            font-weight: 300;
            cursor: pointer;
            z-index: 100000;
            transition: 0.2s;
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .viewer-close:hover { 
            background: rgba(255,255,255,0.2);
            color: var(--accent); 
        }
        .viewer-content {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .viewer-main-frame {
            width: 100%;
            height: 55vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d13;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 20px;
        }
        .viewer-main-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .viewer-details {
            padding: 5px 10px;
        }
        .viewer-source { 
            color: var(--accent); 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .viewer-desc { 
            color: var(--text-main); 
            font-size: 18px; 
            font-weight: 500; 
            line-height: 1.4;
        }
        .viewer-extra-section {
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }
        .viewer-extra-section h4 { 
            font-size: 14px; 
            color: var(--text-dim); 
            margin-bottom: 15px; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .viewer-extra-grid {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
        }
        .viewer-extra-grid::-webkit-scrollbar {
            height: 6px;
        }
        .viewer-extra-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
        .viewer-extra-card {
            min-width: 140px;
            width: 140px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            background: #161b22;
        }
        .viewer-extra-card:hover { 
            border-color: var(--accent); 
            transform: scale(1.04); 
        }
        .viewer-extra-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }


        .icon-left { left: 18px; }
        .icon-right { right: 18px; }

        /* SUGGESTIONS DROPDOWN - Fixed positioning */
        #search-suggestions {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 610px;
            background: #202124;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            z-index: 1001;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #search-suggestions.visible {
            max-height: 280px;
            overflow-y: auto;
            border-color: var(--accent);
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s;
            color: var(--text-main);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background-color: rgba(0, 255, 136, 0.1);
            color: var(--accent);
        }

        .suggestion-text {
            flex: 1;
            font-size: 14px;
        }

        .suggestion-icon {
            color: var(--text-dim);
            font-size: 12px;
            margin-left: 10px;
        }

        /* TABS NAVIGATION */
        .nav-tabs {
            max-width: 650px;
            margin: 20px auto 0;
            display: flex;
            gap: 20px;
            padding: 0 10px;
            overflow-x: auto;
            scrollbar-width: none;
            align-items: center;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab {
            font-size: 13px;
            color: var(--text-dim);
            padding: 8px 0;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        .tab:hover {
            color: var(--text-main);
        }

        /* AI MODE SPECIAL STYLE */
        .tab-ai {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s infinite;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 2. RESULTS LIST */
        #search-results {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 20px 100px;
        }

        .search-result {
            margin-bottom: 35px;
            display: block;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-title {
            font-size: 19px;
            color: var(--link);
            margin: 0;
            flex: 1;
        }

        .result-title a {
            color: inherit;
            text-decoration: none;
            transition: 0.2s;
        }

        .result-title a:hover {
            color: #a8d5ff;
            text-decoration: underline;
        }

        .result-title mark {
            background: var(--accent);
            color: var(--bg);
            padding: 2px 4px;
            border-radius: 2px;
        }

        .result-category {
            font-size: 11px;
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .result-url {
            font-size: 13px;
            color: var(--text-dim);
            margin: 6px 0;
        }

        .result-description {
            font-size: 14px;
            color: var(--text-dim);
            margin: 8px 0;
            line-height: 1.5;
        }

        .result-description mark {
            background: var(--accent);
            color: var(--bg);
            padding: 2px 4px;
            border-radius: 2px;
        }

        .result-keywords {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .keyword-tag {
            background: rgba(138, 180, 248, 0.15);
            color: var(--link);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(138, 180, 248, 0.3);
        }

        .result-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 8px;
        }

        .search-empty, .search-error {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .search-empty p, .search-error p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        /* IMAGE GRID */
        .img-grid { 
            max-width: 1000px; 
            margin: 3px auto; 
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Forces exactly 2 equal columns */
            gap: 26px; 
            padding: 0 2px 100px;
        }
        .img-card {
            background: #161b22;
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .img-card:hover { transform: scale(1.02); border-color: var(--accent); }
        .img-wrapper {
            width: 100%; aspect-ratio: 4/3; background: #0d1117;
            position: relative; overflow: hidden;
        }
        .img-wrapper img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .img-wrapper img.loaded { opacity: 1; }
        .skeleton {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
            background-size: 200% 100%; animation: loading 1.2s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .img-info { padding: 8px 12px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); }
        .img-source { color: var(--accent); font-weight: 600; margin-bottom: 4px; }

        @media (max-width: 600px) {
            .header-fixed {
                padding: 30px 15px 0;
            }

            .search-input {
                padding: 12px 45px;
                font-size: 14px;
            }

            .nav-tabs {
                margin: 15px auto 0;
                gap: 15px;
                padding: 0 5px;
            }

            .tab {
                font-size: 12px;
                padding: 6px 0;
            }

            .result-title {
                font-size: 16px;
            }

            .result-description {
                font-size: 13px;
            }

            .result-header {
                flex-direction: column;
            }

            .result-category {
                align-self: flex-start;
            }

            .img-grid { columns: 2 150px; }
        }
        /* FINE-TUNED VOICE POPUP SCREEN OVERLAY */
.anxro-voice-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 5, 0.95);
    backdrop-filter: blur(10px);
    z-index: 99999;
    align-items: center;
    justify-content: center;
}
.anxro-voice-popup.active {
    display: flex;
}
.anxro-voice-box {
    background: #161b22;
    padding: 35px 25px;
    border-radius: 24px;
    text-align: center;
    position: relative;
    width: 85%;
    max-width: 320px;
    border: 1px solid var(--border);
}
.anxro-voice-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
}
.anxro-voice-mic {
    background: rgba(255, 255, 255, 0.06);
    border: none;
    border-radius: 50%;
    width: 76px;
    height: 76px;
    margin: 24px 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}
.anxro-voice-mic svg {
    width: 32px;
    height: 32px;
    fill: #fff;
}
.anxro-voice-mic.listening {
    background: var(--accent);
    box-shadow: 0 0 25px var(--accent);
    transform: scale(1.05);
}
.anxro-voice-status {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
}

    </style>
</head>
<body>

<header class="header-fixed">
    <div class="search-wrapper">
        <img src="m.png" class="search-icon icon-left" alt="Earth" onclick="location.href='earth.html'">
        <input type="text" class="search-bar" id="search-input" placeholder="Search with Anxro..." autocomplete="off">
        <img src="n.png" class="search-icon icon-right" alt="Voice" onclick="startVoice()">
    </div>
    <div id="search-suggestions"></div>

    <nav class="nav-tabs">
        <div class="tab tab-ai" onclick="switchTab('ai')"><span class="ai-dot"></span> AI Mode</div>
        <div class="tab active" onclick="switchTab('all')">All</div>
        <div class="tab" onclick="switchTab('Tools')">Tools</div>
        <div class="tab" onclick="switchTab('images')">Images</div>
    </nav>
</header>

<main id="search-results"></main>
<script src="search.js"></script>

<script>
    let currentFilter = 'all';
    let allResults = [];
    const query = sessionStorage.getItem('searchQuery') || '';

    // Override SearchEngine's displayResults to respect our category filter
    function performSearch(searchQuery) {
        if (searchQuery.trim() && window.searchEngine) {
            allResults = window.searchEngine.search(searchQuery);
            sessionStorage.setItem('searchQuery', searchQuery);
            render(currentFilter);
        }
    }

    function render(filter) {
        const resultsDiv = document.getElementById('search-results');
        
        // IMAGE MODE
        if (filter === 'images') {
            const query = document.getElementById('search-input').value.trim() || sessionStorage.getItem('searchQuery') || 'nature';
            loadImages(query);
            return;
        }
        
        // AI Mode
        if (filter === 'ai') {
            resultsDiv.innerHTML = `
                <div class="search-result" style="cursor: default;">
                    <span class="result-title" style="color: var(--accent);">Nexus AI Assistant</span>
                    <p class="result-description">I am ready to help you build your next project. How can I assist you today?</p>
                </div>
            `;
            return;
        }

        // FILTER SYSTEM BASED ON YOUR NEW JSON "TYPE" UNIT
        let filtered = allResults;
        
        if (filter === 'Tools') {
            // If the "Tools" tab is active, strictly fetch items where type is 'tools'
            filtered = allResults.filter(item => item.type === 'tools');
        } else if (filter === 'all') {
            // Standard web results (everything that isn't strictly an standalone tool dashboard)
            filtered = allResults.filter(item => item.type === 'websites' || !item.type);
        }

        resultsDiv.innerHTML = '';

        if (filtered.length === 0) {
            resultsDiv.innerHTML = `<div class="search-empty"><p>No results found in this category.</p></div>`;
            return;
        }

        // Render matching items with query highlighting
        const queryLower = query.toLowerCase();
        filtered.forEach(item => {
            const highlightTitle = item.title.replace(
                new RegExp(`(${queryLower})`, 'gi'),
                '<mark>$1</mark>'
            );
            const highlightDesc = item.description.replace(
                new RegExp(`(${queryLower})`, 'gi'),
                '<mark>$1</mark>'
            );
            
            // FIXED: Use data attributes instead of onclick with URL
            const resultHtml = `
                <div class="search-result" data-id="${item.id}" data-url="${item.url}" data-type="website">
                    <div class="result-header">
                        <h3 class="result-title">
                            <a href="javascript:void(0);">${highlightTitle}</a>
                        </h3>
                        <span class="result-category">${item.type || 'website'}</span>
                    </div>
                    <p class="result-url">${item.url.substring(0, 60)}...</p>
                    <p class="result-description">${highlightDesc.substring(0, 150)}...</p>
                    ${item.keywords && item.keywords.length > 0 ? `
                        <div class="result-keywords">
                            ${item.keywords.slice(0, 3).map(kw => `<span class="keyword-tag">${kw}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="result-meta">
                        <span>Score: ${Math.round(item.score || 0)}</span>
                        <span>★ ${item.popularity || 0}</span>
                    </div>
                </div>
            `;
            resultsDiv.innerHTML += resultHtml;
        });
        
        // Add click event listeners to all search results
        document.querySelectorAll('.search-result[data-url]').forEach(result => {
            result.addEventListener('click', (e) => {
                const url = result.getAttribute('data-url');
                const id = result.getAttribute('data-id');
                sessionStorage.setItem('selectedUrl', url);
                sessionStorage.setItem('selectedId', id);
                window.location.href = 'result.html';
            });
        });
    }

    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        currentFilter = type;
        render(type);
    }

  

    // IMAGE SEARCH - Fixed promise handling
    async function loadImages(keyword) {
        const resultsDiv = document.getElementById('search-results');
        resultsDiv.innerHTML = '<div class="img-grid" id="img-grid"></div>';
        const grid = document.getElementById('img-grid');
        
        grid.innerHTML = Array.from({length: 20}, () => `
            <div class="img-card">
                <div class="img-wrapper"><div class="skeleton"></div></div>
                <div class="img-info"><div class="img-source">Loading...</div></div>
            </div>
        `).join('');

        const fastAPIs = [
            {
                name: 'LoremFlickr',
                fetch: (kw) => Array.from({length:15},(_,i)=>({
                    url:`https://loremflickr.com/400/300/${encodeURIComponent(kw)}?lock=${Date.now()+i}`, 
                    name:kw, source:'LoremFlickr'
                }))
            },
            {
                name: 'Unsplash',
                fetch: (kw) => Array.from({length:15},(_,i)=>({
                    url:`https://source.unsplash.com/400x300/?${encodeURIComponent(kw)}&sig=${Date.now()+i}`, 
                    name:kw, source:'Unsplash'
                }))
            }
        ];

        grid.innerHTML = '';
        
        for (const api of fastAPIs) {
            try {
                const result = api.fetch(keyword);
                const imgs = result instanceof Promise ? await result : result;
                imgs.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'img-card';
                    card.style.cursor = 'pointer';
                    
                    card.onclick = () => openImageViewer(img.url, img.name, img.source, keyword);
                    
                    card.innerHTML = `
                        <div class="img-wrapper">
                            <div class="skeleton"></div>
                            <img src="${img.url}" alt="${img.name}" loading="lazy"
                                 onload="this.classList.add('loaded');this.previousElementSibling.remove()"
                                 onerror="this.parentElement.parentElement.remove()">
                        </div>
                        <div class="img-info">
                            <div class="img-source">${img.source}</div>
                            <div>${img.name.substring(0,30)}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.warn(`${api.name} failed:`, e);
            }
        }
    }

    function openImageViewer(url, name, source, keyword) {
        const modal = document.getElementById('image-viewer-modal');
        document.getElementById('viewer-main-img').src = url;
        document.getElementById('viewer-source').textContent = source;
        document.getElementById('viewer-desc').textContent = name.charAt(0).toUpperCase() + name.slice(1) + " Exploration Workspace Grid";
        
        const extraGrid = document.getElementById('viewer-extra-grid');
        extraGrid.innerHTML = '';
        
        for (let i = 1; i <= 8; i++) {
            const extraUrl = `https://loremflickr.com/300/220/${encodeURIComponent(keyword)}?lock=${Date.now() + i + 50}`;
            const extraCard = document.createElement('div');
            extraCard.className = 'viewer-extra-card';
            extraCard.innerHTML = `<img src="${extraUrl}" alt="Related Variant Preview">`;
            
            extraCard.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('viewer-main-img').src = extraUrl;
                document.getElementById('viewer-desc').textContent = `${keyword.charAt(0).toUpperCase() + keyword.slice(1)} Asset Collection Element #${i}`;
            };
            extraGrid.appendChild(extraCard);
        }
        
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeImageViewer() {
        const modal = document.getElementById('image-viewer-modal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
        const waitForEngine = setInterval(() => {
            if (window.searchEngine) {
                clearInterval(waitForEngine);
                
                const searchInput = document.getElementById('search-input');
                const suggestionsDiv = document.getElementById('search-suggestions');

                if (query) {
                    searchInput.value = query;
                    performSearch(query);
                }

                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        performSearch(searchInput.value.trim());
                    }
                });

                searchInput.addEventListener('input', (e) => {
                    const suggestions = window.searchEngine.getSuggestions(e.target.value);
                    displaySuggestions(suggestions, e.target.value);
                });

                searchInput.addEventListener('focus', () => {
                    const q = searchInput.value.trim();
                    if (q) {
                        const suggestions = window.searchEngine.getSuggestions(q);
                        displaySuggestions(suggestions, q);
                    }
                });

                searchInput.addEventListener('blur', () => {
                    setTimeout(() => {
                        suggestionsDiv.classList.remove('visible');
                    }, 150);
                });
            }
        }, 50);
    });

    function displaySuggestions(suggestions, query) {
        const suggestionsDiv = document.getElementById('search-suggestions');

        if (!suggestions || suggestions.length === 0 || !query) {
            suggestionsDiv.classList.remove('visible');
            return;
        }

        suggestionsDiv.innerHTML = suggestions
            .map((suggestion, index) => `
                <div class="suggestion-item" data-suggestion="${suggestion.replace(/"/g, '&quot;')}">
                    <span class="suggestion-text">${suggestion}</span>
                    <span class="suggestion-icon">↵</span>
                </div>
            `)
            .join('');

        suggestionsDiv.querySelectorAll('.suggestion-item').forEach(item => {
            item.addEventListener('click', () => {
                const suggestion = item.getAttribute('data-suggestion');
                document.getElementById('search-input').value = suggestion;
                suggestionsDiv.classList.remove('visible');
                performSearch(suggestion);
            });
        });

        suggestionsDiv.classList.add('visible');
    }
</script>

<div class="anxro-voice-popup" id="anxroVoicePop">
    <div class="anxro-voice-box">
        <button class="anxro-voice-close" onclick="anxroCloseVoice()">✕</button>
        <div style="color:#fff;font-size:18px;font-weight:600">Voice Search</div>
        <button class="anxro-voice-mic" id="anxroMicBtn">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0.55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </button>
        <div class="anxro-voice-status" id="anxroVoiceStatus">Tap to speak</div>
    </div>
</div>

<script id="anxro-voice-js">
let anxroRec = null, anxroActive = false;

function getCurrentMode() {
    const activeTab = document.querySelector('.tab.active,.chip.active, [data-mode].active, button.active');
    if(activeTab) return activeTab.getAttribute('data-mode') || activeTab.textContent.toLowerCase().replace(' ', '');
    return 'all';
}

async function startVoice() {
    const pop = document.getElementById('anxroVoicePop');
    const mic = document.getElementById('anxroMicBtn');
    const stat = document.getElementById('anxroVoiceStatus');
    const input = document.getElementById('search-input');
    pop.classList.add('active');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { stat.textContent = 'Update WebView'; return; }
        anxroRec = new SR(); anxroRec.lang = 'en-US'; anxroRec.continuous = false;

        anxroRec.onstart = () => { anxroActive = true; mic.classList.add('listening'); stat.textContent = 'Listening...'; };
                // UPDATED: Runs the local database query directly when you finish speaking
        anxroRec.onresult = e => {
            const text = e.results[0][0].transcript;
            if(input) input.value = text;

            stat.textContent = 'Searching...';
            setTimeout(() => { 
                anxroCloseVoice(); 
                performSearch(text); // Triggers the local search system smoothly
            }, 300);
        };

        anxroRec.onerror = e => {
            mic.classList.remove('listening'); anxroActive = false;
            stat.textContent = e.error === 'not-allowed'? 'Mic blocked' : 'Tap to retry';
        };
        anxroRec.onend = () => { mic.classList.remove('listening'); anxroActive = false; };
        anxroRec.start();
    } catch(e) { stat.textContent = 'Mic denied'; }
}

function anxroCloseVoice() {
    if(anxroRec) anxroRec.stop();
    document.getElementById('anxroVoicePop').classList.remove('active');
    document.getElementById('anxroMicBtn').classList.remove('listening');
    anxroActive = false;
}
document.getElementById('anxroMicBtn').onclick = () => {
    if(anxroActive && anxroRec) anxroRec.stop(); else startVoice();
};

document.addEventListener('DOMContentLoaded', () => {
    const searchBtn = document.querySelector('.search-btn, #search-btn, button[type="submit"]');
    if(searchBtn) {
        searchBtn.addEventListener('click', (e) => {
            const input = document.getElementById('search-input');
            if(input && input.value.trim()) {
                const mode = getCurrentMode();
                sessionStorage.setItem('searchQuery', input.value.trim());
                sessionStorage.setItem('searchMode', mode);
                sessionStorage.setItem('isImageSearch', mode === 'image'? 'true' : 'false');
            }
        }, true);
    }
});
</script>
