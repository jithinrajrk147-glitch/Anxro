<!DOCTYPE html>
<html>
<head>
    <title>Superior Slogan Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; transition: 0.3s; }
        #container { padding: 25px; max-width: 500px; margin: auto; }
        
        /* Emerald Trading Theme */
        .emerald-dark { background: #010d08; color: #ecfdf5; min-height: 100vh; }
        h2 { color: #10b981; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        
        #inputBox { 
            width: 100%; box-sizing: border-box; padding: 15px; 
            background: #064e3b; border: 2px solid #059669; 
            color: #ecfdf5; border-radius: 12px; font-size: 16px; outline: none;
        }
        
        #btn { 
            width: 100%; margin-top: 15px; padding: 15px; 
            background: linear-gradient(45deg, #059669, #10b981); 
            color: #010d08; font-weight: 800; border: none; 
            border-radius: 12px; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: 0.2s;
        }
        #btn:active { transform: scale(0.98); }

        #output { 
            margin-top: 25px; background: #064e3b; 
            border-left: 6px solid #10b981; padding: 20px; 
            border-radius: 12px; line-height: 1.8; min-height: 50px;
            font-style: italic; font-size: 1.1em;
        }
        .bull-candle { color: #10b981; font-weight: bold; margin-right: 10px; font-style: normal; }
        ::placeholder { color: #34d399; opacity: 0.5; }
    </style>
</head>
<body class="emerald-dark">

<div id="container">
    <h2>Slogan Pro</h2>
    <input id="inputBox" type="text" placeholder="Enter keyword (e.g. Luxury, Tech, Speed)">
    <button id="btn" onclick="generateSlogans()">GENERATE TAGLINES</button>
    <div id="output">Waiting for your vision...</div>
</div>

<script>
async function api(url) {
    try {
        const r = await fetch(url);
        return await r.json();
    } catch (e) { return null; }
}

async function generateSlogans() {
    const kw = document.getElementById("inputBox").value.trim();
    const out = document.getElementById("output");

    if (!kw) {
        out.innerHTML = "Enter a keyword to start.";
        return;
    }

    out.innerHTML = "Analyzing market trends...";

    // Fetching deep linguistic data and dynamic phrases
    const [adjData, trigData, advice, affirmation] = await Promise.all([
        api(`https://api.datamuse.com/words?rel_jjb=${kw}`), // Adjectives describing the keyword
        api(`https://api.datamuse.com/words?lc=${kw}`),      // Words often following the keyword
        api("https://api.adviceslip.com/advice"),
        api("https://www.affirmations.dev/")
    ]);

    // Extracting best words or falling back
    const adj = adjData?.[0]?.word || "Pure";
    const nextWord = trigData?.[0]?.word || "Innovation";
    const shortAdvice = advice?.slip?.advice.split(' ').slice(0, 3).join(' ') || "Excellence";
    const pureVibe = affirmation?.affirmation.split(' ').slice(-2).join(' ') || "Defined";

    // Build 5 Powerful Slogans
    const slogans = [
        `${kw}: ${adj.charAt(0).toUpperCase() + adj.slice(1)} Performance.`,
        `The ${kw} ${nextWord} you’ve been waiting for.`,
        `${kw} — Because ${shortAdvice.toLowerCase()} matters.`,
        `Beyond ${kw}. ${pureVibe.toUpperCase()}.`,
        `Unleash the power of ${kw}.`
    ];

    // Render with Bullish Candle Pattern
    out.innerHTML = slogans.map(s => {
        return `<div style="margin-bottom: 15px;"><span class="bull-candle">▮</span> ${s}</div>`;
    }).join("");
}
</script>

</body>
</html>
