<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>To-Do List – Anxro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d0f;--card:#1a1a1f;--card2:#202026;--accent:#f59e0b;--text:#f1f0ee;--muted:#6b6b78;--border:#2a2a32;--radius:16px;--nav-h:68px;--green:#4ade80;--red:#f87171;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
body{padding-bottom:calc(var(--nav-h)+16px);}
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,13,15,.9);backdrop-filter:blur(18px);padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;}
.back-btn svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.topbar-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;flex:1;}
.topbar-badge{background:rgba(245,158,11,.15);color:var(--accent);border:1px solid rgba(245,158,11,.25);font-size:12px;font-weight:700;padding:4px 10px;border-radius:100px;}
.page{padding:20px 16px;}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.stat-num{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;}
.stat-num.amber{color:var(--accent);}
.stat-num.green{color:var(--green);}
.stat-num.muted{color:var(--muted);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
/* ADD INPUT */
.add-row{display:flex;gap:10px;margin-bottom:16px;}
.add-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;}
.add-input:focus{border-color:var(--accent);}
.add-input::placeholder{color:var(--muted);}
.add-btn{width:48px;height:48px;background:linear-gradient(110deg,var(--accent),#fb923c);border:none;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:22px;font-weight:700;color:#0d0d0f;}
/* PRIORITY ROW */
.priority-row{display:flex;gap:8px;margin-bottom:20px;}
.pri-btn{flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;text-align:center;}
.pri-btn.active-high{border-color:#f87171;background:rgba(248,113,113,.08);color:#f87171;}
.pri-btn.active-med{border-color:var(--accent);background:rgba(245,158,11,.08);color:var(--accent);}
.pri-btn.active-low{border-color:var(--green);background:rgba(74,222,128,.08);color:var(--green);}
/* FILTER TABS */
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;}
.f-tab{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;}
.f-tab.active{background:var(--accent);border-color:var(--accent);color:#0d0d0f;}
/* TASKS */
.task-list{display:flex;flex-direction:column;gap:8px;}
.task-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all .2s;animation:fadeUp .3s ease both;}
.task-item.done{opacity:.5;}
.task-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.task-check.checked{background:var(--green);border-color:var(--green);}
.task-check svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none;}
.task-check.checked svg{display:block;}
.task-body{flex:1;}
.task-text{font-size:14px;font-weight:500;line-height:1.4;transition:text-decoration .2s;}
.task-item.done .task-text{text-decoration:line-through;color:var(--muted);}
.task-meta{display:flex;gap:8px;margin-top:4px;align-items:center;}
.task-pri{font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;}
.pri-high{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.2);}
.pri-med{background:rgba(245,158,11,.12);color:var(--accent);border:1px solid rgba(245,158,11,.2);}
.pri-low{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.2);}
.task-date{font-size:10px;color:var(--muted);}
.task-del{width:30px;height:30px;border-radius:8px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .2s;flex-shrink:0;}
.task-del:hover{color:var(--red);}
.task-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state div{font-size:48px;margin-bottom:12px;}
.sec-header{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding:4px 0;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);z-index:200;background:rgba(13,13,15,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 8px;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:8px 4px;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="topbar">
  <a href="home.html" class="back-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
  <div class="topbar-title">To-Do List</div>
  <div class="topbar-badge" id="pendingBadge">0 pending</div>
</div>
<div class="page">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num amber" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-num green" id="statDone">0</div><div class="stat-lbl">Done</div></div>
    <div class="stat-card"><div class="stat-num muted" id="statPending">0</div><div class="stat-lbl">Pending</div></div>
  </div>

  <div class="add-row">
    <input class="add-input" id="taskInput" placeholder="Add a new task…" maxlength="120" onkeydown="if(event.key==='Enter')addTask()"/>
    <button class="add-btn" onclick="addTask()">+</button>
  </div>

  <div class="priority-row">
    <div class="pri-btn active-high" data-pri="high" onclick="setPri(this)">🔴 High</div>
    <div class="pri-btn" data-pri="med" onclick="setPri(this)">🟡 Medium</div>
    <div class="pri-btn" data-pri="low" onclick="setPri(this)">🟢 Low</div>
  </div>

  <div class="filter-tabs">
    <div class="f-tab active" data-filter="all" onclick="setFilter(this)">All</div>
    <div class="f-tab" data-filter="active" onclick="setFilter(this)">Active</div>
    <div class="f-tab" data-filter="done" onclick="setFilter(this)">Done</div>
  </div>

  <div class="task-list" id="taskList"></div>
  <div class="empty-state" id="emptyState"><div>✅</div>No tasks yet!<br>Add your first task above.</div>
</div>



<script>
let tasks = JSON.parse(localStorage.getItem('anxro_todos')||'[]');
let activePri = 'high', activeFilter = 'all';

function setPri(el){document.querySelectorAll('.pri-btn').forEach(b=>{b.className='pri-btn';});activePri=el.dataset.pri;el.classList.add('active-'+activePri);}
function setFilter(el){document.querySelectorAll('.f-tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeFilter=el.dataset.filter;render();}

function addTask(){
  const val = document.getElementById('taskInput').value.trim();
  if(!val) return;
  tasks.unshift({id:Date.now(),text:val,done:false,pri:activePri,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})});
  document.getElementById('taskInput').value='';
  save(); render();
}

function toggleTask(id){
  const t = tasks.find(t=>t.id===id);
  if(t) t.done = !t.done;
  save(); render();
}

function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save(); render();
}

function save(){localStorage.setItem('anxro_todos',JSON.stringify(tasks));}

function render(){
  const list = document.getElementById('taskList');
  let filtered = tasks;
  if(activeFilter==='active') filtered = tasks.filter(t=>!t.done);
  if(activeFilter==='done') filtered = tasks.filter(t=>t.done);
  
  const done=tasks.filter(t=>t.done).length, total=tasks.length, pending=total-done;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statPending').textContent=pending;
  document.getElementById('pendingBadge').textContent=pending+' pending';

  document.getElementById('emptyState').style.display=filtered.length?'none':'block';
  list.innerHTML = filtered.map(t=>`
    <div class="task-item ${t.done?'done':''}">
      <div class="task-check ${t.done?'checked':''}" onclick="toggleTask(${t.id})">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="task-body">
        <div class="task-text">${t.text}</div>
        <div class="task-meta">
          <span class="task-pri pri-${t.pri}">${t.pri.toUpperCase()}</span>
          <span class="task-date">${t.date}</span>
        </div>
      </div>
      <button class="task-del" onclick="deleteTask(${t.id})">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6m4-6v6"/></svg>
      </button>
    </div>
  `).join('');
}
render();
</script>
</body>
</html>
