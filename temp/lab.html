<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lab App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

/* ── TOKENS ── */
:root {
    --em: #10b981;
    --em-mid: #059669;
    --em-deep: #064e3b;
    --em-dim: rgba(16,185,129,0.10);
    --em-glow: rgba(16,185,129,0.22);
    --radius: 12px;
    --radius-sm: 9px;
}

/* ── BODY / BG ── */
body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
    overflow-x: hidden;
    background: #0a0a0a;
    color: #f5f5f5;
}
body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle, rgba(16,185,129,0.055) 1px, transparent 1px);
    background-size: 26px 26px;
}

/* ── LOADING OVERLAY ── */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: none;
}

.loading-spinner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: slideIn 0.4s ease-out;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(16,185,129,0.15);
    border-top: 3px solid var(--em);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    box-shadow: 0 0 20px rgba(16,185,129,0.3);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.loading-text {
    font-size: 13px;
    color: #fff;
    font-weight: 500;
    letter-spacing: 0.5px;
}

/* ── STICKY HEADER ── */
#app-header {
    position: sticky; top: 0; z-index: 200;
    padding: 12px 12px 0;
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    background: rgba(10,10,10,0.7);
    border-bottom: 1px solid rgba(16,185,129,0.1);
}

/* Brand row */
.brand-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
}
.brand-left { display: flex; align-items: center; gap: 8px; }
.brand-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--em) 0%, var(--em-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px var(--em-glow);
}
.brand-icon i { color: white; font-size: 13px; }
.brand-name {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 800; letter-spacing: -0.3px;
    color: #f5f5f5;
}
.brand-name span { color: var(--em); }

.theme-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: var(--em); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; transition: all 0.2s;
}
.theme-btn:active { transform: scale(0.9); }

/* Search */
.search-wrap {
    display: flex; align-items: center; gap: 8px;
    border-radius: var(--radius-sm);
    padding: 0 11px;
    height: 40px; margin-bottom: 8px;
    border: 1.5px solid rgba(16,185,129,0.18);
    background: rgba(255,255,255,0.03);
    transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap:focus-within {
    border-color: var(--em);
    box-shadow: 0 0 0 2px rgba(16,185,129,0.1);
}
.search-wrap i { color: var(--em); font-size: 12px; opacity: 0.7; }
#search-input {
    flex: 1; border: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; outline: none;
    transition: color 0.2s;
    color: #f5f5f5;
}
#search-input::placeholder {
    color: rgba(245,245,245,0.3);
}

/* ── TAB BAR ── */
.tab-bar {
    display: flex; gap: 6px;
    padding: 0 0 8px;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: 999px;
    border: none; cursor: pointer; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
    letter-spacing: 0.2px;
    background: rgba(255,255,255,0.05);
    color: rgba(245,245,245,0.6);
}
.tab-btn i { font-size: 11px; }
.tab-btn.active {
    background: var(--em);
    color: #fff;
}

/* ── SECTION HEADER ── */
.section-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 12px 6px;
    opacity: 0.4;
    color: var(--em);
}

/* ── GRID (5 COLUMNS) ── */
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    padding: 3px 9px 40px;
    position: relative; z-index: 1;
}

/* ── CARD (SMALL) ── */
.card {
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(16,185,129,0.1);
    aspect-ratio: 1/1;
    display: flex;
    flex-direction: column;
}
.card:active { transform: scale(0.92); }
.card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: var(--radius);
    background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 60%);
    pointer-events: none;
    z-index: 2;
}
.card img {
    width: 100%; 
    height: 65%;
    object-fit: cover;
    display: block; 
    transition: transform 0.3s ease;
}
.card:active img { transform: scale(1.03); }

.card-info {
    padding: 3px 3px 3px;
    display: flex; 
    flex-direction: column; 
    gap: 2px; 
    align-items: center;
    justify-content: center;
    flex: 1;
    position: relative; 
    z-index: 3;
    width: 100%;
}
.card-info strong {
    display: block; 
    font-size: 8px; 
    font-weight: 600;
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
    width: 100%; 
    text-align: center;
    color: #f5f5f5;
    line-height: 1.2;
}
.card-info small { 
    display: none;
}

/* ── CAPSULE SYSTEM ── */
.card-capsule {
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 4;
    position: relative;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
}

.card-capsule:active {
    transform: scale(0.9);
}

/* Capsule colors based on type */
.capsule-cyan {background: rgba(34,211,238,0.8);
    color: #000;
    box-shadow: 0 2px 8px rgba(34,211,238,0.3);
}

.capsule-blue {
    background: rgba(59,130,246,0.8);
    box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}

.capsule-purple {
    background: rgba(168,85,247,0.8);
    box-shadow: 0 2px 8px rgba(168,85,247,0.3);
}

.capsule-green {
    background: rgba(16,185,129,0.8);
    box-shadow: 0 2px 8px rgba(16,185,129,0.3);
}

.capsule-pink {
    background: rgba(236,72,153,0.8);
    box-shadow: 0 2px 8px rgba(236,72,153,0.3);
}

.capsule-red {
    background: rgba(239,68,68,0.8);
    box-shadow: 0 2px 8px rgba(239,68,68,0.3);
}

.capsule-yellow {
    background: rgba(234,179,8,0.8);
    color: #000;
    box-shadow: 0 2px 8px rgba(234,179,8,0.3);
}

.capsule-orange {
    background: rgba(249,115,22,0.8);
    box-shadow: 0 2px 8px rgba(249,115,22,0.3);
}

/* Badge top-left */
.card-badge {
    position: absolute; top: 4px; left: 4px;
    padding: 2px 5px; border-radius: 999px;
    font-size: 7px; font-weight: 700; color: #fff;
    text-transform: uppercase; letter-spacing: 0.3px;
    z-index: 10; pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* ── TOP SECTION ── */
#top-list {
    padding: 3px 9px 40px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative; z-index: 1;
}
.top-row {
    display: flex; align-items: center; gap: 10px;
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(16,185,129,0.15);
    position: relative; 
    overflow: hidden;
    background: rgba(255,255,255,0.04);
}
.top-row:active { transform: scale(0.97); }
.top-row::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--em-dim) 0%, transparent 80%);
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.top-row:active::before { opacity: 1; }

.top-rank {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
    color: var(--em); opacity: 0.35;
    min-width: 28px; text-align: center; line-height: 1;
}
.top-rank.rank-1 { opacity: 1; font-size: 22px; }
.top-rank.rank-2 { opacity: 0.75; }
.top-rank.rank-3 { opacity: 0.55; }

.top-img {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    border: 1.2px solid rgba(16,185,129,0.15);
}

.top-info {
    flex: 1; min-width: 0;
}
.top-name {
    font-size: 13px; font-weight: 600; margin-bottom: 2px;
    color: #f5f5f5;
}
.top-desc {
    font-size: 11px; opacity: 0.5; line-height: 1.3;
    color: rgba(245,245,245,0.6);
}

.top-capsule {
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 7px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
    margin-top: 4px;
    display: inline-block;
}

.top-capsule:active {
    transform: scale(0.9);
}

/* Top capsule colors by type */
.top-capsule.capsule-cyan {
    background: rgba(34,211,238,0.8);
    color: #000;
    box-shadow: 0 2px 8px rgba(34,211,238,0.3);
}

.top-capsule.capsule-blue {
    background: rgba(59,130,246,0.8);
    box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}

.top-capsule.capsule-purple {
    background: rgba(168,85,247,0.8);
    box-shadow: 0 2px 8px rgba(168,85,247,0.3);
}

.top-capsule.capsule-green {
    background: rgba(16,185,129,0.8);
    box-shadow: 0 2px 8px rgba(16,185,129,0.3);
}

.top-capsule.capsule-pink {
    background: rgba(236,72,153,0.8);
    box-shadow: 0 2px 8px rgba(236,72,153,0.3);
}

.top-capsule.capsule-red {
    background: rgba(239,68,68,0.8);
    box-shadow: 0 2px 8px rgba(239,68,68,0.3);
}

.top-capsule.capsule-yellow {
    background: rgba(234,179,8,0.8);
    color: #000;
    box-shadow: 0 2px 8px rgba(234,179,8,0.3);
}

.top-capsule.capsule-orange {
    background: rgba(249,115,22,0.8);
    box-shadow: 0 2px 8px rgba(249,115,22,0.3);
}

/* ── MODAL ── */
#item-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 500; backdrop-filter: blur(6px);
}
#item-modal.active { display: flex; }

.modal-content {
    background: #1a1a1a; border-radius: 16px;
    padding: 24px 20px; width: 90%; max-width: 450px;
    display: flex; flex-direction: column; gap: 14px;
    border: 1px solid rgba(16,185,129,0.1);
    max-height: 85vh;
    overflow-y: auto;
    animation: modalSlideIn 0.3s ease-out;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-image {
    width: 100%; height: 180px; border-radius: 14px;
    object-fit: cover; display: block;
    border: 1px solid rgba(16,185,129,0.15);
}

.modal-header {
    display: flex; flex-direction: column; gap: 6px;
}
.modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
    color: #f5f5f5;
}
.modal-type {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--em);
}

.modal-desc {
    font-size: 12px; line-height: 1.5; opacity: 0.8;
    color: rgba(245,245,245,0.7);
}

.modal-actions {
    display: flex; gap: 8px;
}
.btn {
    flex: 1; padding: 11px; border: none;
    border-radius: 9px; cursor: pointer; font-weight: 600;
    font-size: 12px; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
}
.btn-primary {
    background: var(--em); color: #fff;
}
.btn-primary:active { transform: scale(0.95); }
.btn-secondary {
    background: rgba(255,255,255,0.1); color: #f5f5f5;
}
.btn-secondary:active { transform: scale(0.95); }

/* ── TOAST ── */
#toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(16,185,129,0.95);
    color: white; padding: 12px 18px;
    border-radius: 8px; font-size: 12px;
    display: none; z-index: 2000;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    backdrop-filter: blur(12px);
}

/* ── MANAGER SECTION ── */
#manager-container {
    padding: 3px 9px 40px;
    display: none;
    position: relative;
    z-index: 1;
}
#manager-container.active {
    display: block;
}

.manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 3px;
}

.manager-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #f5f5f5;
}

#refresh-apps {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(16,185,129,0.2);
    background: rgba(16,185,129,0.1);
    color: var(--em);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 12px;
}

#refresh-apps:active {
    transform: scale(0.9);
}

#refresh-apps.spinning {
    animation: spin 0.8s linear infinite;
}

.installed-apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px,1fr));
    gap: 10px;
}

.app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(16,185,129,0.15);
    cursor: pointer;
    transition: all 0.2s;
}

.app-card:active {
    transform: scale(0.95);
    background: rgba(16,185,129,0.15);
}

.app-card-icon {
    font-size: 28px;
}

.app-card-name {
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    color: #f5f5f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}

.app-card-timer {
    font-size: 10px;
    color: var(--em);
    background: rgba(16,185,129,0.2);
    padding: 2px 4px;
    border-radius: 4px;
}

/* ── TIMER MODAL ── */
#timer-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 600;
    backdrop-filter: blur(6px);
}
#timer-modal.active {
    display: flex;
}

.timer-content {
    background: #1a1a1a;
    border-radius: 18px 18px 0 0;
    padding: 20px 16px 24px;
    width: 100%;
    max-width: 500px;
    border: 1px solid rgba(16,185,129,0.1);
}

.timer-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 16px;
    color: #f5f5f5;
}

.timer-inputs {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
}

.timer-input-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.timer-input-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--em);
}

.timer-input-group input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(16,185,129,0.2);
    background: rgba(255,255,255,0.05);
    color: #f5f5f5;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
}

.timer-input-group input:focus {
    border-color: var(--em);
    outline: none;
}

.timer-actions {
    display: flex;
    gap: 8px;
}

/* ── EMPTY STATE ── */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 60px 20px;
    text-align: center;
    color: rgba(245,245,245,0.4);
}
.empty-state i { font-size: 32px; opacity: 0.4; }
.empty-state p { font-size: 12px; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
    .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 3px 6px 40px;
    }
    .card-info strong { font-size: 8px; }
}

</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <div class="loading-text">Loading data...</div>
    </div>
</div>

<!-- HEADER -->
<div id="app-header">
    <div class="brand-row">
        <div class="brand-left">
            <div class="brand-icon"><i class="fa fa-flask"></i></div>
            <div class="brand-name"><span>Lab</span></div>
        </div>
        <button class="theme-btn" id="theme-btn"><i class="fa fa-moon"></i></button>
    </div>
    
    <div class="search-wrap">
        <i class="fa fa-search"></i>
        <input type="text" id="search-input" placeholder="Search apps & websites...">
    </div>
    
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-top"><i class="fa fa-trophy"></i> Top</button>
        <button class="tab-btn" id="tab-web"><i class="fa fa-globe"></i> Websites</button>
        <button class="tab-btn" id="tab-apps"><i class="fa fa-mobile"></i> Apps</button>
        <button class="tab-btn" id="tab-manager"><i class="fa fa-cog"></i> Manager</button>
    </div>
</div>

<!-- CONTENT -->
<div id="section-label" class="section-label">🏆 TOP WEB & APPS</div>
<div id="content" class="grid"></div>
<div id="top-list"></div>

<!-- APP MANAGER SECTION -->
<div id="manager-container">
    <div class="manager-header">
        <div class="manager-title">📱 Installed Apps</div>
        <button id="refresh-apps" title="Refresh apps"><i class="fa fa-refresh"></i></button>
    </div>
    <div id="installed-apps" class="installed-apps-grid"></div>
</div>

<!-- ITEM MODAL -->
<div id="item-modal">
    <div class="modal-content">
        <img id="modal-img" class="modal-image" src="" alt="">
        <div class="modal-header">
            <div class="modal-type" id="modal-type">Unknown</div>
            <div class="modal-title" id="modal-name">Title</div>
        </div>
        <div class="modal-desc" id="modal-info">Description</div>
        <div class="modal-actions">
            <button class="btn btn-primary" id="open-link">
                <i class="fa fa-external-link"></i> Open
            </button>
            <button class="btn btn-secondary" id="close-modal">Close</button>
        </div>
    </div>
</div>

<!-- TIMER MODAL -->
<div id="timer-modal">
    <div class="timer-content">
        <div class="timer-title" id="timer-app-name">Set Timer for App</div>
        <div class="timer-inputs">
            <div class="timer-input-group">
                <label class="timer-input-label">Hours</label>
                <input type="number" id="timer-hours" min="0" max="23" placeholder="0">
            </div>
            <div class="timer-input-group">
                <label class="timer-input-label">Minutes</label>
                <input type="number" id="timer-minutes" min="0" max="59" placeholder="0">
            </div>
        </div>
        <div class="timer-actions">
            <button class="btn btn-primary" id="timer-set-btn">Set Timer</button>
            <button class="btn btn-secondary" id="timer-cancel-btn">Cancel</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── DATA SOURCES ──
let topData = [];
let webData = [];
let appData = [];
let filteredData = [];
let currentItem = null;
let currentFilter = 'top';
let currentIndex = 0;
let categoryFilter = null;
let typeFilter = null; // NEW: Track filtered type
let appTimers = {};
let currentAppName = '';
const batchSize = 20;

// ── DOM REFS ──
const content = document.getElementById('content');
const topList = document.getElementById('top-list');
const searchInput = document.getElementById('search-input');
const modal = document.getElementById('item-modal');
const loadingOverlay = document.getElementById('loading-overlay');
const installedAppsContainer = document.getElementById('installed-apps');

// Load timers from localStorage
try {
    appTimers = JSON.parse(localStorage.getItem('appTimers')) || {};
} catch (e) {
    appTimers = {};
}

// ── LOAD JSON DATA ──
function loadJSONData() {
    Promise.all([
        fetch('top.json').then(r => r.json()).catch(e => {
            console.warn('top.json failed, using fallback:', e);
            return { items: [] };
        }),
        fetch('app.json').then(r => r.json()).catch(e => {
            console.warn('app.json failed, using fallback:', e);
            return{ items: [] };
        })
    ]).then(([topJson, appJson]) => {
        // Extract items array from both JSONs
        const topItems = Array.isArray(topJson?.items) ? topJson.items : [];
        const allAppItems = Array.isArray(appJson?.items) ? appJson.items : [];
        
        // Combine all items for filtering
        const allItems = [...topItems, ...allAppItems];
        
        // Separate by type
        topData = allItems.slice(0, 15); // First 15 as top
        webData = allItems.filter(item => item.type === 'website');
        appData = allItems.filter(item => item.type === 'app');
        
        console.log('✅ Loaded Data:', { 
            topItems: topData.length, 
            webItems: webData.length, 
            appItems: appData.length,
            totalItems: allItems.length
        });
        
        // Hide loading and init after 600ms for smooth transition
        setTimeout(() => {
            loadingOverlay.style.display = 'none';
            init();
        }, 600);
    }).catch(err => {
        console.error('❌ JSON loading failed:', err);
        setTimeout(() => {
            loadingOverlay.style.display = 'none';
            init();
        }, 600);
    });
}

// ── MODAL CLOSE ──
document.getElementById('close-modal').addEventListener('click', () => {
    modal.classList.remove('active');
});

window.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
    if (e.target === document.getElementById('timer-modal')) {
        document.getElementById('timer-modal').classList.remove('active');
    }
});

// ── RENDER INSTALLED APPS ──
function renderManager() {
    installedAppsContainer.innerHTML = '';
    
    // Simulated installed apps - will be replaced with Android detection
    const installedApps = [
        { id: 'whatsapp', name: 'WhatsApp', icon: '💬' },
        { id: 'instagram', name: 'Instagram', icon: '📸' },
        { id: 'chrome', name: 'Chrome', icon: '🌐' },
        { id: 'youtube', name: 'YouTube', icon: '▶️' },
        { id: 'gmail', name: 'Gmail', icon: '📧' },
        { id: 'maps', name: 'Maps', icon: '🗺️' },
        { id: 'gallery', name: 'Gallery', icon: '🖼️' },
        { id: 'files', name: 'Files', icon: '📁' }
    ];

    installedApps.forEach(app => {
        const appCard = document.createElement('div');
        appCard.className = 'app-card';
        const timerSet = appTimers[app.id];
        
        appCard.innerHTML = `
            <div class="app-card-icon">${app.icon || '📱'}</div>
            <div class="app-card-name">${app.name}</div>
            ${timerSet ? `<div class="app-card-timer"><i class="fa fa-clock"></i></div>` : ''}
        `;

        appCard.addEventListener('click', () => {
            currentAppName = app.name;
            showTimerModal(app.name, app.id);
        });

        installedAppsContainer.appendChild(appCard);
    });
}

// ── TIMER MODAL ──
function showTimerModal(appName, appId) {
    const timerModal = document.getElementById('timer-modal');
    document.getElementById('timer-app-name').textContent = `Set Timer for ${appName}`;

    document.getElementById('timer-hours').value = '';
    document.getElementById('timer-minutes').value = '';

    document.getElementById('timer-set-btn').onclick = () => {
        const hours = parseInt(document.getElementById('timer-hours').value) || 0;
        const minutes = parseInt(document.getElementById('timer-minutes').value) || 0;

        if (hours === 0 && minutes === 0) {
            showToast('Please set a time');
            return;
        }

        appTimers[appId] = { hours, minutes, setAt: Date.now() };
        localStorage.setItem('appTimers', JSON.stringify(appTimers));

        showToast(`⏱️ Timer: ${hours}h ${minutes}m for ${appName}`);
        timerModal.classList.remove('active');
        renderManager();
    };

    document.getElementById('timer-cancel-btn').onclick = () => {
        timerModal.classList.remove('active');
    };

    timerModal.classList.add('active');
}

// ── REFRESH APPS ──
document.getElementById('refresh-apps').addEventListener('click', function() {
    this.classList.add('spinning');
    setTimeout(() => {
        renderManager();
        this.classList.remove('spinning');
        showToast('Apps refreshed');
    }, 800);
});

// ── FILTER & SEARCH ──
function applyFilters() {
    const search = (searchInput.value || '').toLowerCase();
    let source = [];

    if (currentFilter === 'top') {
        source = topData;
    } else if (currentFilter === 'website') {
        source = webData;
    } else if (currentFilter === 'app') {
        source = appData;
    }

    filteredData = source.filter(item => {
        const matchSearch = (item.name || '').toLowerCase().includes(search) ||
                          (item.info || '').toLowerCase().includes(search);
        const matchCategory = !categoryFilter || item.category === categoryFilter;
        const matchCapsule = !typeFilter || (item.capsule || '') === typeFilter;
        return matchSearch && matchCategory && matchCapsule;
    });
}

function resetRender(filter) {
    currentFilter = filter;
    currentIndex = 0;
    content.innerHTML = '';
    applyFilters();
    renderBatch();
}

function renderBatch() {
    const slice = filteredData.slice(currentIndex, currentIndex + batchSize);
    slice.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        const typeClass = 'type-' + (item.type || 'unknown').toLowerCase().replace(/\s+/g,'-');
        const capsuleColor = getCapsuleColorByType(item.capsule);
        const capsuleText = item.capsule || item.type || 'Unknown';

        div.innerHTML = `
            <div class="card-badge ${typeClass}">${item.type || 'Unknown'}</div>
            <img src="${item.image}" loading="lazy" alt="${item.name}" onerror="this.src='https://via.placeholder.com/100?text=${item.type}'">
            <div class="card-info">
                <strong>${item.name}</strong>
                <div class="card-capsule ${capsuleColor}" data-capsule="${item.capsule}">${capsuleText}</div>
            </div>
        `;

        // Main card click - open modal
        div.addEventListener('click', (e) => {
            // Don't open modal if capsule is clicked
            if (e.target.classList.contains('card-capsule')) {
                return;
            }
            currentItem = item;
            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-name').textContent = item.name;
            document.getElementById('modal-type').textContent = item.type || 'Unknown';
            document.getElementById('modal-info').textContent = item.info || 'No additional info.';
            modal.classList.add('active');
        });

        // Capsule click - toggle capsule filter
        const capsule = div.querySelector('.card-capsule');
        if (capsule && item.capsule) {
            capsule.addEventListener('click', (e) => {
                e.stopPropagation();
                const itemCapsule = item.capsule;// Toggle filter: if same capsule is clicked, clear filter
                if (typeFilter === itemCapsule) {
                    typeFilter = null;
                    showToast(`Showing all items`);
                } else {
                    typeFilter = itemCapsule;
                    showToast(`Filtering ${itemCapsule}`);
                }
                
                // Re-render with new filter
                resetRender(currentFilter);
            });
        }

        content.appendChild(div);
    });

    if (filteredData.length === 0 && currentIndex === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `<i class="fa fa-folder-open"></i><p>Nothing here yet</p>`;
        content.appendChild(empty);
    }

    currentIndex += batchSize;
}

// ── GET CAPSULE COLOR BY CAPSULE VALUE ──
function getCapsuleColorByType(capsule) {
    const colorMap = {
        'website': 'capsule-cyan',
        'web': 'capsule-cyan',
        'app': 'capsule-blue',
        'ai': 'capsule-purple',
        'tool': 'capsule-green',
        'game': 'capsule-pink',
        'social': 'capsule-red',
        'education': 'capsule-yellow'
    };
    return colorMap[(capsule || '').toLowerCase()] || 'capsule-green';
}

// ── TOP RENDER ──
function renderTop() {
    topList.innerHTML = '';
    const search = (searchInput.value || '').toLowerCase();
    let items = topData.filter(item =>
        (item.name || '').toLowerCase().includes(search) ||
        (item.info || '').toLowerCase().includes(search)
    );
    
    // Apply capsule filter if set
    if (typeFilter) {
        items = items.filter(item => (item.capsule || '') === typeFilter);
    }

    if (items.length === 0) {
        topList.innerHTML = `<div class="empty-state"><i class="fa fa-trophy"></i><p>No items found</p></div>`;
        return;
    }

    items.forEach((item, i) => {
        const rank = i + 1;
        const typeClass = 'type-' + (item.type || 'unknown').toLowerCase();
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
        const capsuleColor = getCapsuleColorByType(item.capsule);
        const capsuleText = item.capsule || item.type || 'Unknown';

        const row = document.createElement('div');
        row.className = 'top-row';
        row.innerHTML = `
            ${rank === 1 ? '<div style="font-size:20px;margin-right:4px;">👑</div>' : ''}
            <div class="top-rank ${rankClass}">${rank}</div>
            <img class="top-img" src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/50?text=${item.type}'">
            <div class="top-info">
                <div class="top-name">${item.name}</div>
                <div class="top-desc">${item.info || ''}</div>
                ${item.capsule ? `<div class="top-capsule ${capsuleColor}" data-capsule="${item.capsule}">${capsuleText}</div>` : ''}
            </div>
        `;

        // Main row click - open modal
        row.addEventListener('click', (e) => {
            // Don't open modal if capsule is clicked
            if (e.target.classList.contains('top-capsule')) {
                return;
            }
            currentItem = item;
            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-name').textContent = item.name;
            document.getElementById('modal-type').textContent = item.type || 'Unknown';
            document.getElementById('modal-info').textContent = item.info;
            modal.classList.add('active');
        });

        // Capsule click - toggle capsule filter
        const capsule = row.querySelector('.top-capsule');
        if (capsule && item.capsule) {
            capsule.addEventListener('click', (e) => {
                e.stopPropagation();
                const itemCapsule = item.capsule;
                
                // Toggle filter: if same capsule is clicked, clear filter
                if (typeFilter === itemCapsule) {
                    typeFilter = null;
                    showToast(`Showing all items`);
                } else {
                    typeFilter = itemCapsule;
                    showToast(`Filtering ${itemCapsule}`);
                }
                
                // Re-render top with new filter
                renderTop();
            });
        }

        topList.appendChild(row);
    });
}

// ── TAB SWITCHING ──
function setActiveTab(tabId, filter) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');

    const isTop = tabId === 'tab-top';
    const isManager = tabId === 'tab-manager';

    content.style.display = isTop ? 'none' : 'grid';
    topList.style.display = isTop ? 'flex' : 'none';
    document.getElementById('manager-container').classList.toggle('active', isManager);

    // Reset filters when switching tabs
    typeFilter = null;
    searchInput.value = '';
    
    const labels = {
        'tab-top': '🏆 TOP WEB & APPS',
        'tab-web': '🌐 WEBSITES',
        'tab-apps': '📱 APPS',
        'tab-manager': '🔧 APP MANAGER'
    };
    document.getElementById('section-label').textContent = labels[tabId] || '';

    if (isTop) {
        renderTop();
    } else if (isManager) {
        renderManager();
    } else {
        categoryFilter = null;
        resetRender(filter);
    }
}

// ── TAB LISTENERS ──
document.getElementById('tab-top').onclick = () => setActiveTab('tab-top', 'top');
document.getElementById('tab-web').onclick = () => setActiveTab('tab-web', 'website');
document.getElementById('tab-apps').onclick = () => setActiveTab('tab-apps', 'app');
document.getElementById('tab-manager').onclick = () => setActiveTab('tab-manager', 'manager');

// ── MODAL ACTIONS ──
document.getElementById('open-link').onclick = () => {
    if (currentItem && currentItem.link) window.open(currentItem.link, '_blank');
    modal.classList.remove('active');
};

// ── SEARCH ──
searchInput.oninput = () => {
    categoryFilter = null;
    const activeTab = document.querySelector('.tab-btn.active')?.id;
    if (activeTab === 'tab-top') renderTop();
    else if (activeTab !== 'tab-manager') resetRender(currentFilter);
};

// ── TOAST ──
function showToast(msg) {
    const t = document.getElementById('toast');
    t.style.display = "none";
    void t.offsetWidth;
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.style.display = "none", 2000);
}

// ── INFINITE SCROLL ──
window.onscroll = () => {
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
        const activeTab = document.querySelector('.tab-btn.active')?.id;
        if (activeTab !== 'tab-top' && activeTab !== 'tab-manager') renderBatch();
    }
};

// ── INIT ──
function init() {
    renderTop();
    setActiveTab('tab-top', 'top');
}

// ── START ──
loadJSONData();
</script>
</body>
</html>
