<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ocean Crypto Converter</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset & base */
        :root{
            --bg-1: #0f172a;
            --bg-2: #334155;
            --card-bg: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --muted: #94a3b8;
            --accent: #0ea5e9;
            --accent-2: #06b6d4;
            --success: #10b981;
            --card-padding: 20px;
            --radius: 12px;
            --shadow: 0 8px 30px rgba(2,6,23,0.6);
        }

        * { box-sizing: border-box; }
        html,body { height:100%; }
        body {
            margin:0;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(135deg, var(--bg-1) 0%, #1e293b 30%, var(--bg-2) 100%);
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            color: #e6eef6;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Bubbles (decorative) */
        .bubble {
            position: absolute;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            animation: bubble 8s infinite linear;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        @keyframes bubble {
            0% { transform: translateY(100vh) scale(0.2); opacity: 0; }
            8% { opacity: 0.6; }
            85% { opacity: 0.25; }
            100% { transform: translateY(-120px) scale(1); opacity: 0; }
        }
        /* Hide bubbles on small screens for clarity */
        @media (max-width: 520px) {
            .bubble { display: none; }
        }

        /* Page layout */
        .page-wrap {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            position:relative;
            z-index:1;
        }

        /* Card */
        .card {
            width:100%;
            max-width:460px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px) saturate(1.05);
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .card-header {
            text-align:center;
            margin-bottom:14px;
        }
        .card-header .subtitle {
            color: var(--muted);
            font-size:13px;
            font-weight:500;
            margin:0;
        }

        /* Form blocks */
        .form-block {
            margin-bottom:12px;
        }
        .label {
            display:block;
            font-size:13px;
            font-weight:600;
            color:#dbeafe;
            margin-bottom:8px;
        }

        .row {
            display:flex;
            gap:10px;
            align-items:center;
        }

        .select, .input {
            appearance:none;
            -webkit-appearance:none;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e6eef6;
            padding:10px 12px;
            border-radius: 12px;
            font-size:14px;
            outline:none;
            transition: all 180ms ease;
        }

        .select:focus, .input:focus {
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(14,165,233,0.06);
            transform: translateY(-2px);
        }

        .select { flex:1; min-width:0; }
        .input { width:84px; text-align:left; }

        /* Swap button */
        .swap-btn {
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(14,165,233,0.12), rgba(14,165,233,0.06));
            border: 1px solid rgba(14,165,233,0.12);
            color: var(--accent);
            width:44px;
            height:44px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition: transform .2s ease, box-shadow .15s ease;
            flex-shrink:0;
        }
        .swap-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 6px 18px rgba(14,165,233,0.08); }

        /* Convert button */
        .convert-btn {
            width:100%;
            display:inline-block;
            padding:12px;
            border-radius:12px;
            border:none;
            cursor:pointer;
            background: linear-gradient(90deg,#0ea5e9,#06b6d4);
            color:#042027;
            font-weight:700;
            font-size:15px;
            box-shadow: 0 8px 30px rgba(6,182,212,0.12);
            transition: transform .14s ease, box-shadow .14s ease, opacity .12s ease;
        }
        .convert-btn:active { transform: translateY(1px) scale(.997); }
        .convert-btn[disabled] { opacity:0.6; cursor:not-allowed; transform:none; }

        /* Result display */
        .result-box {
            margin-top:12px;
            background: rgba(255,255,255,0.02);
            border-radius:12px;
            padding:12px;
            border:1px solid rgba(255,255,255,0.04);
        }
        .result-title { font-size:12px; color:var(--muted); margin-bottom:6px; }
        .result-main { font-size:18px; font-weight:700; color:#f8fafc; }
        .result-sub { font-size:12px; color:#cbd5e1; margin-top:8px; }

        /* Quick convert grid */
        .quick-grid {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
            margin-top:10px;
        }
        .quick-btn {
            padding:8px 10px;
            border-radius:10px;
            background: rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.04);
            color:#e6eef6;
            font-size:13px;
            cursor:pointer;
            transition: background .15s ease, transform .12s ease;
        }
        .quick-btn:hover { background: rgba(255,255,255,0.04); transform: translateY(-2px); }

        /* Animations used in original */
        .floating { animation: float 6s ease-in-out infinite; }
        .floating-delayed { animation: float 6s ease-in-out infinite; animation-delay:-3s; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite alternate; }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 20px rgba(14,165,233,0.18); }
            to { box-shadow: 0 0 30px rgba(14,165,233,0.28); }
        }

        .slide-in { animation: slideIn .28s ease-out both; }
        @keyframes slideIn {
            from { opacity:0; transform: translateY(6px); }
            to { opacity:1; transform: translateY(0); }
        }

        /* Loading spinner + hidden utility */
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.18);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width:18px;
            height:18px;
            animation: spin 1s linear infinite;
            display:inline-block;
            vertical-align: middle;
            margin-left:8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display:none !important; }

        /* Small screens */
        @media (max-width:520px){
            .card { padding:14px; border-radius:12px; max-width:440px; }
            .input { width:72px; }
            .result-main { font-size:16px; }
            .card-header .subtitle { font-size:12px; }
            .convert-btn { padding:11px; font-size:14px; border-radius:10px; }
        }

        /* Accessibility focus */
        .select:focus-visible, .input:focus-visible, .swap-btn:focus-visible, .convert-btn:focus-visible, .quick-btn:focus-visible {
            outline: 3px solid rgba(14,165,233,0.14);
            outline-offset: 2px;
        }

        /* Retained class names from original to avoid JS mismatch where possible */
        .ocean-gradient { /* preserved name - page background already handled */ }
        .glass-effect { /* used on some elements - map to our card-ish look */ background: var(--card-bg); border:1px solid var(--glass-border); border-radius:12px; padding:10px; }
        .deep-ocean { background: rgba(255,255,255,0.02); border-radius:10px; }
        .text-slate-300 { color:#cbd5e1; }
        label { color:#e6eef6; font-weight:600; }

    </style>
</head>

    <script>
    (function() {
    const savedTheme = localStorage.getItem('perfectTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const applyForceTheme = (theme) => {
        const isDark = theme === 'dark';
        let style = document.getElementById("force-converter-theme");
        if (!style) {
            style = document.createElement('style');
            style.id = "force-converter-theme";
            document.head.appendChild(style);
        }

        if (isDark) {
            style.innerHTML = `
                /* Change Ocean Blue to Emerald Dark */
                body.ocean-gradient { 
                    background: linear-gradient(135deg, #010d08 0%, #064e3b 100%) !important; 
                }
                .glass-effect { 
                    background: rgba(6, 78, 59, 0.4) !important; 
                    border: 1px solid rgba(16, 185, 129, 0.3) !important; 
                }
                .deep-ocean, select, input { 
                    background: #010d08 !important; 
                    color: #ecfdf5 !important; 
                    border-color: #059669 !important; 
                }
                #convertBtn { 
                    background: linear-gradient(to r, #064e3b, #059669) !important; 
                }
                .text-slate-300, label { color: #10b981 !important; }
                .pulse-glow { animation: emeraldGlow 2s infinite alternate !important; }
                @keyframes emeraldGlow {
                    from { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
                    to { box-shadow: 0 0 30px rgba(16, 185, 129, 0.7); }
                }
            `;
        } else {
            style.innerHTML = `
                /* Light Mode Force: Black Text */
                body.ocean-gradient { background: #f0fdf4 !important; }
                .glass-effect { background: #ffffff !important; border: 1px solid #059669 !important; }
                .deep-ocean, select, input { 
                    background: #ffffff !important;

                    border-color: #d1fae5 !important; 
                }
                #convertBtn { background: #10b981 !important; color: #000000 !important; font-weight: 800 !important; }
                .text-white, .text-slate-300, .text-slate-400, label, span, div, h3, select, input { 
                    color: #000000 !important; 
                }
                .quick-convert { background: #d1fae5 !important; border: 1px solid #10b981 !important; }
                .bubble { display: none !important; } /* Hide bubbles in light mode for clarity */
            `;
        }
    };

    applyForceTheme(savedTheme);
})();

        class CurrencyConverter {
            constructor() {
                this.apiKey = 'demo'; // Using demo mode for real-time rates
                this.baseUrl = 'https://api.exchangerate-api.com/v4/latest/';
                this.cryptoUrl = 'https://api.coingecko.com/api/v3/simple/price';
                this.cache = new Map();
                this.cacheTimeout = 60000; // 1 minute cache
                
                this.initializeElements();
                this.bindEvents();
                this.performInitialConversion();
            }
            
            initializeElements() {
                this.fromCurrency = document.getElementById('fromCurrency');
                this.toCurrency = document.getElementById('toCurrency');
                this.fromAmount = document.getElementById('fromAmount');
                this.toAmount = document.getElementById('toAmount');
                this.convertBtn = document.getElementById('convertBtn');
                this.swapBtn = document.getElementById('swapBtn');
                this.resultDisplay = document.getElementById('resultDisplay');
                this.conversionResult = document.getElementById('conversionResult');
                this.exchangeRate = document.getElementById('exchangeRate');
                this.lastUpdated = document.getElementById('lastUpdated');
                this.loadingSpinner = document.getElementById('loadingSpinner');
                this.quickConvertBtns = document.querySelectorAll('.quick-convert');
            }
            
            bindEvents() {
                this.convertBtn.addEventListener('click', () => this.convert());
                this.swapBtn.addEventListener('click', () => this.swapCurrencies());
                this.fromAmount.addEventListener('input', () => this.debounceConvert());
                this.fromCurrency.addEventListener('change', () => this.convert());
                this.toCurrency.addEventListener('change', () => this.convert());
                
                this.quickConvertBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const from = e.target.dataset.from;
                        const to = e.target.dataset.to;
                        this.fromCurrency.value = from;
                        this.toCurrency.value = to;
                        this.convert();
                    });
                });
                
                // Auto-convert on page load
                setTimeout(() => this.convert(), 500);
            }
            
            debounceConvert() {
                clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(() => this.convert(), 500);
            }
            
            async convert() {
                const from = this.fromCurrency.value;
                const to = this.toCurrency.value;
                const amount = parseFloat(this.fromAmount.value) || 1;
                
                if (from === to) {
                    this.displayResult(amount, amount, 1, from, to);
                    return;
                }
                
                this.showLoading(true);
                
                try {
                    const rate = await this.getExchangeRate(from, to);
                    const convertedAmount = amount * rate;
                    
                    this.displayResult(amount, convertedAmount, rate, from, to);
                    this.toAmount.textContent = this.formatAmount(convertedAmount, to);
                } catch (error) {
                    console.error('Conversion error:', error);
                    this.toAmount.textContent = 'Error';
                    this.showError('Unable to fetch current rates. Please try again.');
                } finally {
                    this.showLoading(false);
                }
            }
            
            async getExchangeRate(from, to) {
                const cacheKey = `${from}-${to}`;
                const cached = this.cache.get(cacheKey);
                
                if (cached && Date.now() - cached.timestamp < this.cacheTimeout) {
                    return cached.rate;
                }
                
                const cryptos = ['BTC', 'ETH', 'BNB', 'XRP', 'ADA', 'SOL', 'DOT', 'DOGE', 'AVAX', 'LINK', 'LTC', 'MATIC', 'UNI'];
                const fiats = ['USD', 'EUR', 'GBP', 'JPY', 'INR', 'CAD', 'AUD'];
                
                let rate;
                
                if (cryptos.includes(from) || cryptos.includes(to)) {
                    rate = await this.getCryptoRate(from, to);
                } else {
                    rate = await this.getFiatRate(from, to);
                }
                
                this.cache.set(cacheKey, { rate, timestamp: Date.now() });
                return rate;
            }
            
            async getCryptoRate(from, to) {
                const cryptoMap = {
                    'BTC': 'bitcoin',
                    'ETH': 'ethereum',
                    'BNB': 'binancecoin',
                    'XRP': 'ripple',
                    'ADA': 'cardano',
                    'SOL': 'solana',
                    'DOT': 'polkadot',
                    'DOGE': 'dogecoin',
                    'AVAX': 'avalanche-2',
                    'LINK': 'chainlink',
                    'LTC': 'litecoin',
                    'MATIC': 'matic-network',
                    'UNI': 'uniswap'
                };
                
                const fiatMap = {
                    'USD': 'usd',
                    'EUR': 'eur',
                    'GBP': 'gbp',
                    'JPY': 'jpy',
                    'INR': 'inr',
                    'CAD': 'cad',
                    'AUD': 'aud'
                };
                
                if (cryptoMap[from] && fiatMap[to]) {
                    // Crypto to Fiat
                    const response = await fetch(`${this.cryptoUrl}?ids=${cryptoMap[from]}&vs_currencies=${fiatMap[to]}`);
                    const data = await response.json();
                    return data[cryptoMap[from]][fiatMap[to]];
                } else if (fiatMap[from] && cryptoMap[to]) {
                    // Fiat to Crypto
                    const response = await fetch(`${this.cryptoUrl}?ids=${cryptoMap[to]}&vs_currencies=${fiatMap[from]}`);
                    const data = await response.json();
                    return 1 / data[cryptoMap[to]][fiatMap[from]];
                } else if (cryptoMap[from] && cryptoMap[to]) {
                    // Crypto to Crypto
                    const response = await fetch(`${this.cryptoUrl}?ids=${cryptoMap[from]},${cryptoMap[to]}&vs_currencies=usd`);
                    const data = await response.json();
                    const fromUsd = data[cryptoMap[from]].usd;
                    const toUsd = data[cryptoMap[to]].usd;
                    return fromUsd / toUsd;
                }
                
                throw new Error('Unsupported currency pair');
            }
            
            async getFiatRate(from, to) {
                const response = await fetch(`${this.baseUrl}${from}`);
                const data = await response.json();
                return data.rates[to];
            }
            
            displayResult(fromAmount, toAmount, rate, fromCurrency, toCurrency) {
                this.conversionResult.textContent = 
                    `${this.formatAmount(fromAmount, fromCurrency)} = ${this.formatAmount(toAmount, toCurrency)}`;
                
                this.exchangeRate.textContent = 
                    `1 ${fromCurrency} = ${this.formatAmount(rate, toCurrency)}`;
                
                this.lastUpdated.textContent = 
                    `Updated: ${new Date().toLocaleTimeString()}`;
                
                this.resultDisplay.classList.remove('hidden');
                this.resultDisplay.classList.add('slide-in');
            }
            
            formatAmount(amount, currency) {
                const cryptos = ['BTC', 'ETH', 'BNB', 'XRP', 'ADA', 'SOL', 'DOT', 'DOGE', 'AVAX', 'LINK', 'LTC', 'MATIC', 'UNI'];
                
                if (cryptos.includes(currency)) {
                    return amount < 1 ? amount.toFixed(8) : amount.toFixed(4);
                }
                
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: currency === 'BTC' ? 'USD' : currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: currency === 'JPY' ? 0 : 2
                }).format(amount).replace(/[A-Z]{3}/, currency);
            }
            
            swapCurrencies() {
                const fromValue = this.fromCurrency.value;
                const toValue = this.toCurrency.value;
                
                this.fromCurrency.value = toValue;
                this.toCurrency.value = fromValue;
                
                // Add animation effect
                this.swapBtn.style.transform = 'rotate(180deg)';
                setTimeout(() => {
                    this.swapBtn.style.transform = 'rotate(0deg)';
                }, 300);
                
                this.convert();
            }
            
            showLoading(show) {
                if (show) {
                    this.loadingSpinner.classList.remove('hidden');
                    this.convertBtn.disabled = true;
                    this.convertBtn.textContent = 'Converting...';
                } else {
                    this.loadingSpinner.classList.add('hidden');
                    this.convertBtn.disabled = false;
                    this.convertBtn.textContent = 'Convert Currency';
                }
            }
            
            showError(message) {
                this.conversionResult.textContent = message;
                this.exchangeRate.textContent = '';
                this.lastUpdated.textContent = '';
                this.resultDisplay.classList.remove('hidden');
            }
            
            performInitialConversion() {
                setTimeout(() => this.convert(), 1000);
            }
        }
        
        // Initialize the converter when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new CurrencyConverter();
        });
    </script>
