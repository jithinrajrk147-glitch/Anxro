<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>YTBook - All Video Notes</title>
<style>
  :root{ --bg:#0b0b0c; --surface:#141618; --muted:#a6a6a6; --primary:#00d48d; --border: rgba(255,255,255,0.06); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial;padding:20px}
  h1{margin:0 0 20px;font-size:24px}
 .search{width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:20px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
 .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
 .card-header{display:flex;justify-content:space-between;align-items:center}
 .vid{font-weight:700;color:var(--primary)}
 .date{color:var(--muted);font-size:12px}
 .preview{color:#ddd;font-size:14px;line-height:1.4;max-height:120px;overflow:hidden;white-space:pre-wrap}
 .actions{display:flex;gap:8px;margin-top:8px}
 .btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;text-decoration:none}
 .btn:hover{background:rgba(255,255,255,0.1)}
 .empty{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<h1>YTBook - All Notes</h1>
<input class="search" id="search" placeholder="Search by video ID..." />
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No notes saved yet. Open a video with?v=VIDEO_ID to start.</div>

<script>
  const ALL_NOTES_KEY = 'yt_notes_index_v1';
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const empty = document.getElementById('empty');

  function loadNotes(){
    const index = JSON.parse(localStorage.getItem(ALL_NOTES_KEY) || '{}');
    const entries = Object.entries(index).sort((a,b) => b[1].updated - a[1].updated);

    if(entries.length === 0){
      empty.style.display = 'block';
      grid.innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = entries.map(([vid, data]) => {
      const noteKey = `yt_notes_text_${vid}`;
      const fullNote = localStorage.getItem(noteKey) || '';
      const date = new Date(data.updated).toLocaleString();
      return `
        <div class="card" data-vid="${vid}">
          <div class="card-header">
            <div class="vid">${vid}</div>
            <div class="date">${date}</div>
          </div>
          <div class="preview">${escapeHtml(fullNote || data.preview || 'Empty')}</div>
          <div class="actions">
           
            <button class="btn" onclick="deleteNote('${vid}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.copyNote = (vid) => {
    const text = localStorage.getItem(`yt_notes_text_${vid}`) || '';
    navigator.clipboard.writeText(text);
    alert('Copied!');
  }

  window.deleteNote = (vid) => {
    if(!confirm(`Delete notes for ${vid}?`)) return;
    localStorage.removeItem(`yt_notes_text_${vid}`);
    let index = JSON.parse(localStorage.getItem(ALL_NOTES_KEY) || '{}');
    delete index[vid];
    localStorage.setItem(ALL_NOTES_KEY, JSON.stringify(index));
    loadNotes();
  }

  search.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      const vid = card.dataset.vid.toLowerCase();
      card.style.display = vid.includes(q)? '' : 'none';
    });
  });

  loadNotes();

  // Live update if notes change in other tab
  window.addEventListener('storage', loadNotes);
</script>
</body>
</html>
