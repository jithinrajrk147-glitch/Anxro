<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calendar</title>

    <style>
        /* Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Page Padding */
        .page-padding {
            padding: 16px;
        }
        @media (min-width: 768px) {
            .page-padding {
                padding: 40px;
            }
        }

        /* Ad Banner */
        .ad-banner {
            width: 100%;
            height: 60px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #4b5563;
            margin: 16px 0;
            font-size: 14px;
        }

        /* Main container */
        .calendar-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Header Gradient */
        .header-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            color: white;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .nav-button {
            padding: 8px;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 20px;
            color: Black;
        }
        .nav-button:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        /* Calendar Box */
        .calendar-box {
            background: white;
            padding: 16px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Weekday Headers */
        .weekday-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .weekday {
            text-align: center;
            padding: 10px 0;
            font-weight: 600;
            color: #4b5563;
            font-size: 12px;
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }

        /* Day Cell */
        .calendar-day {
            background: white;
            width: 100%;

            /* Square auto-fit technique */
            position: relative;
            padding-top: 100%;  /* Makes perfect square */
            
            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }

        /* Actual number is absolutely positioned */
        .calendar-day span.day-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        .calendar-day:hover {
            background: #f3f4f6;
            transform: scale(1.03);
            z-index: 5;
        }

        /* Styles */
        .other-month {
            background: #f9fafb;
            color: #;
        }

        .today {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            font-weight: 600;
        }

        .marked {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .marked:hover {
            background: linear-gradient(135deg, #ff5252 0%, #d63031 100%);
        }

        .mark-x {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        /* MOBILE FIX: Shrink weekday + spacing */
        @media (max-width: 420px) {
            .weekday {
                font-size: 10px;
                padding: 6px 0;
            }
            .calendar-day span.day-number {
                font-size: 12px;
            }
        }
    </style>

</head>
<body class="page-padding">

    <!-- Top Ad -->
    <div class="ad-banner">Ad Unit (Top Banner)</div>

    <div class="calendar-container">

     
        <div class="header-gradient">
            <div class="header-top">
                <button id="prevMonth" class="nav-button">« </button>
                <h1 id="monthYear" style="font-size: 20px; font-weight: 700;"></h1>
                <button id="nextMonth" class="nav-button">»</button>
            </div>
            <p style="text-align:center; opacity:0.9; font-size:14px;">Click any date to toggle ❌ marker</p>
        </div>

        <!-- Calendar -->
        <div class="calendar-box">

            <!-- Weekday Headers -->
            <div class="weekday-grid">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

            <!-- Grid -->
            <div id="calendarGrid" class="calendar-grid"></div>

        </div>
    </div>

    <!-- Bottom Ad -->
    <div class="ad-banner">Ad Unit (Bottom Banner)</div>

    <script>
    (function() {
    // 1. Theme Detection & Sync
    const savedTheme = localStorage.getItem('perfectTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const applyTheme = (theme) => {
        const isDark = theme === 'dark';
        const styles = document.createElement('style');
        styles.id = "theme-force-styles";
        
        // Remove old forced styles if they exist
        const oldStyle = document.getElementById("theme-force-styles");
        if(oldStyle) oldStyle.remove();

        if (isDark) {
            styles.innerHTML = `
                body { background: #010d08 !important; color: #ecfdf5 !important; }
                .header-gradient, .today { background: linear-gradient(135deg, rgb(6, 78, 59) 0%, #010d08 100%) !important; color: #fff !important; }
                .calendar-box, .calendar-day { background: rgb(6, 78, 59) !important; color: #ecfdf5 !important; border-color: rgba(255,255,255,0.1) !important; }
                .calendar-grid { background: rgba(255,255,255,0.1) !important; }
                .weekday { color: #10b981 !important; }
                .nav-button { color: #ffffff !important; background: rgba(255,255,255,0.1) !important; }
                .ad-banner { background: #0d140e !important; color: #10b981 !important; border: 1px solid #10b981; }
            `;
        } else {
            styles.innerHTML = `
                body { background: #f0fdf4 !important; color: #000000 !important; }
                .header-gradient { background: rgb(16, 185, 129) !important; color: #000000 !important; }
                .calendar-box, .calendar-day { background: #ffffff !important; color: #000000 !important; }
                .calendar-grid { background: #e5e7eb !important; }
                .weekday, #monthYear, p, .day-number, .nav-button { color: #0000000 !important; }
                .nav-button { background: rgba(0,0,0,0.05) !important; }
                .other-month { background: #f9fafb !important; color: #ccc !important; }
                .ad-banner { background: #e5e7eb !important; color: #4b5563 !important; border: none; }
            `;
        }
        document.head.appendChild(styles);
    };

    // Apply immediately on load
    applyTheme(savedTheme);
})();

        class PremiumCalendar {
            constructor() {
                this.currentDate = new Date();
                this.marked = new Set();
                this.key = "premiumCalendar";
                this.load();
                this.render();
                this.controls();
            }

            controls() {
                document.getElementById("prevMonth").onclick = () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.render();
                };
                document.getElementById("nextMonth").onclick = () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.render();
                };
            }

            render() {
                this.header();
                this.grid();
            }

            header() {
                const m = [
                    "January","February","March","April","May","June",
                    "July","August","September","October","November","December"
                ];
                document.getElementById("monthYear").textContent =
                    m[this.currentDate.getMonth()] + " " + this.currentDate.getFullYear();
            }

            grid() {
                const grid = document.getElementById("calendarGrid");
                grid.innerHTML = "";

                const y = this.currentDate.getFullYear();
                const m = this.currentDate.getMonth();
                const today = new Date();
                const first = new Date(y, m, 1);

                let start = new Date(first);
                start.setDate(start.getDate() - first.getDay());

                for (let i = 0; i < 42; i++) {
                    let d = new Date(start);
                    d.setDate(start.getDate() + i);

                    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

                    const cell = document.createElement("div");
                    cell.className = "calendar-day";

                    if (d.getMonth() !== m) cell.classList.add("other-month");
                    if (d.toDateString() === today.toDateString()) cell.classList.add("today");
                    if (this.marked.has(key)) cell.classList.add("marked");

                    const num = document.createElement("span");
                    num.className = "day-number";
                    num.textContent = d.getDate();
                    cell.appendChild(num);

                    if (this.marked.has(key)) {
                        const x = document.createElement("span");
                        x.className = "mark-x";
                        x.textContent = "❌";
                        cell.appendChild(x);
                    }

                    cell.onclick = () => this.toggle(key, cell);

                    grid.appendChild(cell);
                }
            }

            toggle(key, el) {
                if (this.marked.has(key)) {
                    this.marked.delete(key);
                } else {
                    this.marked.add(key);
                }
                this.save();
                this.grid();
            }

            save() {
                localStorage.setItem(this.key, JSON.stringify([...this.marked]));
            }

            load() {
                const data = localStorage.getItem(this.key);
                if (data) {
                    this.marked = new Set(JSON.parse(data));
                }
            }
        }

        new PremiumCalendar();
  // This logic:
 
</script>

    

</body>
</html>
