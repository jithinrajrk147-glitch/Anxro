<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MicroSheet Habit Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --today-bg: #eff6ff;
            --cell-size: 32px; /* Micro size */
            --habit-col-width: 80px; /* Slimmed habit column */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar with Year/Month Picker */
        header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            z-index: 30;
        }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-controls { display: flex; align-items: center; gap: 5px; justify-content: center; }
        
        select.picker {
            border: none;
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            outline: none;
        }

        .time-box { font-weight: 800; font-size: 0.9rem; color: var(--primary); }
        .btn-add {
            background: var(--primary); color: white; border: none;
            padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold;
        }

        /* Spreadsheet Body */
        .viewport {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table { border-collapse: collapse; table-layout: fixed; }

        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background: #fff;
            z-index: 10;
            width: var(--habit-col-width);
            min-width: var(--habit-col-width);
            border-right: 2px solid var(--border);
            padding: 2px 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #f9fafb;
            z-index: 9;
            height: 50px;
            border-bottom: 1px solid var(--border);
        }

        .date-cell {
            width: var(--cell-size);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .date-cell .day-name { font-size: 0.55rem; text-transform: uppercase; color: #9ca3af; }
        .date-cell .day-num { font-size: 0.9rem; font-weight: 800; margin-top: 2px; }
        .date-cell.is-today { color: var(--primary); background: var(--today-bg); border-radius: 4px; padding: 2px 0; }

        td {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid var(--border);
            text-align: center;
            padding: 0;
        }

        .box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .box.done { background: #22c55e; color: white; }
        .box.future { opacity: 0.1; pointer-events: none; background: #f3f4f6; }

        /* Summary Row */
        .summary-row td { background: #f8fafc; font-size: 0.65rem; font-weight: bold; color: var(--primary); }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 280px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border); border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="time-box" id="clock">12:00:00 PM</div>
            <button class="btn-add" onclick="document.getElementById('modal').style.display='flex'">+ GOAL</button>
        </div>
        <div class="nav-controls">
            <select id="view-month" class="picker" onchange="render()"></select>
            <select id="view-year" class="picker" onchange="render()"></select>
        </div>
    </header>

    <div class="viewport" id="sheet-scroll">
        <table>
            <thead>
                <tr id="header-row">
                    <th>Goals</th>
                </tr>
            </thead>
            <tbody id="habit-body"></tbody>
            <tfoot id="habit-foot"></tfoot>
        </table>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h4 style="margin:0">Add New Goal</h4>
            <input type="text" id="h-name" placeholder="Habit Name">
            <div style="display:flex; gap:10px;">
                <button onclick="document.getElementById('modal').style.display='none'" style="flex:1; border:none; background:none;">Cancel</button>
                <button onclick="addHabit()" style="flex:1; background:var(--primary); color:white; border:none; padding:8px; border-radius:6px;">Save</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
    // 1. Theme Detection & Sync
    const savedTheme = localStorage.getItem('perfectTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const applyForceTheme = (theme) => {
        const isDark = theme === 'dark';
        let style = document.getElementById("force-microsheet-emerald");
        if (!style) {
            style = document.createElement('style');
            style.id = "force-microsheet-emerald";
            document.head.appendChild(style);
        }

        if (isDark) {
            style.innerHTML = `
                body { background: #010d08 !important; color: #ecfdf5 !important; }
                header, thead th, th:first-child, td:first-child, .modal-content { 
                    background: #064e3b !important; 
                    color: #ecfdf5 !important; 
                    border-color: #065f46 !important; 
                }
                .picker { background: #010d08 !important; color: #10b981 !important; border: 1px solid #10b981 !important; }
                .time-box, .date-cell.is-today { color: #10b981 !important; }
                .btn-add, .modal-content button:last-child { background: #10b981 !important; color: #010d08 !important; }
                td { border-color: #065f46 !important; }
                .box { color: #064e3b !important; }
                .box.done { background: #10b981 !important; color: #010d08 !important; font-weight: 900 !important; }
                .box.future { background: #010d08 !important; opacity: 0.2 !important; }
                .summary-row td { background: #010d08 !important; color: #10b981 !important; }
                input { background: #010d08 !important; border-color: #10b981 !important; color: #fff !important; }
            `;
        } else {
            style.innerHTML = `
                body { background: #f0fdf4 !important; color: #000000 !important; }
                header, thead th, th:first-child, td:first-child, .modal-content { 
                    background: #ffffff !important; 
                    color: #000000 !important; 
                    border-color: #059669 !important; 
                }
                .time-box, .date-cell.is-today, .summary-row td { color: #059669 !important; }
                .btn-add { background: #059669 !important; color: #ffffff !important; }
                .box.done { background: #059669 !important; color: #ffffff !important; }
                th, td, span, div, strong { color: #000000 !important; }
                .day-name { color: #444 !important; font-weight: 700 !important; }
                input { border-color: #059669 !important; color: #000000 !important; }
            `;
        }
    };

    applyForceTheme(savedTheme);
})();

        let habits = JSON.parse(localStorage.getItem('nanogrid_habits')) || [];
        const today = new Date();
        
        // Initialize Pickers
        const monthSelect = document.getElementById('view-month');
        const yearSelect = document.getElementById('view-year');
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        
        months.forEach((m, i) => {
            let opt = new Option(m, i);
            if(i === today.getMonth()) opt.selected = true;
            monthSelect.add(opt);
        });

        for(let y = today.getFullYear() - 2; y <= today.getFullYear() + 75; y++) {
            let opt = new Option(y, y);
            if(y === today.getFullYear()) opt.selected = true;
            yearSelect.add(opt);
        }

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = String(now.getMinutes()).padStart(2, '0');
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function addHabit() {
            const name = document.getElementById('h-name').value;
            if (!name) return;
            habits.push({ id: Date.now(), name, history: [] });
            localStorage.setItem('nanogrid_habits', JSON.stringify(habits));
            document.getElementById('modal').style.display = 'none';
            document.getElementById('h-name').value = '';
            render();
        }

        function toggle(hId, dateStr) {
            const habit = habits.find(h => h.id === hId);
            const idx = habit.history.indexOf(dateStr);
            if (idx > -1) habit.history.splice(idx, 1);
            else habit.history.push(dateStr);
            localStorage.setItem('nanogrid_habits', JSON.stringify(habits));
            render();
        }

        function deleteHabit(id) {
            if(confirm("Delete goal?")) {
                habits = habits.filter(h => h.id !== id);
                localStorage.setItem('nanogrid_habits', JSON.stringify(habits));
                render();
            }
        }

        function render() {
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const headerRow = document.getElementById('header-row');
            const habitBody = document.getElementById('habit-body');
            const habitFoot = document.getElementById('habit-foot');

            headerRow.innerHTML = '<th>Goals</th>';
            const currentDates = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                currentDates.push(dateObj);
                const isToday = dateObj.toDateString() === today.toDateString();
                const th = document.createElement('th');
                th.innerHTML = `
                    <div class="date-cell ${isToday ? 'is-today' : ''}">
                        <span class="day-name">${dateObj.toLocaleDateString('en', {weekday: 'short'})[0]}</span>
                        <span class="day-num">${d}</span>
                    </div>
                `;
                headerRow.appendChild(th);
            }

            habitBody.innerHTML = '';
            habits.forEach(h => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td ondblclick="deleteHabit(${h.id})"><strong>${h.name}</strong></td>`;
                
                currentDates.forEach(date => {
                    const dStr = date.toISOString().split('T')[0];
                    const done = h.history.includes(dStr);
                    const future = date > today;
                    const td = document.createElement('td');
                    td.innerHTML = `<div class="box ${done ? 'done' : ''} ${future ? 'future' : ''}" 
                                    onclick="toggle(${h.id}, '${dStr}')">${done ? '✓' : ''}</div>`;
                    tr.appendChild(td);
                });
                habitBody.appendChild(tr);
            });

            // Summary Row (Daily Count)
            let footHtml = `<tr class="summary-row"><td><strong>Total</strong></td>`;
            currentDates.forEach(date => {
                const dStr = date.toISOString().split('T')[0];
                const count = habits.filter(h => h.history.includes(dStr)).length;
                footHtml += `<td>${count}</td>`;
            });
            footHtml += `</tr>`;
            habitFoot.innerHTML = footHtml;

            // Auto-scroll to today if viewing current month
            if(year === today.getFullYear() && month === today.getMonth()) {
                const todayCell = document.querySelector('.is-today');
                if(todayCell) {
                    document.getElementById('sheet-scroll').scrollLeft = todayCell.offsetLeft - 120;
                }
            }
        }

        render();
    </script>
</body>
</html>
