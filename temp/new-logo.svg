<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f5f5f5"/>
  <g transform="translate(100, 100)">
    <!-- Left handle -->
    <path d="M -80,-30 L -40,-10 L -20,0" 
          stroke="#1a1a1a" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Right handle -->
    <path d="M 80,-30 L 40,-10 L 20,0" 
          stroke="#1a1a1a" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Left jaw -->
    <path d="M -20,0 L -30,20 L -20,30 L -10,20 Z" 
          stroke="#1a1a1a" 
          stroke-width="8" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Right jaw -->
    <path d="M 20,0 L 30,20 L 20,30 L 10,20 Z" 
          stroke="#1a1a1a" 
          stroke-width="8" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Pivot point -->
    <circle cx="0" cy="0" r="6" fill="#1a1a1a"/>
  </g>
</svg>