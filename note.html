<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DevPad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e14;
  --s1: #16161f;
  --s2: #1e1e2a;
  --br: #2c2c3e;
  --a:  #f0a500;
  --a2: #ffd080;
  --t:  #e4e4f0;
  --m:  #5a5a78;
  --cy: #00c9be;
  --pu: #9b6dff;
  --rd: #ff5f7e;
  --gn: #3dffc0;
  --fh: 'Outfit', sans-serif;
  --fm: 'DM Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--t); font-family:var(--fh); overflow:hidden; }

/* APP SHELL */
#app { display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; }

/* TOP BAR */
#bar {
  display:flex; align-items:center; padding:12px 16px 10px;
  background:var(--s1); border-bottom:1px solid var(--br); flex-shrink:0;
  gap:10px;
}
#bar .logo { font-size:17px; font-weight:800; letter-spacing:-.4px;
  background:linear-gradient(90deg,var(--a),var(--pu)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#bar .page-title { flex:1; font-size:14px; font-weight:700; color:var(--t); min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#new-btn {
  width:32px; height:32px; border-radius:9px; background:var(--a); border:none;
  color:#000; font-size:20px; font-weight:700; cursor:pointer; display:flex;
  align-items:center; justify-content:center; flex-shrink:0; transition:opacity .15s;
}
#new-btn:active { opacity:.7; }
#new-btn.hidden { display:none; }

/* PANELS */
.panel { display:none; flex:1; flex-direction:column; overflow:hidden; }
.panel.on { display:flex; }

/* ── NOTES ── */
#notes-list-wrap { flex:1; overflow-y:auto; padding:10px 14px; }
#notes-list-wrap::-webkit-scrollbar { display:none; }

.note-card {
  background:var(--s1); border:1px solid var(--br); border-radius:12px;
  padding:13px 14px; margin-bottom:10px; cursor:pointer; transition:border-color .15s;
  animation: fadeUp .2s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.note-card:active { border-color:var(--a); }
.note-card .nc-title { font-size:14px; font-weight:700; margin-bottom:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-card .nc-preview { font-size:12px; color:var(--m); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.note-card .nc-foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
.note-card .nc-date { font-family:var(--fm); font-size:10px; color:var(--m); }
.tag { display:inline-block; font-size:9px; font-family:var(--fm); font-weight:500;
  padding:2px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.5px; }
.tag-note    { background:rgba(0,201,190,.15); color:var(--cy); }
.tag-feature { background:rgba(155,109,255,.15); color:var(--pu); }
.tag-idea    { background:rgba(240,165,0,.15); color:var(--a2); }
.tag-bug     { background:rgba(255,95,126,.15); color:var(--rd); }

.empty-state { text-align:center; padding:60px 20px; color:var(--m); }
.empty-state .es-icon { font-size:40px; margin-bottom:12px; }
.empty-state p { font-size:13px; line-height:1.6; }

/* NOTE EDITOR */
#note-editor { display:none; flex:1; flex-direction:column; overflow:hidden; }
#note-editor.on { display:flex; }
#ed-top {
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  border-bottom:1px solid var(--br); flex-shrink:0;
}
#ed-back {
  width:32px; height:32px; border-radius:9px; background:var(--s2);
  border:1px solid var(--br); color:var(--t); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#ed-title { flex:1; background:transparent; border:none; outline:none;
  font-family:var(--fh); font-size:15px; font-weight:700; color:var(--t); min-width:0; }
#ed-title::placeholder { color:var(--m); }
#ed-tag { padding:5px 9px; border-radius:7px; border:1px solid var(--br);
  background:var(--s2); color:var(--t); font-family:var(--fm); font-size:11px; outline:none; }
#ed-del { width:32px; height:32px; border-radius:9px; background:transparent;
  border:1px solid var(--br); color:var(--m); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; }
#ed-del:active { background:var(--rd); color:#fff; border-color:var(--rd); }

#ed-fmt {
  display:flex; gap:6px; padding:8px 14px; overflow-x:auto; flex-shrink:0;
  border-bottom:1px solid var(--br); scrollbar-width:none;
}
#ed-fmt::-webkit-scrollbar { display:none; }
.fb { padding:5px 10px; border-radius:7px; border:1px solid var(--br);
  background:var(--s2); color:var(--m); font-family:var(--fm); font-size:11px;
  cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .1s; }
.fb:active { background:var(--a); color:#000; border-color:var(--a); }

#ed-body { flex:1; padding:14px 16px; outline:none; overflow-y:auto;
  font-family:var(--fm); font-size:13px; line-height:1.9; color:var(--t);
  border:none; background:transparent; resize:none; }
#ed-body::placeholder { color:var(--m); }
#ed-body::-webkit-scrollbar { display:none; }

#ed-status { padding:6px 16px; display:flex; gap:14px;
  font-family:var(--fm); font-size:10px; color:var(--m);
  border-top:1px solid var(--br); flex-shrink:0; }
#ed-status span { color:var(--cy); }

/* ── SLIDES ── */
#slides-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }

#slide-canvas {
  flex:1; margin:14px; border-radius:14px; border:1px solid var(--br);
  background:var(--s1); padding:28px 22px; display:flex; flex-direction:column;
  gap:14px; position:relative; overflow:hidden;
}
#slide-canvas::before {
  content:''; position:absolute; top:-50px; right:-50px; width:150px; height:150px;
  border-radius:50%; background:radial-gradient(circle,rgba(155,109,255,.12),transparent 70%); pointer-events:none;
}
#sl-head { background:transparent; border:none; outline:none; border-bottom:1.5px solid var(--br);
  padding-bottom:10px; font-family:var(--fh); font-size:20px; font-weight:800;
  color:var(--a); width:100%; }
#sl-head::placeholder { color:rgba(240,165,0,.3); }
#sl-body { flex:1; background:transparent; border:none; outline:none; resize:none;
  font-family:var(--fm); font-size:12.5px; color:var(--t); line-height:1.9; width:100%; }
#sl-body::placeholder { color:var(--m); }
#sl-num { position:absolute; bottom:10px; right:14px;
  font-family:var(--fm); font-size:10px; color:var(--m); }

#slide-thumbs {
  display:flex; gap:8px; padding:0 14px 10px; overflow-x:auto; flex-shrink:0;
  scrollbar-width:none;
}
#slide-thumbs::-webkit-scrollbar { display:none; }
.sthumb {
  flex-shrink:0; width:72px; height:44px; border-radius:8px; border:1.5px solid var(--br);
  background:var(--s2); cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-direction:column; padding:5px; overflow:hidden; transition:border-color .15s;
}
.sthumb.active { border-color:var(--a); }
.sthumb p { font-size:7px; color:var(--m); line-height:1.3; text-align:center;
  width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
.sthumb .stn { font-family:var(--fm); font-size:7px; color:var(--a); font-weight:700; margin-bottom:2px; }

#slides-ctrl {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 14px; border-top:1px solid var(--br); flex-shrink:0;
}
.sc-btn { flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--br);
  background:var(--s2); color:var(--t); font-family:var(--fh); font-size:12px;
  font-weight:600; cursor:pointer; transition:all .1s; }
.sc-btn:active { background:var(--a); color:#000; border-color:var(--a); }
.sc-btn.del:active { background:var(--rd); color:#fff; border-color:var(--rd); }
#sl-counter { font-family:var(--fm); font-size:12px; color:var(--m);
  min-width:46px; text-align:center; flex-shrink:0; }

/* ── SHEET ── */
#sheet-wrap { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
#sheet-wrap::-webkit-scrollbar { display:none; }
#sh-table { border-collapse:collapse; }
#sh-table th, #sh-table td { border:1px solid var(--br); }

.sh-corner { background:var(--s1); width:36px; min-width:36px; position:sticky; top:0; left:0; z-index:4; }
.sh-col { background:var(--s1); min-width:80px; padding:5px 4px; text-align:center;
  font-family:var(--fm); font-size:10px; color:var(--m); position:sticky; top:0; z-index:2; font-weight:700; }
.sh-row { background:var(--s1); min-width:36px; text-align:center;
  font-family:var(--fm); font-size:10px; color:var(--m); position:sticky; left:0; z-index:1; }
.sh-cell { min-width:80px; height:30px; background:var(--bg); padding:0; }
.sh-cell input { width:100%; height:100%; padding:0 6px; background:transparent;
  border:none; outline:none; font-family:var(--fm); font-size:11.5px; color:var(--t); }
.sh-cell.focus { background:rgba(155,109,255,.12); outline:1.5px solid var(--pu); outline-offset:-1.5px; z-index:1; }
.sh-cell.formula input { color:var(--cy); }

#sh-bar { display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-top:1px solid var(--br); flex-shrink:0; background:var(--s1); }
#sh-ref { width:48px; text-align:center; font-family:var(--fm); font-size:11px;
  color:var(--cy); background:var(--s2); border:1px solid var(--br); border-radius:6px; padding:5px 4px; }
#sh-formula { flex:1; background:var(--s2); border:1px solid var(--br); border-radius:6px;
  padding:5px 9px; font-family:var(--fm); font-size:11px; color:var(--t); outline:none; }
#sh-formula:focus { border-color:var(--a); }
#sh-stats { padding:4px 14px; font-family:var(--fm); font-size:10px; color:var(--m);
  display:flex; gap:12px; flex-shrink:0; }
#sh-stats span { color:var(--gn); }

/* ── TOOLS ── */
#tools-wrap { flex:1; overflow-y:auto; padding:12px 14px; }
#tools-wrap::-webkit-scrollbar { display:none; }
.tool-card {
  background:var(--s1); border:1px solid var(--br); border-radius:12px;
  padding:14px; margin-bottom:10px;
}
.tool-card h3 { font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px; }
.tool-card h3 .icon { font-size:16px; }
.tool-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.tool-input { flex:1; min-width:0; padding:8px 10px; border-radius:8px;
  border:1px solid var(--br); background:var(--s2); color:var(--t);
  font-family:var(--fm); font-size:12px; outline:none; }
.tool-input:focus { border-color:var(--a); }
.tool-btn { padding:8px 14px; border-radius:8px; border:none; background:var(--a);
  color:#000; font-family:var(--fh); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.tool-btn:active { opacity:.8; }
.tool-btn.sec { background:var(--s2); color:var(--t); border:1px solid var(--br); }
.tool-output { background:var(--s2); border-radius:8px; padding:10px 12px;
  font-family:var(--fm); font-size:12px; color:var(--cy); line-height:1.7;
  min-height:38px; word-break:break-all; white-space:pre-wrap; }

/* ── BOTTOM NAV ── */
#nav {
  display:flex; background:var(--s1); border-top:1px solid var(--br);
  flex-shrink:0; padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:9px 0 7px; cursor:pointer; border:none; background:transparent;
  color:var(--m); font-family:var(--fh); font-size:9px; font-weight:600;
  letter-spacing:.3px; transition:color .15s; gap:4px;
}
.nav-btn .ni { font-size:20px; }
.nav-btn.active { color:var(--a); }
</style>
</head>
<body>
<div id="app">

  <div id="bar">
    <div class="logo">✦ DevPad</div>
    <div class="page-title" id="page-title">Notes</div>
    <button id="new-btn" onclick="handleNew()">+</button>
  </div>

  <!-- NOTES LIST -->
  <div id="p-notes" class="panel on">
    <div id="notes-list-wrap">
      <div id="notes-list"></div>
    </div>
    <!-- editor sits inside panel, hidden by default -->
    <div id="note-editor">
      <div id="ed-top">
        <button id="ed-back" onclick="closeEditor()">←</button>
        <input id="ed-title" placeholder="Title…" oninput="saveNote()">
        <select id="ed-tag" onchange="saveNote()">
          <option value="note">note</option>
          <option value="feature">feature</option>
          <option value="idea">idea</option>
          <option value="bug">bug</option>
        </select>
        <button id="ed-del" onclick="deleteNote()">🗑</button>
      </div>
      <div id="ed-fmt">
        <div class="fb" onclick="ins('## ')">H2</div>
        <div class="fb" onclick="ins('- ')">• List</div>
        <div class="fb" onclick="ins('[ ] ')">☐ Todo</div>
        <div class="fb" onclick="ins('`code`')">code</div>
        <div class="fb" onclick="ins('---\n')">─ HR</div>
        <div class="fb" onclick="insDate()">📅 Date</div>
        <div class="fb" onclick="ins('> ')">❝ Quote</div>
      </div>
      <textarea id="ed-body" placeholder="Write ✍️…" oninput="saveNote()"></textarea>
      <div id="ed-status">
        Words: <span id="sw">0</span> &nbsp; Chars: <span id="sc">0</span>
      </div>
    </div>
  </div>

  <!-- SLIDES -->
  <div id="p-slides" class="panel">
    <div id="slides-wrap">
      <div id="slide-canvas">
        <input id="sl-head" placeholder="Slide heading…" oninput="syncSlide()">
        <textarea id="sl-body" placeholder="• Key points&#10;• Feature notes&#10;• Ideas"></textarea>
        <div id="sl-num">1/1</div>
      </div>
      <div id="slide-thumbs"></div>
    </div>
    <div id="slides-ctrl">
      <button class="sc-btn" onclick="prevSlide()">← Prev</button>
      <div id="sl-counter">1 / 1</div>
      <button class="sc-btn" onclick="nextSlide()">Next →</button>
      <button class="sc-btn" onclick="addSlide()">+ Add</button>
      <button class="sc-btn del" onclick="delSlide()">Del</button>
    </div>
  </div>

  <!-- SHEET -->
  <div id="p-sheet" class="panel">
    <div id="sheet-wrap">
      <table id="sh-table"></table>
    </div>
    <div id="sh-bar">
      <input id="sh-ref" value="A1" readonly>
      <input id="sh-formula" placeholder="value / =A1+B1" oninput="fbarInput()" onkeydown="fbarKey(event)">
    </div>
    <div id="sh-stats">
      Sum: <span id="sum-v">—</span> &nbsp; Avg: <span id="avg-v">—</span>
    </div>
  </div>

  <!-- TOOLS -->
  <div id="p-tools" class="panel">
    <div id="tools-wrap">

      <!-- Word Counter -->
      <div class="tool-card">
        <h3><span class="icon">🔢</span>Word Counter</h3>
        <textarea class="tool-input" id="wc-in" rows="3" placeholder="Paste text here…" oninput="wordCount()" style="width:100%;resize:none;"></textarea>
        <div class="tool-output" id="wc-out">Words: 0 &nbsp; Chars: 0 &nbsp; Lines: 0</div>
      </div>

      <!-- Case Converter -->
      <div class="tool-card">
        <h3><span class="icon">🔡</span>Case Converter</h3>
        <div class="tool-row">
          <input class="tool-input" id="cc-in" placeholder="Enter text…">
        </div>
        <div class="tool-row">
          <button class="tool-btn" onclick="cc('upper')">UPPER</button>
          <button class="tool-btn" onclick="cc('lower')">lower</button>
          <button class="tool-btn" onclick="cc('title')">Title</button>
          <button class="tool-btn" onclick="cc('camel')">camelCase</button>
        </div>
        <div class="tool-output" id="cc-out">—</div>
      </div>

      <!-- JSON Formatter -->
      <div class="tool-card">
        <h3><span class="icon">{ }</span>JSON Format</h3>
        <textarea class="tool-input" id="jf-in" rows="3" placeholder='{"key":"value"}' style="width:100%;resize:none;"></textarea>
        <div class="tool-row">
          <button class="tool-btn" onclick="fmtJSON()">Format</button>
          <button class="tool-btn sec" onclick="minJSON()">Minify</button>
        </div>
        <div class="tool-output" id="jf-out" style="max-height:120px;overflow:auto;">—</div>
      </div>

      <!-- Timestamp -->
      <div class="tool-card">
        <h3><span class="icon">⏱</span>Timestamp</h3>
        <div class="tool-row">
          <button class="tool-btn" onclick="nowTs()">Now</button>
          <input class="tool-input" id="ts-in" placeholder="Unix timestamp…" type="number">
          <button class="tool-btn sec" onclick="tsConvert()">→ Date</button>
        </div>
        <div class="tool-output" id="ts-out">—</div>
      </div>

      <!-- Color Picker -->
      <div class="tool-card">
        <h3><span class="icon">🎨</span>Color Tools</h3>
        <div class="tool-row" style="align-items:center;">
          <input type="color" id="cp-pick" value="#f0a500" oninput="colorInfo()" style="width:44px;height:36px;border:none;border-radius:8px;cursor:pointer;background:none;">
          <div class="tool-output" id="cp-out" style="flex:1;">—</div>
        </div>
      </div>

      <!-- Base64 -->
      <div class="tool-card">
        <h3><span class="icon">🔐</span>Base64</h3>
        <div class="tool-row">
          <input class="tool-input" id="b64-in" placeholder="Text to encode…">
        </div>
        <div class="tool-row">
          <button class="tool-btn" onclick="b64Enc()">Encode</button>
          <button class="tool-btn sec" onclick="b64Dec()">Decode</button>
        </div>
        <div class="tool-output" id="b64-out">—</div>
      </div>

      <!-- Calc -->
      <div class="tool-card">
        <h3><span class="icon">🧮</span>Quick Calc</h3>
        <div class="tool-row">
          <input class="tool-input" id="calc-in" placeholder="e.g. 12 * 8 + 5%" onkeydown="if(event.key==='Enter')doCalc()">
          <button class="tool-btn" onclick="doCalc()">=</button>
        </div>
        <div class="tool-output" id="calc-out">—</div>
      </div>

    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="nav">
    <button class="nav-btn active" onclick="go('notes',this)" id="nb-notes">
      <div class="ni">📝</div>Notes
    </button>
    <button class="nav-btn" onclick="go('slides',this)" id="nb-slides">
      <div class="ni">🎞</div>Slides
    </button>
    <button class="nav-btn" onclick="go('sheet',this)" id="nb-sheet">
      <div class="ni">📊</div>Sheet
    </button>
    <button class="nav-btn" onclick="go('tools',this)" id="nb-tools">
      <div class="ni">🔧</div>Tools
    </button>
  </div>

</div>

<script>
// ── STORAGE ──
const KEY = 'dvp2';
let D = { notes:[], slides:[{h:'',b:''}], si:0, sheet:{} };
function ld() { try { const r=localStorage.getItem(KEY); if(r) D={...D,...JSON.parse(r)}; } catch(e){} }
function sv() { localStorage.setItem(KEY,JSON.stringify(D)); }
ld();

// ── NAV ──
let curTab = 'notes';
function go(tab, btn) {
  curTab = tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+tab).classList.add('on');
  btn.classList.add('active');
  const titles={notes:'Notes',slides:'Slides',sheet:'Sheet',tools:'Tools'};
  document.getElementById('page-title').textContent = titles[tab];
  document.getElementById('new-btn').classList.toggle('hidden', tab!=='notes' && tab!=='slides');
  if(tab==='slides') renderSlides();
  if(tab==='sheet') buildSheet();
  closeEditor();
}

function handleNew() {
  if(curTab==='notes') newNote();
  else if(curTab==='slides') addSlide();
}

// ── NOTES ──
let curNoteId = null;
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

function newNote(){
  const n={id:uid(),title:'',body:'',tag:'note',ts:Date.now()};
  D.notes.unshift(n); sv(); renderNotes(); openNote(n.id);
}

function renderNotes(){
  const el=document.getElementById('notes-list');
  if(!D.notes.length){
    el.innerHTML=`<div class="empty-state"><div class="es-icon">📝</div><p>No notes yet.<br>Tap + to create your first note.</p></div>`;
    return;
  }
  el.innerHTML=D.notes.map(n=>`
    <div class="note-card" onclick="openNote('${n.id}')">
      <div class="nc-title">${n.title||'Untitled'}</div>
      <div class="nc-preview">${n.body||'No content'}</div>
      <div class="nc-foot">
        <div class="nc-date">${fmt(n.ts)}</div>
        <div class="tag tag-${n.tag}">${n.tag}</div>
      </div>
    </div>
  `).join('');
}

function fmt(ts){ const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }

function openNote(id){
  curNoteId=id;
  const n=D.notes.find(x=>x.id===id); if(!n) return;
  document.getElementById('notes-list-wrap').style.display='none';
  document.getElementById('note-editor').classList.add('on');
  document.getElementById('new-btn').classList.add('hidden');
  document.getElementById('ed-title').value=n.title;
  document.getElementById('ed-body').value=n.body;
  document.getElementById('ed-tag').value=n.tag||'note';
  updStats();
}

function closeEditor(){
  document.getElementById('notes-list-wrap').style.display='';
  document.getElementById('note-editor').classList.remove('on');
  if(curTab==='notes') document.getElementById('new-btn').classList.remove('hidden');
  curNoteId=null; renderNotes();
}

function saveNote(){
  if(!curNoteId) return;
  const n=D.notes.find(x=>x.id===curNoteId); if(!n) return;
  n.title=document.getElementById('ed-title').value||'Untitled';
  n.body=document.getElementById('ed-body').value;
  n.tag=document.getElementById('ed-tag').value;
  n.ts=Date.now(); sv(); updStats();
}

function deleteNote(){
  if(!confirm('Delete this note?')) return;
  D.notes=D.notes.filter(x=>x.id!==curNoteId); sv(); closeEditor();
}

function updStats(){
  const b=document.getElementById('ed-body').value;
  document.getElementById('sw').textContent=b.trim()?b.trim().split(/\s+/).length:0;
  document.getElementById('sc').textContent=b.length;
}

function ins(t){
  const ta=document.getElementById('ed-body');
  const s=ta.selectionStart;
  ta.value=ta.value.slice(0,s)+t+ta.value.slice(ta.selectionEnd);
  ta.selectionStart=ta.selectionEnd=s+t.length;
  ta.focus(); saveNote();
}
function insDate(){ ins('\n📅 '+new Date().toLocaleDateString('en-IN',{year:'numeric',month:'long',day:'numeric'})+'\n'); }

// ── SLIDES ──
function renderSlides(){
  const slides=D.slides; const i=D.si;
  // canvas
  document.getElementById('sl-head').value=slides[i]?.h||'';
  document.getElementById('sl-body').value=slides[i]?.b||'';
  document.getElementById('sl-num').textContent=(i+1)+'/'+slides.length;
  document.getElementById('sl-counter').textContent=(i+1)+' / '+slides.length;
  // thumbs
  const tw=document.getElementById('slide-thumbs');
  tw.innerHTML=slides.map((s,idx)=>`
    <div class="sthumb ${idx===i?'active':''}" onclick="goSlide(${idx})">
      <div class="stn">${idx+1}</div>
      <p>${(s.h||'Slide '+(idx+1)).slice(0,20)}</p>
    </div>
  `).join('');
  // auto-scroll thumb
  const active=tw.querySelectorAll('.sthumb')[i];
  if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function syncSlide(){
  D.slides[D.si]={h:document.getElementById('sl-head').value,b:document.getElementById('sl-body').value};
  sv(); renderSlides();
}
document.getElementById('sl-body').addEventListener('input',syncSlide);

function goSlide(i){ syncSlide(); D.si=i; renderSlides(); }
function prevSlide(){ if(D.si>0){syncSlide();D.si--;renderSlides();} }
function nextSlide(){ if(D.si<D.slides.length-1){syncSlide();D.si++;renderSlides();} }
function addSlide(){ syncSlide(); D.slides.splice(D.si+1,0,{h:'',b:''}); D.si++; sv(); renderSlides(); }
function delSlide(){
  if(D.slides.length<=1) return;
  D.slides.splice(D.si,1);
  if(D.si>=D.slides.length) D.si--;
  sv(); renderSlides();
}

// ── SHEET ──
const ROWS=30, COLS=10;
let cellFocus=null;
function colL(i){ let s=''; i++; while(i>0){s=String.fromCharCode(64+(i%26||26))+s;i=Math.floor((i-1)/26);} return s; }
function ck(r,c){ return colL(c)+(r+1); }

function buildSheet(){
  const t=document.getElementById('sh-table');
  t.innerHTML='';
  // header
  const hr=document.createElement('tr');
  const co=document.createElement('th'); co.className='sh-corner'; hr.appendChild(co);
  for(let c=0;c<COLS;c++){
    const th=document.createElement('th'); th.className='sh-col'; th.textContent=colL(c); hr.appendChild(th);
  }
  t.appendChild(hr);
  // rows
  for(let r=0;r<ROWS;r++){
    const tr=document.createElement('tr');
    const rh=document.createElement('td'); rh.className='sh-row'; rh.textContent=r+1; tr.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const td=document.createElement('td'); td.className='sh-cell';
      const inp=document.createElement('input');
      inp.value=D.sheet[ck(r,c)]||'';
      if(inp.value.startsWith('=')) td.classList.add('formula');
      inp.addEventListener('focus',()=>{
        if(cellFocus) cellFocus.closest('.sh-cell').classList.remove('focus');
        cellFocus=inp; td.classList.add('focus');
        document.getElementById('sh-ref').value=ck(r,c);
        document.getElementById('sh-formula').value=inp.value;
        updSheetStats();
      });
      inp.addEventListener('input',()=>{
        const k=ck(r,c);
        if(inp.value) D.sheet[k]=inp.value; else delete D.sheet[k];
        td.classList.toggle('formula',inp.value.startsWith('='));
        document.getElementById('sh-formula').value=inp.value;
        sv(); updSheetStats();
      });
      inp.addEventListener('keydown',e=>{
        const nav={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Enter:[1,0],Tab:[0,1]};
        if(nav[e.key]){
          e.preventDefault();
          const [dr,dc]=nav[e.key];
          const nr=Math.max(0,Math.min(ROWS-1,r+dr)), nc=Math.max(0,Math.min(COLS-1,c+dc));
          const next=document.querySelector(`.sh-cell[data-r="${nr}"][data-c="${nc}"] input`);
          if(next) next.focus();
        }
      });
      td.dataset.r=r; td.dataset.c=c; inp.dataset.r=r; inp.dataset.c=c;
      td.appendChild(inp); tr.appendChild(td);
    }
    t.appendChild(tr);
  }
}

function fbarInput(){
  if(!cellFocus) return;
  cellFocus.value=document.getElementById('sh-formula').value;
  const r=+cellFocus.dataset.r, c=+cellFocus.dataset.c;
  const k=ck(r,c);
  if(cellFocus.value) D.sheet[k]=cellFocus.value; else delete D.sheet[k];
  cellFocus.closest('.sh-cell').classList.toggle('formula',cellFocus.value.startsWith('='));
  sv(); updSheetStats();
}
function fbarKey(e){ if(e.key==='Enter'&&cellFocus) cellFocus.focus(); }

function updSheetStats(){
  const vals=Object.values(D.sheet).map(v=>parseFloat(v)).filter(x=>!isNaN(x));
  if(!vals.length){ document.getElementById('sum-v').textContent='—'; document.getElementById('avg-v').textContent='—'; return; }
  const s=vals.reduce((a,b)=>a+b,0);
  document.getElementById('sum-v').textContent=s.toLocaleString('en-IN');
  document.getElementById('avg-v').textContent=(s/vals.length).toFixed(2);
}

// ── TOOLS ──
function wordCount(){
  const t=document.getElementById('wc-in').value;
  const w=t.trim()?t.trim().split(/\s+/).length:0;
  document.getElementById('wc-out').textContent=`Words: ${w}   Chars: ${t.length}   Lines: ${t.split('\n').length}`;
}

function cc(type){
  let t=document.getElementById('cc-in').value;
  if(type==='upper') t=t.toUpperCase();
  else if(type==='lower') t=t.toLowerCase();
  else if(type==='title') t=t.replace(/\w\S*/g,s=>s[0].toUpperCase()+s.slice(1).toLowerCase());
  else if(type==='camel') t=t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase());
  document.getElementById('cc-out').textContent=t||'—';
}

function fmtJSON(){
  try { document.getElementById('jf-out').textContent=JSON.stringify(JSON.parse(document.getElementById('jf-in').value),null,2); }
  catch(e){ document.getElementById('jf-out').textContent='❌ Invalid JSON'; }
}
function minJSON(){
  try { document.getElementById('jf-out').textContent=JSON.stringify(JSON.parse(document.getElementById('jf-in').value)); }
  catch(e){ document.getElementById('jf-out').textContent='❌ Invalid JSON'; }
}

function nowTs(){
  const n=Date.now();
  document.getElementById('ts-in').value=Math.floor(n/1000);
  document.getElementById('ts-out').textContent=new Date(n).toLocaleString('en-IN');
}
function tsConvert(){
  const v=document.getElementById('ts-in').value;
  if(!v) return;
  const ms=v.length===10?+v*1000:+v;
  document.getElementById('ts-out').textContent=new Date(ms).toLocaleString('en-IN');
}

function colorInfo(){
  const h=document.getElementById('cp-pick').value;
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  document.getElementById('cp-out').textContent=`HEX: ${h.toUpperCase()}\nRGB: rgb(${r}, ${g}, ${b})`;
}
colorInfo();

function b64Enc(){ try{document.getElementById('b64-out').textContent=btoa(unescape(encodeURIComponent(document.getElementById('b64-in').value)));}catch(e){document.getElementById('b64-out').textContent='Error';} }
function b64Dec(){ try{document.getElementById('b64-out').textContent=decodeURIComponent(escape(atob(document.getElementById('b64-in').value)));}catch(e){document.getElementById('b64-out').textContent='Invalid base64';} }

function doCalc(){
  try{
    let expr=document.getElementById('calc-in').value.replace(/(\d+(\.\d+)?)%/g,'($1/100)');
    const r=Function('"use strict";return('+expr+')')();
    document.getElementById('calc-out').textContent='= '+r.toLocaleString('en-IN');
  } catch(e){ document.getElementById('calc-out').textContent='❌ Invalid expression'; }
}

// ── INIT ──
renderNotes();
renderSlides();
buildSheet();
</script>
</body>
