<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }

        /* Dark Theme */
        body.dark {
            background: linear-gradient(135deg, #0A0F2C 0%, #0E2A47 50%, #083D3D 100%);
            color: #E2E8F0;
        }

        /* Light Theme */
        body.light {
            background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 50%, #CBD5E1 100%);
            color: #1E293B;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #22D3EE, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-toggle {
            background: rgba(34, 211, 238, 0.2);
            border: 2px solid #22D3EE;
            border-radius: 25px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #22D3EE;
        }

        .theme-toggle:hover {
            background: rgba(34, 211, 238, 0.3);
            transform: scale(1.05);
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .task-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .dark .task-input {
            background: rgba(14, 42, 71, 0.8);
            color: #E2E8F0;
            border-color: rgba(34, 211, 238, 0.3);
        }

        .light .task-input {
            background: rgba(255, 255, 255, 0.9);
            color: #1E293B;
            border-color: rgba(6, 182, 212, 0.3);
        }

        .task-input:focus {
            border-color: #22D3EE;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }

        .add-btn {
            padding: 15px 25px;
            background: linear-gradient(45deg, #22D3EE, #06B6D4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.4);
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        .dark .task-item {
            background: rgba(14, 42, 71, 0.6);
            border-color: rgba(34, 211, 238, 0.2);
        }

        .light .task-item {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(6, 182, 212, 0.2);
        }

        .task-item:hover {
            border-color: #22D3EE;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 211, 238, 0.2);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #22D3EE;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .task-checkbox.checked {
            background: #22D3EE;
            animation: checkGlow 0.5s ease;
        }

        @keyframes checkGlow {
            0% { box-shadow: 0 0 0 rgba(34, 211, 238, 0.5); }
            50% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.8); }
            100% { box-shadow: 0 0 0 rgba(34, 211, 238, 0.5); }
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .task-text {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #EF4444;
            border-radius: 8px;
            padding: 8px 12px;
            color: #EF4444;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state .message {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .empty-state .submessage {
            font-size: 1rem;
            opacity: 0.8;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="dark">
    <div class="container">
        <div class="header">
            <h1 class="title">To-Do List</h1>
            
        </div>

        <div class="input-container">
            <input type="text" class="task-input" id="taskInput" placeholder="Write your task here..." maxlength="100">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <div class="tasks-container" id="tasksContainer">
            <div class="empty-state">
                <div class="icon">📝</div>
                <div class="message">No tasks yet</div>
                <div class="submessage">Add a task above to get started</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
    // 1. Sync theme preference from your homepage
    const savedTheme = localStorage.getItem('perfectTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const applyForceTheme = (theme) => {
        const isDark = theme === 'dark';
        let style = document.getElementById("force-todo-theme");
        if (!style) {
            style = document.createElement('style');
            style.id = "force-todo-theme";
            document.head.appendChild(style);
        }

        if (isDark) {
            style.innerHTML = `
                body { background: #010d08 !important; color: #ecfdf5 !important; }
                .title { background: linear-gradient(45deg, #10b981, #059669) !important; -webkit-background-clip: text !important; }
                .task-input, .task-item { 
                    background: rgb(6, 78, 59) !important; 
                    border-color: rgba(16, 185, 129, 0.3) !important; 
                    color: #ecfdf5 !important; 
                }
                .add-btn { background: linear-gradient(45deg, #10b981, #059669) !important; }
                .task-checkbox { border-color: #10b981 !important; }
                .task-checkbox.checked { background: #10b981 !important; }
                .theme-toggle { border-color: #10b981 !important; color: #10b981 !important; background: rgba(16,185,129,0.1) !important; }
            `;
        } else {
            style.innerHTML = `
                body { background: #f0fdf4 !important; color: #000000 !important; }
                .title { background: none !important; color: #000000 !important; -webkit-text-fill-color: #000000 !important; }
                .task-input, .task-item { 
                    background: #ffffff !important; 
                    border-color: #059669 !important; 
                    color: #000000 !important; 
                }
                .task-text, .message, .submessage { color: #000000 !important; }
                .add-btn { background: #059669 !important; color: #ffffff !important; }
                .task-checkbox { border-color: #059669 !important; }
                .task-checkbox.checked { background: #059669 !important; }
                .theme-toggle { border-color: #000000 !important; color: #000000 !important; }
            `;
        }
    };

    // Apply immediately and listen for changes
    applyForceTheme(savedTheme);
})();

        let tasks = JSON.parse(localStorage.getItem('simpleTasks')) || [];
        let taskIdCounter = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;

        
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (text === '') return;
            
            const task = {
                id: taskIdCounter++,
                text: text,
                completed: false
            };
            
            tasks.unshift(task);
            input.value = '';
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <div class="message">No tasks yet</div>
                        <div class="submessage">Add a task above to get started</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                    <div class="task-text ${task.completed ? 'completed' : ''}">${task.text}</div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            `).join('');
        }

        function saveTasks() {
            localStorage.setItem('simpleTasks', JSON.stringify(tasks));
        }

        // Add task on Enter key
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            toggleTheme();
        }

        // Initialize
        renderTasks();
    </script>
</body>
</html>
