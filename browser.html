    <script>
        // Load data from main.json
       async function loadMainJSON() {
    try {
        const response = await fetch('main.json');
        const data = await response.json();
        
        // Load news instead of tools/shortcuts
        loadNews(data.news || []);
        
        updateTabCount();
    } catch (error) {
        console.error('Error loading main.json:', error);
        document.getElementById('news-container').innerHTML = '<div class="loading">Failed to load news</div>';
    }
}

        function loadShortcuts(shortcuts) {
            const container = document.getElementById('shortcuts-container');
            container.innerHTML = '';

            shortcuts.forEach(shortcut => {
                const link = document.createElement('a');
                link.href = shortcut.link;
                link.target = '_blank';
                link.className = 'shortcut-item';
                link.onclick = () => addTab(shortcut.title, shortcut.link);
                
                link.innerHTML = `
                    <div class="shortcut-icon">${shortcut.icon || '📌'}</div>
                    <span class="shortcut-label">${shortcut.title}</span>
                `;
                
                container.appendChild(link);
            });
        }

       function loadNews(news) {
    const container = document.getElementById('news-container');
    container.innerHTML = '';

    news.forEach(item => {
        const card = document.createElement('a');
        card.href = item.link;
        card.target = '_blank';
        card.className = 'news-card';
        card.onclick = () => addTab(item.title, item.link);
        
        card.innerHTML = `
            <img src="${item.image}" class="news-thumb" alt="${item.title}" loading="lazy">
            <div class="news-content">
                <div class="news-title">${item.title}</div>
                <div class="news-desc">${item.description}</div>
            </div>
        `;
        
        container.appendChild(card);
    });
}

        function addTab(title, url) {
            let tabs = JSON.parse(localStorage.getItem('nexusTabs')) || [];
            
            // Check if tab already exists
            if (!tabs.find(t => t.url === url)) {
                tabs.push({
                    id: Date.now(),
                    title: title,
                    url: url,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('nexusTabs', JSON.stringify(tabs));
            }
            
            updateTabCount();
        }

        function updateTabCount() {
            const tabs = JSON.parse(localStorage.getItem('nexusTabs')) || [];
            document.getElementById('tab-count-box').textContent = tabs.length;
        }

        // Tab count box click - navigate to tabs.html
        document.getElementById('tab-count-box').addEventListener('click', () => {
            window.location.href = 'tabs.html';
        });

        // Load search engine
        document.addEventListener('DOMContentLoaded', () => {
            loadMainJSON();

            window.searchEngine = new SearchEngine({
                inputSelector: '#search-input',
                suggestionsSelector: '#search-suggestions',
                resultsSelector: '#search-results'
            });

            const originalSelect = window.searchEngine.selectSuggestion.bind(window.searchEngine);
            window.searchEngine.selectSuggestion = function(text) {
                sessionStorage.setItem('searchQuery', text);
                window.location.href = 'load.html';
            };

            const input = document.getElementById('search-input');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && window.searchEngine.currentSuggestionIndex === -1) {
                    const query = input.value.trim();
                    if (query) {
                        sessionStorage.setItem('searchQuery', query);
                        window.location.href = 'load.html';
                    }
                }
            });
        });

        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('search-input').value = transcript;
                window.searchEngine.selectSuggestion(transcript);
            };
            recognition.start();
        }

<script>
// ANXRO VOICE V2 - FIXED STT
let anxroRec = null;
let anxroFinalText = '';
let anxroIsListening = false;

function anxroGetRecognition() {
    // Better compatibility check for APK WebView
    return window.SpeechRecognition ||
           window.webkitSpeechRecognition ||
           window.mozSpeechRecognition ||
           window.msSpeechRecognition;
}

async function startVoice() {
    const popup = document.getElementById('anxroVPopup');
    const textEl = document.getElementById('anxroVText');
    const statusEl = document.getElementById('anxroVStatus');
    const waves = document.getElementById('anxroVWaves');

    // 1. Open UI first
    popup.classList.add('active');
    document.body.style.overflow = 'hidden';
    textEl.innerHTML = '';
    statusEl.textContent = 'Initializing...';
    anxroFinalText = '';

    // 2. Check STT support
    const SR = anxroGetRecognition();
    if (!SR) {
        statusEl.textContent = 'Voice not supported on this device';
        textEl.innerHTML = 'Update Android System WebView or use Chrome';
        return;
    }

    try {
        // 3. Get mic - this triggers Android permission popup in APK
        statusEl.textContent = 'Waiting for microphone...';
        await navigator.mediaDevices.getUserMedia({ audio: true });

        // 4. Setup recognition
        anxroRec = new SR();
        anxroRec.continuous = true; // Keep listening until pause
        anxroRec.interimResults = true;
        anxroRec.lang = 'en-US';
        anxroRec.maxAlternatives = 1;

        anxroRec.onstart = () => {
            anxroIsListening = true;
            waves.classList.add('active');
            statusEl.textContent = 'Listening...';
            textEl.innerHTML = '';
        };

        anxroRec.onresult = (event) => {
            let interim = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    anxroFinalText += transcript + ' ';
                } else {
                    interim += transcript;
                }
            }

            // Update UI with live text
            textEl.innerHTML = anxroFinalText + '<span class="interim">' + interim + '</span>';

            // Auto-submit after 1.2s of silence
            if (anxroFinalText.trim()) {
                clearTimeout(window.anxroSubmitTimer);
                window.anxroSubmitTimer = setTimeout(() => {
                    anxroSubmitVoice();
                }, 1200);
            }
        };

        anxroRec.onerror = (event) => {
            waves.classList.remove('active');
            anxroIsListening = false;

            if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                statusEl.textContent = 'Microphone blocked';
                textEl.innerHTML = 'Enable in Settings > Apps > Anxro > Permissions > Microphone';
            } else if (event.error === 'no-speech') {
                statusEl.textContent = 'Didn\'t hear anything';
                textEl.innerHTML = 'Tap mic to try again';
            } else if (event.error === 'network') {
                statusEl.textContent = 'Network error';
                textEl.innerHTML = 'Check internet connection';
            } else {
                statusEl.textContent = 'Error occurred';
                textEl.innerHTML = 'Tap mic to retry';
            }
        };

        anxroRec.onend = () => {
            waves.classList.remove('active');
            anxroIsListening = false;
            if (!anxroFinalText.trim()) {
                statusEl.textContent = 'Tap mic to start';
            }
        };

        // 5. Start
        anxroRec.start();

    } catch (err) {
        waves.classList.remove('active');
        if (err.name === 'NotAllowedError') {
            statusEl.textContent = 'Permission denied';
            textEl.innerHTML = 'Enable microphone in Settings > Apps > Anxro > Permissions';
        } else if (err.name === 'NotFoundError') {
            statusEl.textContent = 'No microphone';
            textEl.innerHTML = 'No microphone detected on device';
        } else {
            statusEl.textContent = 'Cannot access microphone';
            textEl.innerHTML = err.message;
        }
    }
}

function anxroSubmitVoice() {
    if (anxroFinalText.trim()) {
        sessionStorage.setItem('searchQuery', anxroFinalText.trim());
        anxroCloseVoice();
        window.location.href = 'load.html';
    }
}

function anxroCloseVoice() {
    const popup = document.getElementById('anxroVPopup');
    const waves = document.getElementById('anxroVWaves');

    if (anxroRec) {
        anxroRec.stop();
        anxroRec = null;
    }

    clearTimeout(window.anxroSubmitTimer);
    popup.classList.remove('active');
    document.body.style.overflow = '';
    waves.classList.remove('active');
    anxroIsListening = false;
    anxroFinalText = '';
}

// Mic button tap to restart
document.getElementById('anxroVMicBtn').onclick = () => {
    if (anxroIsListening && anxroRec) {
        anxroRec.stop();
    } else if (anxroRec) {
        anxroFinalText = '';
        document.getElementById('anxroVText').innerHTML = '';
        anxroRec.start();
    } else {
        startVoice();
    }
};

// ESC or back button to close
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') anxroCloseVoice();
});

<script>
// SIMPLE VOICE - YOUR WORKING CODE IN POPUP
let simpleVoiceActive = false;
let simpleRecognition = null;

async function startVoice() {
    const popup = document.getElementById('simpleVoicePopup');
    const micBtn = document.getElementById('simpleMicBtn');
    const statusEl = document.getElementById('simpleVoiceStatus');
    const searchInput = document.getElementById('search-input');

    // Open popup
    popup.classList.add('active');
    document.body.style.overflow = 'hidden';
    statusEl.textContent = 'Starting...';

    try {
        // 1. Ask for mic permission - works in web + APK if RECORD_AUDIO is in manifest
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());

        // 2. Start voice recognition - YOUR WORKING CODE
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusEl.textContent = 'Voice not supported. Update WebView';
            return;
        }

        simpleRecognition = new SpeechRecognition();
        simpleRecognition.lang = 'en-US';
        simpleRecognition.continuous = false;

        simpleRecognition.onstart = () => {
            simpleVoiceActive = true;
            micBtn.classList.add('listening');
            statusEl.textContent = 'Listening...';
        };

        simpleRecognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            searchInput.value = text;
            statusEl.textContent = 'Got it!';
            setTimeout(() => {
                sessionStorage.setItem('searchQuery', text);
                closeSimpleVoice();
                window.location.href = 'load.html';
            }, 600);
        };

        simpleRecognition.onerror = (e) => {
            micBtn.classList.remove('listening');
            simpleVoiceActive = false;
            if (e.error === 'not-allowed') {
                statusEl.textContent = 'Mic blocked';
            } else if (e.error === 'no-speech') {
                statusEl.textContent = 'Did not hear anything';
            } else {
                statusEl.textContent = 'Error. Tap mic to retry';
            }
        };

        simpleRecognition.onend = () => {
            simpleVoiceActive = false;
            micBtn.classList.remove('listening');
            if (statusEl.textContent === 'Listening...') {
                statusEl.textContent = 'Tap mic to speak';
            }
        };

        simpleRecognition.start();

    } catch (err) {
        micBtn.classList.remove('listening');
        if (err.name === 'NotAllowedError') {
            statusEl.textContent = 'Mic permission denied';
        } else {
            statusEl.textContent = 'No microphone found';
        }
    }
}

function closeSimpleVoice() {
    const popup = document.getElementById('simpleVoicePopup');
    const micBtn = document.getElementById('simpleMicBtn');
    const statusEl = document.getElementById('simpleVoiceStatus');

    if (simpleRecognition) {
        simpleRecognition.stop();
        simpleRecognition = null;
    }

    popup.classList.remove('active');
    document.body.style.overflow = '';
    micBtn.classList.remove('listening');
    simpleVoiceActive = false;
    statusEl.textContent = 'Tap mic to speak';
}

// Mic button in popup to restart
document.getElementById('simpleMicBtn').onclick = () => {
    if (simpleVoiceActive && simpleRecognition) {
        simpleRecognition.stop();
    } else {
        if (simpleRecognition) simpleRecognition = null;
        startVoice();
    }
};

// Auto-ask permission on APK first launch - YOUR CODE
document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('anxro_mic_asked') === 'true') return;
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
            stream.getTracks().forEach(track => track.stop());
            localStorage.setItem('anxro_mic_asked', 'true');
        })
      .catch(() => {
            localStorage.setItem('anxro_mic_asked', 'true');
        });
});
</script>
</body>
