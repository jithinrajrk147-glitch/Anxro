<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Tools | Anxro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #010d08;
  --surface: #064e3b;
  --surface-bright: #059669;
  --surface-card: #0a1f14;
  --accent: #10b981;
  --accent-glow: rgba(16,185,129,0.22);
  --text: #ecfdf5;
  --text-dim: #6ee7b7;
  --text-muted: #34795a;
  --border: rgba(16,185,129,0.14);
  --nav-height: 56px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 16px;
}
[data-theme="light"] {
  --bg: #f0fdf4;
  --surface: #10b981;
  --surface-bright: #059669;
  --surface-card: #ffffff;
  --accent: #064e3b;
  --accent-glow: rgba(6,78,59,0.12);
  --text: #0a1f14;
  --text-dim: #065f46;
  --text-muted: #6ee7b7;
  --border: rgba(6,78,59,0.12);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  padding-bottom: 24px;
}

body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(16,185,129,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ── TOP BAR ── */
.top-bar {
  height: var(--nav-height);
  display: flex; align-items: center;
  padding: 0 16px;
  background: rgba(1,13,8,0.88);
  backdrop-filter: blur(16px);
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
[data-theme="light"].top-bar { background: rgba(240,253,244,0.9); }

.back-btn {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: rgba(16,185,129,0.08);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; color: var(--accent);
  flex-shrink: 0;
  transition: all 0.15s ease;
  text-decoration: none;
}
.back-btn:active { background: rgba(16,185,129,0.18); transform: scale(0.96); }

.top-title {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800;
  flex: 1; text-align: center;
  letter-spacing: -0.4px;
}

.slot-badge {
  font-size: 11px; font-weight: 700;
  background: rgba(16,185,129,0.1);
  color: var(--accent);
  border: 1px solid rgba(16,185,129,0.2);
  padding: 5px 11px; border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.slot-badge.saved {
  background: rgba(16,185,129,0.2);
  transform: scale(1.05);
}

/* ── PINNED PREVIEW BAR ── */
.pinned-bar {
  background: var(--surface-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 14px;
  position: sticky; top: var(--nav-height); z-index: 99;
}

.pinned-label {
  font-size: 10px; font-weight: 700;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.9px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.autosave-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  opacity: 0; transition: opacity 0.3s ease;
}
.autosave-dot.show { opacity: 1; }

.pinned-slots,.pinned-slots-2 {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}
.pinned-slots-2 { margin-top: 8px; }

.pinned-slot {
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  background: rgba(16,185,129,0.04);
  border: 1.5px dashed rgba(16,185,129,0.18);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
}
.pinned-slot::after {
  content: '+';
  font-size: 14px; color: var(--text-muted); opacity: 0.4;
}

.pinned-slot.filled {
  border-style: solid;
  border-color: rgba(16,185,129,0.3);
  background: rgba(16,185,129,0.08);
  cursor: pointer;
}
.pinned-slot.filled::after { display: none; }
.pinned-slot.filled:active { transform: scale(0.94); }

.pinned-slot img {
  width: 60%; height: 60%; object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}

.pinned-slot.remove-x {
  position: absolute; top: 3px; right: 4px;
  font-size: 10px; color: var(--accent); opacity: 0;
  line-height: 1; transition: opacity 0.15s ease;
}
.pinned-slot.filled:hover.remove-x,
.pinned-slot.filled:active.remove-x { opacity: 0.8; }

/* ── SEARCH ── */
.search-wrap {
  padding: 16px 16px 8px;
  position: relative; z-index: 1;
}
.search-input {
  width: 100%;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px 12px 42px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease;
}
.search-input:focus {
  border-color: rgba(16,185,129,0.4);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-icon {
  position: absolute; left: 30px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px; opacity: 0.35; pointer-events: none;
}

/* ── FILTER TABS ── */
.filter-row {
  display: flex; gap: 8px;
  padding: 0 16px 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  position: relative; z-index: 1;
}
.filter-row::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 7px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: rgba(16,185,129,0.06);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.filter-chip.active {
  background: var(--accent);
  color: #010d08;
  border-color: var(--accent);
}
.filter-chip:active { transform: scale(0.96); }

/* ── TOOLS LIST ── */
.tools-section-title {
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 800;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  padding: 8px 18px 10px;
  position: relative; z-index: 1;
}

.tools-all-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 0 16px 16px;
  position: relative; z-index: 1;
}

.tool-pick-item {
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 8px 12px;
  cursor: pointer;
  background: var(--surface-card);
  border: 1.5px solid var(--border);
  transition: all 0.18s cubic-bezier(0.2,0.8,0.2,1);
  position: relative;
  overflow: hidden;
  min-height: 88px;
}

.tool-pick-item::before {
  content: '';
  position: absolute; inset: 0; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(16,185,129,0.06) 0%, transparent 70%);
  pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
}
.tool-pick-item:hover::before { opacity: 1; }

.tool-pick-item.pinned {
  border-color: var(--accent);
  background: rgba(16,185,129,0.09);
  box-shadow: 0 4px 16px -4px var(--accent-glow);
}

.tool-pick-item:active { transform: scale(0.94); }

.tool-pick-item img {
  width: 36px; height: 36px;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  flex-shrink: 0;
}

.tool-pick-name {
  font-size: 10px; font-weight: 600;
  text-align: center; color: var(--text);
  opacity: 0.85; width: 100%;
  padding: 0 2px;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: 0.1px;
  min-height: 24px;
}

.pin-check {
  position: absolute;
  top: 6px; right: 7px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #010d08;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.tool-pick-item.pinned.pin-check { display: flex; }

/* Toast */
.full-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1a2e1a;
  border: 1px solid rgba(16,185,129,0.3);
  color: var(--text-dim);
  font-size: 13px; font-weight: 600;
  padding: 12px 22px; border-radius: var(--radius-md);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: all 0.25s cubic-bezier(0.2,0.8,0.2,1);
  white-space: nowrap;
}
.full-toast.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}

.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text-muted);
  font-size: 13px; font-weight: 500;
  display: none;
}
.empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<nav class="top-bar">
  <a class="back-btn" href="home.html" onclick="history.back(); return false;">←</a>
  <span class="top-title">Add Tools</span>
  <div class="slot-badge" id="slotBadge">0 / 14</div>
</nav>

<!-- ── PINNED PREVIEW ── -->
<div class="pinned-bar">
  <div class="pinned-label">
    Pinned to Home <span class="autosave-dot" id="saveDot"></span>
  </div>
  <div class="pinned-slots" id="pinnedRow1"></div>
  <div class="pinned-slots-2" id="pinnedRow2"></div>
</div>

<!-- ── SEARCH ── -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="searchInput" type="text" placeholder="Search tools…" oninput="filterTools()">
</div>

<!-- ── FILTER TABS ── -->
<div class="filter-row" id="filterRow">
  <div class="filter-chip active" data-cat="all" onclick="setCategory('all', this)">All</div>
</div>

<!-- ── ALL TOOLS GRID ── -->
<div class="tools-section-title">All Tools — tap to pin / unpin</div>
<div class="tools-all-grid" id="allToolsGrid"></div>
<div class="empty-state" id="emptyState">
  <div class="empty-state-icon">🔍</div>
  No tools match your search
</div>

<!-- ── TOAST ── -->
<div class="full-toast" id="fullToast">14 slots full — remove a tool first</div>

<script>
const MAX_PINS = 14;
let allTools = [];
let pinned = JSON.parse(localStorage.getItem('pinnedTools') || '[]');
let activeCategory = 'all';
let searchQuery = '';
let saveTimeout;

// ── AUTOSAVE ──
function autoSave() {
  clearTimeout(saveTimeout);
  const dot = document.getElementById('saveDot');
  const badge = document.getElementById('slotBadge');

  saveTimeout = setTimeout(() => {
    localStorage.setItem('pinnedTools', JSON.stringify(pinned));
    dot.classList.add('show');
    badge.classList.add('saved');
    setTimeout(() => {
      dot.classList.remove('show');
      badge.classList.remove('saved');
    }, 800);
  }, 300);
}

// ── INIT ──
async function init() {
  try {
    allTools = await fetch('tools.json').then(r => r.json());
  } catch(e) {
    // Demo fallback
    allTools = [
      {name: "Calendar", image: "https://img.icons8.com/fluency/96/calendar.png", category: "Productivity"},
      {name: "Calculator", image: "https://img.icons8.com/fluency/96/calculator.png", category: "Utility"},
      {name: "Notes", image: "https://img.icons8.com/fluency/96/note.png", category: "Productivity"},
      {name: "QR Generator", image: "https://img.icons8.com/fluency/96/qr-code.png", category: "Utility"}
    ];
    console.warn('tools.json not found, using demo tools.');
  }
  buildCategoryTabs();
  renderPinnedBar();
  renderAllTools();
}

// ── CATEGORY TABS ──
function buildCategoryTabs() {
  const cats = ['All',...new Set(allTools.map(t => t.category || 'General').filter(Boolean))];
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  cats.forEach((cat, i) => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (i === 0? ' active' : '');
    chip.dataset.cat = cat.toLowerCase();
    chip.textContent = cat;
    chip.onclick = () => setCategory(cat.toLowerCase(), chip);
    row.appendChild(chip);
  });
}

function setCategory(cat, el) {
  activeCategory = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderAllTools();
}

// ── SEARCH ──
function filterTools() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  renderAllTools();
}

// ── RENDER PINNED BAR ──
function renderPinnedBar() {
  const row1 = document.getElementById('pinnedRow1');
  const row2 = document.getElementById('pinnedRow2');
  row1.innerHTML = '';
  row2.innerHTML = '';

  for (let i = 0; i < 14; i++) {
    const name = pinned[i];
    const tool = name? allTools.find(t => t.name === name) : null;
    const slot = document.createElement('div');
    slot.className = 'pinned-slot' + (tool? ' filled' : '');
    slot.dataset.idx = i;

    if (tool) {
      slot.innerHTML = `<img src="${tool.image}" alt="${tool.name}"><span class="remove-x">✕</span>`;
      slot.onclick = () => unpinAt(i);
      slot.title = tool.name;
    }

    if (i < 7) row1.appendChild(slot);
    else row2.appendChild(slot);
  }
  document.getElementById('slotBadge').textContent = `${pinned.length} / 14`;
}

// ── RENDER ALL TOOLS ──
function renderAllTools() {
  const grid = document.getElementById('allToolsGrid');
  const empty = document.getElementById('emptyState');

  let filtered = allTools.filter(t => {
    const matchCat = activeCategory === 'all' || (t.category || 'general').toLowerCase() === activeCategory;
    const matchSearch =!searchQuery || t.name.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(t => {
    const isPinned = pinned.includes(t.name);
    return `
      <div class="tool-pick-item${isPinned? ' pinned' : ''}" data-name="${t.name}" onclick="togglePin('${t.name}')">
        <div class="pin-check">✓</div>
        <img src="${t.image}" alt="${t.name}">
        <span class="tool-pick-name">${t.name}</span>
      </div>`;
  }).join('');
}

// ── PIN / UNPIN ──
function togglePin(name) {
  if (pinned.includes(name)) {
    pinned = pinned.filter(n => n!== name);
  } else {
    if (pinned.length >= MAX_PINS) {
      showToast();
      return;
    }
    pinned.push(name);
  }
  renderPinnedBar();
  renderAllTools();
  autoSave();
}

function unpinAt(idx) {
  pinned.splice(idx, 1);
  renderPinnedBar();
  renderAllTools();
  autoSave();
}

// ── TOAST ──
let toastTimer;
function showToast() {
  const t = document.getElementById('fullToast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── START ──
init();
</script>
</body>
</html>
