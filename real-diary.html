<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Trader Journal</title>
    <style>
        :root {
            --paper: #010d08;
            --line: #064e3b;
            --margin: #10b981;
            --accent: #10b981;
            --dark: #000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; height: 100vh;
            display: flex; font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 1500px;
        }

        /* Sidebar & Overlay */
        #sidebar {
            width: 280px; background: var(--paper); color: white; padding: 25px;
            display: flex; flex-direction: column; position: fixed; height: 100%;
            left: -280px; transition: transform 0.4s ease; z-index: 2000;
            border-right: 1px solid var(--line);
        }
        #sidebar.open { transform: translateX(280px); }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); opacity: 0; pointer-events: none;
            transition: 0.3s; z-index: 1500;
        }
        #overlay.active { opacity: 1; pointer-events: auto; }

        /* Menu Sections */
        .menu-section { margin-top: 25px; border-top: 1px solid var(--line); pt: 15px; }
        .menu-section h4 { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; opacity: 0.8; margin-top: 15px;}
        .menu-item { 
            padding: 10px; display: flex; align-items: center; gap: 10px; 
            cursor: pointer; border-radius: 5px; transition: 0.2s; font-size: 0.95rem;
        }
        .menu-item:hover { background: var(--line); }

        /* Full Screen Layout */
        #main-container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding-top: 10px; position: relative; width: 100%;
        }
        .book-wrapper { position: relative; width: 98%; height: 96vh; transform-style: preserve-3d; }
        
        .page {
            width: 100%; height: 100%; background: var(--paper);
            border-radius: 5px 15px 15px 5px; position: relative; z-index: 10;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s ease;
        }

        .toolbar {
            padding: 10px 15px; background: var(--line); border-bottom: 1px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 5px 15px 0 0; z-index: 100; color: var(--accent);
        }

        #scrollBox {
            flex: 1; overflow-y: auto; position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .paper-canvas-area {
            position: relative; min-height: 2500px;
            background-image: 
                linear-gradient(90deg, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
                linear-gradient(var(--line) 1px, transparent 1px);
            background-size: 100% 2.8rem;
        }
        
        textarea {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: transparent; border: none; outline: none; padding: 0 20px 0 70px;
            font-size: 1.3rem; line-height: 2.8rem; font-family: 'Courier New', monospace;
            resize: none; z-index: 1; color: #ecfdf5;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }

        /* Custom Modal System */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; z-index: 3000;
        }
        .custom-modal { 
            background: var(--paper); padding: 25px; border-radius: 15px; 
            width: 85%; max-width: 320px; border: 2px solid var(--accent);
            display: flex; flex-direction: column; gap: 15px;
        }
        .custom-modal input {
            background: #000; border: 1px solid var(--line); color: var(--accent);
            padding: 12px; border-radius: 8px; font-size: 1rem;
        }

        /* Tools */
        .tool-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--line); padding: 5px 10px; border-radius: 50px;
            display: flex; gap: 5px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 1000;
            border: 1px solid var(--accent);
        }
        .tool-bar button {
            border: none; padding: 10px 14px; border-radius: 25px;
            font-weight: bold; font-size: 0.75rem; background: transparent; color: var(--accent);
        }
        .tool-bar button.active { background: var(--accent); color: #000; }

        .page-flip-left { transform: translateX(-110%) rotateY(-20deg); opacity: 0; }
        .page-flip-right { transform: translateX(110%) rotateY(20deg); opacity: 0; }
    </style>
</head>
<body>

<div id="modal-box" class="modal-overlay">
    <div class="custom-modal">
        <h3 style="color:var(--accent)">New Journal</h3>
        <input type="number" id="inYear" placeholder="Year (e.g. 2026)">
        <input type="text" id="inTitle" placeholder="Journal Name">
        <button onclick="saveNewBook()" style="background:var(--accent); color:#000; padding:12px; border:none; border-radius:8px; font-weight:bold">Create Book</button>
        <button onclick="closeModal()" style="color:var(--accent); background:none; border:none;">Cancel</button>
    </div>
</div>

<div id="date-modal" class="modal-overlay">
    <div class="custom-modal">
        <h3 style="color:var(--accent)">Select Date</h3>
        <input type="date" id="customDateInput">
        <button onclick="confirmCustomDate()" style="background:var(--accent); color:#000; padding:12px; border:none; border-radius:8px; font-weight:bold">Go to Page</button>
        <button onclick="closeDateModal()" style="color:var(--accent); background:none; border:none;">Cancel</button>
    </div>
</div>

<div id="sidebar">
    <h2 style="margin-bottom:10px; color:var(--accent)">Trader Hub 💹</h2>
    
    <div class="menu-section">
        <h4>Library</h4>
        <div id="bookList" style="max-height: 150px; overflow-y:auto"></div>
        <button onclick="openModal()" style="padding:10px; background:var(--accent); border:none; color:#000; border-radius:8px; width:100%; font-weight:bold; margin-top:10px">+ New Journal</button>
    </div>

    <div class="menu-section">
        <h4>Tools & Analytics</h4>
        <div class="menu-item">📈 Strategy Performance</div>
        <div class="menu-item">🧮 Position Size Calc</div>
        <div class="menu-item">📊 P&L Calendar</div>
    </div>

    <div class="menu-section">
        <h4>Settings</h4>
        <div class="menu-item">☁️ Cloud Sync</div>
        <div class="menu-item">🎨 Theme Manager</div>
    </div>
</div>

<div id="overlay" onclick="toggleSidebar()"></div>

<div id="main-container">
    <div class="book-wrapper">
        <div class="page" id="pageUI">
            <div class="toolbar">
                <span onclick="toggleSidebar()" style="font-size:1.5rem; cursor:pointer">☰</span>
                <div id="dateText" style="font-weight:bold; cursor:pointer" onclick="openDatePicker()">Date</div>
                <div id="curBookLabel" style="font-size:0.7rem; opacity:0.7">No Book</div>
            </div>
            
            <div id="scrollBox">
                <div class="paper-canvas-area" id="drawArea">
                    <textarea id="textInput" placeholder="Log your trades..."></textarea>
                    <canvas id="mainCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="tool-bar">
        <button id="modeText" class="active" onclick="setMode('text')">Type</button>
        <button id="modePen" onclick="setMode('pen')">Pen</button>
        <button id="modeErase" onclick="setMode('erase')">Eraser</button>
    </div>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('shelf_final_v5') || '[]');
    let curId = null, dayIdx = 0, mode = 'text', drawing = false, touchStartX = 0;
    
    const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
    const scrollBox = document.getElementById('scrollBox'), textInput = document.getElementById('textInput');
    const pageUI = document.getElementById('pageUI');

    window.onload = () => {
        renderLibrary();
        if(books.length > 0) loadBook(books[0].id);
        else openModal();
        window.addEventListener('resize', resizeCanvas);
    };

    function resizeCanvas() {
        const area = document.getElementById('drawArea');
        canvas.width = area.clientWidth;
        canvas.height = area.scrollHeight; 
        reloadDrawing();
    }

    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    function openModal() { document.getElementById('modal-box').style.display='flex'; }
    function closeModal() { document.getElementById('modal-box').style.display='none'; }
    function openDatePicker() { if(curId) document.getElementById('date-modal').style.display='flex'; }
    function closeDateModal() { document.getElementById('date-modal').style.display='none'; }

    function confirmCustomDate() {
        const val = document.getElementById('customDateInput').value;
        if(!val) return;
        const d = new Date(val), b = books.find(x => x.id === curId);
        dayIdx = Math.floor((d - new Date(b.y, 0, 0)) / 86400000) - 1;
        loadPage(); closeDateModal();
    }

    function saveNewBook() {
        const y = document.getElementById('inYear').value, t = document.getElementById('inTitle').value;
        if(!y || !t) return;
        const id = 'id_' + Date.now();
        books.push({id, y, t});
        localStorage.setItem('shelf_final_v5', JSON.stringify(books));
        closeModal(); renderLibrary(); loadBook(id);
    }

    function renderLibrary() {
        const list = document.getElementById('bookList'); list.innerHTML = '';
        books.forEach(b => {
            const d = document.createElement('div');
            d.style.padding='8px'; d.style.background='#064e3b'; d.style.marginBottom='5px'; d.style.borderRadius='5px'; d.style.cursor='pointer'; d.style.fontSize='0.85rem';
            d.innerHTML = `<span style="color:#10b981">${b.t}</span><span onclick="deleteBook('${b.id}', event)" style="color:#ff4d4d; float:right">🗑</span>`;
            d.onclick = () => loadBook(b.id);
            list.appendChild(d);
        });
    }

    function loadBook(id) {
        curId = id; const b = books.find(x => x.id === id);
        document.getElementById('curBookLabel').textContent = b.t;
        loadPage(); if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
    }

    function loadPage() {
        if(!curId) return;
        const b = books.find(x => x.id === curId);
        const date = new Date(b.y, 0, 1); date.setDate(date.getDate() + dayIdx);
        document.getElementById('dateText').textContent = date.toLocaleDateString('en-US', {month:'short', day:'2-digit', year:'numeric'});
        textInput.value = localStorage.getItem(`t_${curId}_${dayIdx}`) || "";
        resizeCanvas();
    }

    function reloadDrawing() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        const imgData = localStorage.getItem(`s_${curId}_${dayIdx}`);
        if(imgData) { const img = new Image(); img.onload = () => ctx.drawImage(img,0,0); img.src = imgData; }
    }

    function setMode(m) {
        mode = m;
        document.querySelectorAll('.tool-bar button').forEach(b => b.classList.remove('active'));
        document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
        canvas.style.pointerEvents = (m === 'text') ? 'none' : 'auto';
        if(m !== 'text') textInput.blur();
    }

    function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top + scrollBox.scrollTop };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if(mode === 'text') return;
        const p = getPos(e);
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    });

    canvas.addEventListener('pointermove', (e) => {
        if(!drawing) return;
        const p = getPos(e);
        ctx.globalCompositeOperation = (mode==='erase') ? 'destination-out' : 'source-over';
        ctx.lineWidth = (mode==='erase') ? 40 : 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#10b981';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    });

    window.addEventListener('pointerup', () => { if(drawing) { drawing = false; saveCanvas(); } });
    function saveCanvas() { localStorage.setItem(`s_${curId}_${dayIdx}`, canvas.toDataURL()); }

    textInput.oninput = () => localStorage.setItem(`t_${curId}_${dayIdx}`, textInput.value);

    scrollBox.addEventListener('touchstart', e => { if(scrollBox.scrollTop === 0) touchStartX = e.touches[0].clientX; }, {passive: true});
    scrollBox.addEventListener('touchend', e => {
        if(mode !== 'text' || !curId) return;
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 100) {
            if (diff > 0) { pageUI.classList.add('page-flip-left'); setTimeout(() => { dayIdx++; navigate(); }, 300); }
            else { pageUI.classList.add('page-flip-right'); setTimeout(() => { dayIdx--; navigate(); }, 300); }
        }
    }, {passive: true});

    function navigate() {
        dayIdx = Math.max(0, dayIdx);
        loadPage();
        pageUI.classList.remove('page-flip-left', 'page-flip-right');
    }

    function deleteBook(id, e) {
        e.stopPropagation();
        if(confirm("Delete this journal?")) {
            books = books.filter(x => x.id !== id);
            localStorage.setItem('shelf_final_v5', JSON.stringify(books));
            renderLibrary();
        }
    }
</script>
</body>
</html>
