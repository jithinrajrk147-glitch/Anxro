name: Auto Make Zip
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files to zip
        run: |
          echo "Files in repo:"
          ls -la
          echo "---"

      - name: Create zip
        run: |
          shopt -s dotglob
          zip -r app-v${{ github.run_number }}.zip * -x ".git*" -x ".github*" -x "*.zip" -x "app-version.json"

      - name: Create version json
        run: |
          echo '{"version": ${{ github.run_number }}, "zip_url": "https://jithinrajrk147-glitch.github.io/Anxro/app-v${{ github.run_number }}.zip"}' > app-version.json

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json app-v${{ github.run_number }}.zip
          git commit -m "Auto release v${{ github.run_number }}" || echo "Nothing to commit"
          git push
