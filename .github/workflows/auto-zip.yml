name: Auto Make Zip

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Old Temp
        run: |
          rm -rf temp
          mkdir temp

      - name: Copy All Website Files
        run: |

          shopt -s dotglob

          for item in *; do

            if [[ "$item" != ".git" &&
                  "$item" != ".github" &&
                  "$item" != "temp" &&
                  "$item" != "app-version.json" &&
                  "$item" != app-v*.zip ]]; then

              cp -r "$item" temp/

            fi

          done

      - name: Create ZIP
        run: |

          cd temp

          zip -r ../app-v${{ github.run_number }}.zip .

      - name: Create Version JSON
        run: |

          echo '{
            "version": '${{ github.run_number }}',
            "zip_url": "https://jithinrajrk147-glitch.github.io/Anxro/app-v${{ github.run_number }}.zip"
          }' > app-version.json

      - name: Commit Files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Auto update v${{ github.run_number }}" || echo "Nothing to commit"

          git push