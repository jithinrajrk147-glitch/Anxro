<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anxro | Elite Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* Professional Palette */
:root {
    --bg-deep: #010a05;
    --glass-card: rgba(6, 45, 31, 0.95);
    --emerald-glow: #10b981;
    --emerald-dark: #064e3b;
    --input-field: rgba(1, 13, 8, 0.6);
    --text-primary: #ffffff;
    --text-dim: #94a3b8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top right, #064e3b, var(--bg-deep));
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Main Elite Card */
.elite-container {
    width: 100%;
    max-width: 380px;
    background: var(--glass-card);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 40px 25px;
    border: 1px solid rgba(16, 185, 129, 0.2);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    text-align: center;
}

.title-group h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #fff, var(--emerald-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.title-group p {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 5px;
    margin-bottom: 30px;
}

/* Sophisticated Avatar Upload */
.avatar-container {
    position: relative;
    width: 110px;
    height: 110px;
    margin: 0 auto 35px;
}

.avatar-preview {
    width: 100%;
    height: 100%;
    border-radius: 30px; /* Modern Squircle shape */
    object-fit: cover;
    border: 2px solid var(--emerald-glow);
    background: var(--input-field);
}

.upload-badge {
    position: absolute;
    bottom: -10px;
    right: -10px;
    background: var(--emerald-glow);
    color: var(--bg-deep);
    width: 34px;
    height: 34px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14px;
    border: 3px solid var(--glass-card);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* Professional Input Group */
.input-group {
    position: relative;
    margin-bottom: 20px;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--emerald-glow);
    text-transform: uppercase;
    margin-left: 12px;
    margin-bottom: 6px;
    letter-spacing: 1px;
}

.input-group input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.05);
    background: var(--input-field);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
}

.input-group input:focus {
    border-color: var(--emerald-glow);
    background: rgba(16, 185, 129, 0.05);
}

/* Elite Action Button */
.btn-save {
    width: 100%;
    padding: 16px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg, var(--emerald-glow), #059669);
    color: var(--bg-deep);
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
    transition: 0.3s;
}

.btn-save:active { transform: translateY(2px); box-shadow: none; }

/* Custom Pro Modal */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: var(--glass-card);
    width: 80%;
    max-width: 300px;
    padding: 35px 25px;
    border-radius: 30px;
    border: 1px solid var(--emerald-glow);
    text-align: center;
    animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-content i { font-size: 50px; color: var(--emerald-glow); margin-bottom: 15px; }
.modal-content button {
    margin-top: 20px; width: 100%; padding: 12px; border-radius: 12px;
    border: none; background: #fff; color: #000; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>

<div class="elite-container">
    <div class="title-group">
        <h2>Account Settings</h2>
        <p>Manage your professional identity</p>
    </div>

    <div class="avatar-container" onclick="document.getElementById('fileIn').click()">
        <img src="https://via.placeholder.com/150?text=User" id="preview" class="avatar-preview">
        <div class="upload-badge"><i class="fa fa-pencil"></i></div>
        <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="handleImage(event)">
    </div>

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="E.g. s__y_a">
    </div>

    <div class="input-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
    </div>

    <div class="input-group">
        <label>Secure 5-Digit Code</label>
        <input type="number" id="code" placeholder="00000" oninput="limitCode(this)">
    </div>

    <button class="btn-save" onclick="saveData()">Update Profile</button>
</div>

<div class="modal" id="customAlert">
    <div class="modal-content">
        <i id="mIcon" class="fa fa-circle-check"></i>
        <h3 id="mTitle" style="margin:10px 0;">Success</h3>
        <p id="mMsg" style="color:var(--text-dim); font-size:14px;">Changes saved successfully.</p>
        <button onclick="closeModal()">Dismiss</button>
    </div>
</div>

<script>
let profile = JSON.parse(localStorage.getItem('userProfile')) || {};
let avatarBase64 = profile.avatar || "";

// Initialize
if(profile.name) {
    document.getElementById('name').value = profile.name;
    document.getElementById('dob').value = profile.dob;
    document.getElementById('code').value = profile.userId;
    document.getElementById('preview').src = profile.avatar;
}

function handleImage(e) {
    const reader = new FileReader();
    reader.onload = () => {
        avatarBase64 = reader.result;
        document.getElementById('preview').src = avatarBase64;
    };
    reader.readAsDataURL(e.target.files[0]);
}

function limitCode(el) { if(el.value.length > 5) el.value = el.value.slice(0, 5); }

function showPopup(title, msg, icon) {
    document.getElementById('mTitle').innerText = title;
    document.getElementById('mMsg').innerText = msg;
    document.getElementById('mIcon').className = "fa " + icon;
    document.getElementById('customAlert').style.display = "flex";
}

function closeModal() {
    document.getElementById('customAlert').style.display = "none";
    if(document.getElementById('mTitle').innerText === "Success") {
        window.location.href = "third.html";
    }
}

function saveData() {
    const n = document.getElementById('name').value.trim();
    const d = document.getElementById('dob').value;
    const c = document.getElementById('code').value.trim();

    if(!n || !d || c.length !== 5 || !avatarBase64) {
        showPopup("Missing Info", "All fields and avatar are required.", "fa-triangle-exclamation");
        return;
    }

    localStorage.setItem('userProfile', JSON.stringify({
        name: n, dob: d, userId: c, avatar: avatarBase64
    }));

    showPopup("Success", "Your profile has been synchronized.", "fa-circle-check");
}
</script>
</body>
</html>
