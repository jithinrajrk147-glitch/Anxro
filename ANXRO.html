<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANXRO Logo - Final Version</title>
    <style>
        :root {
             /* Change from dark green to light emerald */
    --emerald-dark: #7CEB92; 
        
            /* Logic Variables */
            --image-height: 40px;
            --pos-apart: -100px;
            --pos-merge: 7.5px; /* Precise meeting point */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        /* LOGO STRUCTURE */
        .logo-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
 @font-face {
  font-family: 'Bungee';
  src: url('fonts/Bungee-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
        .text {
            font-family: 'Bungee', sans-serif;
            font-size: 20px;
            color: var(--emerald-dark);
            /* Positioning text lower */
            margin-top: 2px; 
            transition: transform 0.8s ease;
        }

        .x-join-area {
            position: relative;
            width:16px; /* Space where X forms */
            height: var(--image-height);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .figure {
            position: absolute;
            height: 100%;
            width: auto;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s;
            will-change: transform;
            opacity: 0;
        }

        /* Horizontal Movement Setup */
        #fig-left {
            transform: translateX(var(--pos-apart));
        }

        #fig-right {
            transform: scaleX(-1) translateX(var(--pos-apart));
        }

        /* Active Animation State */
        .animate #fig-left {
            transform: translateX(calc(-1 * var(--pos-merge)));
            opacity: 1;
        }

        .animate #fig-right {
            transform: scaleX(-1) translateX(calc(-1 * var(--pos-merge)));
            opacity: 1;
        }


    </style>
</head>
<body>


    <div class="logo-wrapper" id="logo-container">
        <div class="text">AN</div>
        <div class="x-join-area">
            <img src="image/load.png" id="fig-left" class="figure">
            <img src="image/load.png" id="fig-right" class="figure">
        </div>
        <div class="text">RO</div>
    </div>

    <script>
        window.onload = () => {

</body>
</html>
